<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide 5 - animated kitchen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="slides.css">
  <style>
    html, body { background: #1b1412; }
    body { padding: 0; overflow: hidden; }
    .deck { position: absolute; left: 0; top: 0; transform-origin: 0 0; zoom: 1; display: block; gap: 0; }
    /* Hai lớp hiệu ứng nằm trên ảnh bếp: #glow (ánh lửa mượt, trộn "screen") và #pix (khói, lửa, gà vẽ pixel) */
    .s5 .photo { overflow: hidden; }
    #glow, #pix { position: absolute; left: 0; top: 0; width: 875px; height: 608px; pointer-events: none; }
    #glow { mix-blend-mode: screen; }
    #pix { image-rendering: pixelated; }
  </style>
</head>
<body>
<!--
  SLIDE 5 (động): ảnh bếp củi giữ nguyên, chồng thêm hiệu ứng: lửa bập bùng + ánh sáng cam nhấp nháy, khói bốc lên từ bếp,
  hơi nước từ nồi, tàn lửa, bụi bay trong các tia nắng lọt qua vách tre, gà pixel đi mổ thóc trên nền nhà.
  Lớp pixel là canvas 219x152 điểm (mỗi điểm = 4px). Vị trí lửa / nồi chỉnh ở hằng số FIRE, POT.
  Mở với ?still=giây để dừng ở một khung hình.
-->
<main class="deck">
  <section class="slide s5" id="slide5">
    <h2 class="title">Daily Living Conditions</h2>
    <hr class="rule">
    <article class="card c1"><h3>Basic Household Tools</h3><p>No modern appliances, simple tools only</p></article>
    <article class="card c2"><h3>Traditional Cooking</h3><p>Meals prepared on wood, straw, or charcoal stoves</p></article>
    <figure class="photo">
      <img src="assets/s5-kitchen.jpg" alt="Traditional kitchen with a wood fire">
      <canvas id="glow" width="438" height="304"></canvas>
      <canvas id="pix" width="219" height="152"></canvas>
    </figure>
  </section>
</main>

<script>
(() => {
  const EMBED = location.search.includes('embed');
  const STILL = (/[?&]still=([\d.]+)/.exec(location.search) || [])[1];
  const deck = document.querySelector('.deck');
  function fit() {
    const k = EMBED ? Math.max(innerWidth / 1536, innerHeight / 864) : Math.min(innerWidth / 1536, innerHeight / 864);
    Object.assign(deck.style, { transform: 'scale(' + k + ')', left: ((innerWidth - 1536 * k) / 2) + 'px', top: ((innerHeight - 864 * k) / 2) + 'px' });
  }
  if (EMBED) document.body.style.cssText = 'background:transparent;padding:0;overflow:hidden';
  addEventListener('resize', fit); fit();

  const W = 219, H = 152;                       // lớp pixel (1 điểm = 4px trên ảnh 875x608)
  const gc = document.getElementById('glow').getContext('2d');
  const g = document.getElementById('pix').getContext('2d');
  const FIRE = { x: 135, y: 112 }, POT = { x: 133, y: 99 };

  let seed = 20260;
  const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };

  // ---------- hạt: khói, hơi nước, tàn lửa, bụi ----------
  const smoke = [], steam = [], embers = [], dust = [];
  for (let i = 0; i < 46; i++) dust.push({ x: 30 + rnd() * 170, y: 12 + rnd() * 85, ph: rnd() * 6.28, sp: 0.3 + rnd() * 0.7, bright: rnd() });
  let sAcc = 0, stAcc = 0, eAcc = 0;

  // ---------- gà ----------
  const hens = [
    { x: 40, y: 139, d: 1, v: 9, st: 'walk', tm: 0, ph: 0, big: 1 },
    { x: 80, y: 141, d: -1, v: 7, st: 'peck', tm: 1.2, ph: 2, big: 0 }
  ];
  function stepHens(dt) {
    for (const h of hens) {
      h.tm -= dt; h.ph += dt;
      if (h.st === 'walk') {
        h.x += h.d * h.v * dt;
        if (h.x > 185) h.d = -1; else if (h.x < 12) h.d = 1;
        if (h.tm <= 0) { h.st = 'peck'; h.tm = 1.6 + rnd() * 1.6; }
      } else if (h.tm <= 0) { h.st = 'walk'; h.tm = 2.5 + rnd() * 3; if (rnd() < 0.4) h.d = -h.d; }
    }
  }
  function drawHen(h) {
    const s = h.d, big = h.big, u = (x, y, w, hh, c) => R(h.x + s * x - (s < 0 ? w - 1 : 0), h.y + y, w, hh, c);
    const bob = h.st === 'walk' ? Math.round(Math.abs(Math.sin(h.ph * 9)) * 1) : 0;
    const peck = h.st === 'peck' ? Math.max(0, Math.sin(h.ph * 8)) : 0;
    const bd = big ? '#b8582c' : '#d9a441', wing = big ? '#8a3a1c' : '#b9812a';
    const sc = big ? 1 : 0;
    // chân
    const leg = h.st === 'walk' ? Math.round(Math.sin(h.ph * 9)) : 0;
    u(-1 + leg, -3 + bob, 1, 3, '#e0a030'); u(2 - leg, -3 + bob, 1, 3, '#e0a030');
    // thân + đuôi
    u(-4, -9 + bob, 9, 6, bd); u(-5, -10 + bob, 2, 4, wing); u(-4, -8 + bob, 5, 3, wing);
    u(-5, -11 + bob, 1, 2, bd);
    // cổ + đầu (cúi xuống khi mổ)
    const hy = -13 + bob + Math.round(peck * 6), hx = 5 + Math.round(peck * 2);
    u(4, -11 + bob + Math.round(peck * 3), 2, 3, bd);
    u(hx, hy, 4, 4, bd); u(hx + 3, hy + 1, 2, 1, '#f2b632');
    u(hx + 1, hy + 1, 1, 1, '#1b1412');
    if (big) { u(hx + 1, hy - 1, 2, 1, '#d6262c'); u(hx + 3, hy + 3, 1, 2, '#d6262c'); }
  }

  // ---------- cập nhật ----------
  function stepAll(dt, t) {
    sAcc += dt; stAcc += dt; eAcc += dt;
    while (sAcc > 0.16) { sAcc -= 0.16; smoke.push({ x: FIRE.x - 3 + rnd() * 8, y: POT.y - 7 + rnd() * 3, vx: 1.4 + rnd() * 2.2, vy: -(5 + rnd() * 3.5), a: 0, life: 4.6 + rnd() * 2, s: 3 + rnd() * 3 }); }
    while (stAcc > 0.24) { stAcc -= 0.24; steam.push({ x: POT.x - 4 + rnd() * 9, y: POT.y - 4, ph: rnd() * 6, a: 0, life: 2.4 + rnd() * 1.2 }); }
    while (eAcc > 0.1) { eAcc -= 0.1; embers.push({ x: FIRE.x + (rnd() - 0.5) * 9, y: FIRE.y - 3, vx: (rnd() - 0.5) * 6, vy: -(8 + rnd() * 14), a: 0, life: 1.2 + rnd() * 1.4 }); }
    for (const p of smoke) { p.a += dt; p.x += (p.vx + Math.sin(t * 0.8 + p.y * 0.1) * 1.2) * dt; p.y += p.vy * dt; p.vy *= 0.998; }
    for (const p of steam) { p.a += dt; p.y -= 9 * dt; p.x += Math.sin(t * 3 + p.ph) * 4 * dt; }
    for (const p of embers) { p.a += dt; p.x += p.vx * dt + Math.sin(t * 5 + p.a * 8) * 0.12; p.y += p.vy * dt; p.vx *= 0.99; }
    for (const p of smoke.splice(0)) if (p.a < p.life && p.y > -6) smoke.push(p);
    for (const p of steam.splice(0)) if (p.a < p.life) steam.push(p);
    for (const p of embers.splice(0)) if (p.a < p.life) embers.push(p);
    stepHens(dt);
  }

  // ---------- vẽ ----------
  function flick(t) { return 0.82 + 0.18 * Math.sin(t * 13) * Math.sin(t * 7.3 + 1) + 0.08 * Math.sin(t * 31); }
  function draw(t) {
    // lớp mượt: ánh lửa cam + quầng sáng trên vách, nhấp nháy
    gc.clearRect(0, 0, 438, 304);
    const f = flick(t), gx = FIRE.x * 2, gy = FIRE.y * 2;
    let rg = gc.createRadialGradient(gx, gy, 4, gx, gy, 150 * (0.9 + 0.1 * f));
    rg.addColorStop(0, 'rgba(255,150,50,' + (0.8 * f) + ')'); rg.addColorStop(0.35, 'rgba(230,90,20,' + (0.34 * f) + ')'); rg.addColorStop(1, 'rgba(120,40,10,0)');
    gc.fillStyle = rg; gc.fillRect(0, 0, 438, 304);
    rg = gc.createRadialGradient(gx, gy - 20, 2, gx, gy - 20, 44);
    rg.addColorStop(0, 'rgba(255,230,150,' + (0.45 * f) + ')'); rg.addColorStop(1, 'rgba(255,170,60,0)');
    gc.fillStyle = rg; gc.fillRect(0, 0, 438, 304);

    // lớp pixel
    g.clearRect(0, 0, W, H);
    // khói
    for (const p of smoke) {
      const a = p.a / p.life, sz = Math.round(p.s * (0.7 + a * 1.4));
      g.globalAlpha = Math.max(0, 0.5 * Math.sin(Math.min(1, a * 1.15) * Math.PI) * (1 - a * 0.4));
      R(p.x, p.y, sz, sz, '#cfc9c0'); R(p.x + 1, p.y + 1, Math.max(1, sz - 2), Math.max(1, sz - 2), '#e7e2d8');
    }
    // hơi nước từ nồi
    for (const p of steam) {
      const a = p.a / p.life; g.globalAlpha = 0.62 * Math.sin(a * Math.PI);
      R(p.x, p.y, 2 + Math.round(a * 3), 2, '#f4f1ea');
    }
    g.globalAlpha = 1;
    // ngọn lửa pixel (3 lưỡi, cao thấp khác nhau)
    for (let i = 0; i < 4; i++) {
      const bx = FIRE.x - 4 + i * 3, hh = 4 + Math.round((Math.sin(t * (9 + i * 2.3) + i * 1.7) * 0.5 + 0.5) * 6 * f);
      const sw = Math.round(Math.sin(t * 7 + i) * 1);
      for (let y = 0; y < hh; y++) {
        const k = y / hh, w = y < hh - 2 ? 2 : 1, col = k < 0.35 ? '#fff3a0' : k < 0.7 ? '#ffb02e' : '#ff5a1a';
        R(bx + (y > 2 ? sw : 0), FIRE.y + 4 - y, w, 1, col);
      }
    }
    // tàn lửa
    for (const p of embers) {
      const a = p.a / p.life; g.globalAlpha = 1 - a;
      R(p.x, p.y, 1, 1, a < 0.4 ? '#fff3a0' : '#ff8a2a');
    }
    g.globalAlpha = 1;
    // bụi lấp lánh trong các tia nắng
    for (const d of dust) {
      const x = d.x + Math.sin(t * 0.4 * d.sp + d.ph) * 4, y = ((d.y + t * 1.5 * d.sp) % 90) + 10;
      const tw = 0.5 + 0.5 * Math.sin(t * 1.6 * d.sp + d.ph * 3);
      g.globalAlpha = 0.15 + 0.6 * tw * d.bright;
      R(x, y, 1, 1, '#fff6dc');
    }
    g.globalAlpha = 1;
    // gà
    hens.slice().sort((a, b) => a.y - b.y).forEach(drawHen);
  }

  let t = 0, last = 0, acc = 0;
  const FIX = 1 / 60;
  function step() { t += FIX; stepAll(FIX, t); }
  function loop(now) {
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    while (acc >= FIX) { step(); acc -= FIX; }
    draw(t);
    requestAnimationFrame(loop);
  }
  if (STILL) { const n = Math.round(parseFloat(STILL) / FIX); for (let i = 0; i < n; i++) step(); draw(t); window.__ready = true; }
  else { last = performance.now(); for (let i = 0; i < 360; i++) step(); requestAnimationFrame(loop); }   // chạy trước 6s để khói đã bay sẵn khi mở slide
  addEventListener('keydown', (e) => {
    if (!EMBED || window.parent === window) return;
    if (e.key === 'Backspace') e.preventDefault();
    window.parent.postMessage({ type: 'slide-key', key: e.key }, '*');
  });
})();
</script>
</body>
</html>
