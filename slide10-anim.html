<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide 10 - the ending</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<!--
  SLIDE 10 (cảnh kết), vẽ hoàn toàn bằng code (canvas 2D) + ảnh sân khấu assets/stage.jpg:
    0.5s  màn hình tối, camera đang phóng rất to vào chiếc ghế
    -> 7s  phóng nhỏ dần: chiếc ghế gỗ một mình trong căn phòng kinh dị (đèn chập chờn, sương, bụi, ghế rục rịch)
    -> 8s  lao vào ghế cực nhanh, loé trắng
    -> 9s+ sân khấu: rèm đỏ mở ra, pháo hoa, pháo phun, giấy hoa, chữ THANK YOU. Chiếc ghế vẫn ở giữa sân khấu.
  Mở với ?still=giây để dừng ở một khung hình (dùng để xuất slide10.png).
-->
<script>
(() => {
  const EMBED = location.search.includes('embed');
  const STILL = (/[?&]still=([\d.]+)/.exec(location.search) || [])[1];
  if (EMBED) document.body.style.background = '#000';
  const cv = document.getElementById('c'), mainCtx = cv.getContext('2d');
  let ctx = mainCtx;
  let W = 0, H = 0, dpr = 1;
  const mask = document.createElement('canvas'), mctx = mask.getContext('2d');
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.width = mask.width = Math.round(innerWidth * dpr);
    H = cv.height = mask.height = Math.round(innerHeight * dpr);
  }
  addEventListener('resize', resize); resize();

  // ----- mốc thời gian (giây) -----
  const T = { hz0: 0.5, hz1: 7.0, rush1: 7.9, white0: 7.72, white1: 8.15, whiteOut: 8.9, open0: 9.4, open1: 11.8, fw0: 10.4, text: 12.6, zoom0: 7.0 };

  // ----- tiện ích -----
  const ramp = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
  const smooth = (u) => u * u * (3 - 2 * u);
  const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const noise1 = (t) => { const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f); return hash(i) * (1 - u) + hash(i + 1) * u; };
  let seed = 7711;
  const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  // ----- ảnh: sân khấu, vết ố tường, nhiễu hạt -----
  const stage = new Image(); stage.src = 'assets/stage.jpg';
  const stain = document.createElement('canvas'); stain.width = 512; stain.height = 288;
  (() => {
    const g = stain.getContext('2d'); g.fillStyle = '#7f8a8c'; g.fillRect(0, 0, 512, 288);
    for (let i = 0; i < 70; i++) {
      const x = hash(i * 3) * 512, y = hash(i * 3 + 1) * 288, r = 20 + hash(i * 3 + 2) * 90, dark = hash(i + 99) < 0.7;
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, dark ? 'rgba(10,14,16,0.55)' : 'rgba(170,185,180,0.22)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    for (let i = 0; i < 90; i++) { g.strokeStyle = 'rgba(0,0,0,0.12)'; g.lineWidth = 1 + hash(i) * 2; const x = hash(i * 7) * 512; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + (hash(i * 5) - 0.5) * 30, 288); g.stroke(); }
  })();
  const grain = document.createElement('canvas'); grain.width = grain.height = 256;
  (() => { const g = grain.getContext('2d'), d = g.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = Math.floor(rnd() * 255); d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); })();
  const glowCache = {};
  function glowSprite(col) {                                  // chấm sáng mềm để vẽ tia pháo hoa / ánh đèn
    if (glowCache[col]) return glowCache[col];
    const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(0.18, col); rg.addColorStop(0.5, col.replace(/[\d.]+\)$/, '0.25)')); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(0, 0, 64, 64); return (glowCache[col] = c);
  }

  // ================= CHIẾC GHẾ (vẽ bằng gradient, nhìn trực diện) =================
  // (x, y) là điểm chạm sàn ở giữa chân ghế; h là chiều cao ghế; ang (rad) nghiêng quanh chân; lift nhấc ghế lên (px)
  function chair(x, y, h, ang, lift, lightK) {
    const u = h, K = lightK == null ? 1 : lightK;
    const wood = (x0, w, hi) => { const g = ctx.createLinearGradient(x0, 0, x0 + w, 0); g.addColorStop(0, '#2a170a'); g.addColorStop(0.45, hi || '#7d5430'); g.addColorStop(1, '#2b180b'); return g; };
    ctx.save(); ctx.translate(x, y - lift); ctx.rotate(ang);
    const rect = (cx, y0, w, y1, hi) => { ctx.fillStyle = wood(cx - w / 2, w, hi); ctx.fillRect(cx - w / 2, y0, w, y1 - y0); };
    // chân sau + trụ lưng ghế (cao)
    for (const s of [-1, 1]) rect(s * 0.165 * u, -0.96 * u, 0.04 * u, 0, '#6a4526');
    // thanh dọc lưng ghế
    for (const s of [-0.09, 0, 0.09]) rect(s * u, -0.88 * u, 0.028 * u, -0.43 * u, '#5d3c20');
    // thanh ngang trên + thanh giữa lưng ghế
    rect(0, -0.99 * u, 0.4 * u, -0.88 * u, '#8a5d34');
    ctx.fillStyle = 'rgba(255,225,170,' + 0.35 * K + ')'; ctx.fillRect(-0.2 * u, -0.99 * u, 0.4 * u, 0.012 * u);
    rect(0, -0.62 * u, 0.3 * u, -0.58 * u, '#4d3119');
    // mặt ghế: mặt trên (nhìn từ trên xuống một chút) + cạnh trước
    ctx.beginPath(); ctx.moveTo(-0.15 * u, -0.46 * u); ctx.lineTo(0.15 * u, -0.46 * u); ctx.lineTo(0.215 * u, -0.385 * u); ctx.lineTo(-0.215 * u, -0.385 * u); ctx.closePath();
    const sg = ctx.createLinearGradient(0, -0.46 * u, 0, -0.385 * u); sg.addColorStop(0, '#6a4526'); sg.addColorStop(1, '#a37042'); ctx.fillStyle = sg; ctx.fill();
    ctx.fillStyle = wood(-0.215 * u, 0.43 * u, '#6b4526'); ctx.fillRect(-0.215 * u, -0.385 * u, 0.43 * u, 0.048 * u);
    // chân trước + thanh giằng
    for (const s of [-1, 1]) rect(s * 0.195 * u, -0.337 * u, 0.045 * u, 0.012 * u, '#74502c');
    rect(0, -0.17 * u, 0.36 * u, -0.145 * u, '#3c2512');
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = Math.max(1, 0.004 * u);
    ctx.strokeRect(-0.215 * u, -0.385 * u, 0.43 * u, 0.048 * u);
    // ánh sáng từ trên: mặt trên ghế và đỉnh lưng sáng hơn
    ctx.fillStyle = 'rgba(255,226,170,' + 0.18 * K + ')'; ctx.beginPath(); ctx.moveTo(-0.15 * u, -0.46 * u); ctx.lineTo(0.15 * u, -0.46 * u); ctx.lineTo(0.215 * u, -0.385 * u); ctx.lineTo(-0.215 * u, -0.385 * u); ctx.fill();
    ctx.restore();
  }

  // ================= PHẦN 1: CĂN PHÒNG KINH DỊ =================
  const CH = () => 0.42 * H;                                          // chiều cao ghế
  const FOC = () => ({ x: W / 2, y: 0.8 * H - 0.19 * H });            // điểm camera nhìn vào (giữa ghế)
  function camZoom(t) {
    if (t < T.hz1) { const u = smooth(ramp(t, T.hz0, T.hz1)); return Math.exp(Math.log(9) * (1 - u)); }   // phóng nhỏ dần: 9x -> 1x
    const u = Math.pow(ramp(t, T.hz1, T.rush1), 2.4); return Math.exp(Math.log(140) * u);                    // lao vào cực nhanh
  }
  function flicker(t) {
    let f = 0.82 + 0.18 * noise1(t * 9) + 0.1 * Math.sin(t * 31);
    const d = Math.sin(t * 17.3) * Math.sin(t * 5.1);
    if (d > 0.93) f *= 0.15;                                          // chập mạnh
    if (t > 6.3 && t < 6.55) f *= 0.1 + 0.9 * Math.abs(Math.sin(t * 60));
    return Math.max(0.04, Math.min(1.1, f));
  }
  function drawHorror(t) {
    const z = camZoom(t), F = FOC(), yH = 0.6 * H, y0 = 0.8 * H, cx = W / 2;
    const rush = ramp(t, T.hz1, T.rush1);
    const shx = (noise1(t * 30) - 0.5) * 0.012 * W * rush * rush * 3, shy = (noise1(t * 30 + 40) - 0.5) * 0.012 * H * rush * rush * 3;
    const cam = () => { ctx.translate(F.x + shx, F.y + shy); ctx.scale(z, z); ctx.translate(-F.x, -F.y); };
    const fl = flicker(t);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.save(); cam();
    // tường
    let g = ctx.createLinearGradient(0, 0, 0, yH); g.addColorStop(0, '#0f1517'); g.addColorStop(1, '#222a2b');
    ctx.fillStyle = g; ctx.fillRect(-0.3 * W, -0.3 * H, 1.6 * W, yH + 0.3 * H);
    ctx.globalAlpha = 0.65; ctx.drawImage(stain, -0.3 * W, -0.3 * H, 1.6 * W, yH + 0.3 * H); ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for (let x = -0.3 * W; x < 1.3 * W; x += W * 0.055) ctx.fillRect(x, -0.3 * H, W * 0.026, yH + 0.3 * H);   // sọc giấy dán tường
    ctx.fillStyle = '#0a0807'; ctx.fillRect(-0.3 * W, yH - 0.022 * H, 1.6 * W, 0.03 * H);
    // sàn gỗ
    g = ctx.createLinearGradient(0, yH, 0, H); g.addColorStop(0, '#1b130d'); g.addColorStop(1, '#0a0705');
    ctx.fillStyle = g; ctx.fillRect(-0.3 * W, yH, 1.6 * W, H - yH + 0.3 * H);
    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = Math.max(1, 0.003 * H);
    for (let i = -14; i <= 24; i++) { ctx.beginPath(); ctx.moveTo(cx + (i - 5) * 0.012 * W, yH); ctx.lineTo(cx + (i - 5) * 0.1 * W, H + 0.3 * H); ctx.stroke(); }
    for (let j = 1; j <= 9; j++) { const y = yH + (H * 1.3 - yH) * Math.pow(j / 9, 1.9); ctx.beginPath(); ctx.moveTo(-0.3 * W, y); ctx.lineTo(1.3 * W, y); ctx.stroke(); }
    // bóng ghế
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.beginPath(); ctx.ellipse(cx, y0 + 0.012 * H, 0.19 * H, 0.032 * H, 0, 0, 6.2832); ctx.fill();
    // ghế rục rịch: rung nhẹ, thỉnh thoảng nảy lên
    const A = ramp(t, 1.5, 6.4), thump = Math.pow(Math.max(0, Math.sin(t * 3.3)), 14) * ramp(t, 3, 5);
    const ang = A * 0.035 * Math.sin(t * 41) * Math.sin(t * 9.3) + thump * 0.06 * Math.sin(t * 23);
    chair(cx, y0, CH(), ang, A * 0.004 * H * Math.abs(Math.sin(t * 53)) + thump * 0.02 * H, fl);
    // sương mù dưới sàn
    for (let i = 0; i < 7; i++) {
      const fx = ((i * 0.37 + t * 0.012 * (i % 2 ? 1 : -1)) % 1.4 + 1.4) % 1.4 - 0.2, fy = y0 + (hash(i) - 0.35) * 0.12 * H, r = 0.34 * W;
      const rg = ctx.createRadialGradient(fx * W, fy, 0, fx * W, fy, r); rg.addColorStop(0, 'rgba(150,170,180,0.1)'); rg.addColorStop(1, 'rgba(150,170,180,0)');
      ctx.fillStyle = rg; ctx.fillRect(fx * W - r, fy - r, r * 2, r * 2);
    }
    // chùm sáng
    ctx.globalCompositeOperation = 'lighter';
    const apx = cx, apy = -0.2 * H;
    g = ctx.createLinearGradient(0, apy, 0, y0); g.addColorStop(0, 'rgba(255,225,170,0)'); g.addColorStop(1, 'rgba(255,215,150,' + 0.16 * fl + ')');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(apx - 0.03 * W, apy); ctx.lineTo(apx + 0.03 * W, apy); ctx.lineTo(cx + 0.23 * W, y0 + 0.03 * H); ctx.lineTo(cx - 0.23 * W, y0 + 0.03 * H); ctx.fill();
    for (let i = 0; i < 50; i++) {                                    // bụi bay trong chùm sáng
      const px = cx + (hash(i) - 0.5) * 0.36 * W * (0.3 + 0.7 * (0.2 + hash(i + 50))), py = ((hash(i + 9) * H * 1.1 + t * H * 0.02 * (0.5 + hash(i + 3))) % (y0 + 0.05 * H)) ;
      const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * (1 + hash(i + 5) * 2) + i));
      ctx.fillStyle = 'rgba(255,235,200,' + 0.5 * tw * fl + ')'; ctx.fillRect(px + Math.sin(t * 0.5 + i) * 6, py, Math.max(1, 0.0025 * H), Math.max(1, 0.0025 * H));
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
    // ---- mặt nạ ánh sáng: tối đen, chỉ chừa vùng đèn chiếu ----
    mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.globalCompositeOperation = 'source-over'; mctx.clearRect(0, 0, W, H);
    mctx.fillStyle = 'rgba(0,0,0,0.93)'; mctx.fillRect(0, 0, W, H);
    mctx.save(); mctx.translate(F.x + shx, F.y + shy); mctx.scale(z, z); mctx.translate(-F.x, -F.y);
    mctx.globalCompositeOperation = 'destination-out';
    const lg = mctx.createLinearGradient(0, apy, 0, y0); lg.addColorStop(0, 'rgba(0,0,0,' + 0.35 * fl + ')'); lg.addColorStop(0.55, 'rgba(0,0,0,' + 0.75 * fl + ')'); lg.addColorStop(1, 'rgba(0,0,0,' + 0.95 * fl + ')');
    mctx.fillStyle = lg; mctx.beginPath(); mctx.moveTo(apx - 0.03 * W, apy); mctx.lineTo(apx + 0.03 * W, apy); mctx.lineTo(cx + 0.23 * W, y0 + 0.03 * H); mctx.lineTo(cx - 0.23 * W, y0 + 0.03 * H); mctx.fill();
    mctx.save(); mctx.translate(cx, y0); mctx.scale(1, 0.2);
    const pg = mctx.createRadialGradient(0, 0, 0, 0, 0, 0.36 * W); pg.addColorStop(0, 'rgba(0,0,0,' + 0.95 * fl + ')'); pg.addColorStop(1, 'rgba(0,0,0,0)');
    mctx.fillStyle = pg; mctx.fillRect(-0.4 * W, -0.4 * W, 0.8 * W, 0.8 * W); mctx.restore();
    mctx.restore();
    ctx.drawImage(mask, 0, 0);
    // vệt đỏ rất mờ ở mép khi ghế rục rịch mạnh
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 1.0);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.85)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    if (A > 0.3) { const rg = ctx.createRadialGradient(W / 2, H / 2, H * 0.5, W / 2, H / 2, H * 1.05); rg.addColorStop(0, 'rgba(90,0,0,0)'); rg.addColorStop(1, 'rgba(90,0,0,' + 0.22 * A * (0.6 + 0.4 * Math.sin(t * 3)) + ')'); ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H); }
    // hạt phim
    ctx.globalAlpha = 0.09; const gx = Math.floor(rnd() * 256), gy = Math.floor(rnd() * 256);
    ctx.globalCompositeOperation = 'overlay';
    for (let x = -gx; x < W; x += 256) for (let y = -gy; y < H; y += 256) ctx.drawImage(grain, x, y);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    // lúc lao vào: vệt toả từ giữa + sắc đỏ
    if (rush > 0) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
      for (let i = 0; i < 70; i++) {
        const a = hash(i) * 6.2832, r0 = (0.06 + hash(i + 40) * 0.5) * W * (0.6 + rush), l = r0 * (0.2 + rush * 1.4);
        ctx.strokeStyle = 'rgba(255,' + (200 - hash(i + 3) * 120 | 0) + ',170,' + 0.32 * rush + ')'; ctx.lineWidth = 1 + hash(i + 9) * 3;
        ctx.beginPath(); ctx.moveTo(F.x + Math.cos(a) * r0, F.y + Math.sin(a) * r0); ctx.lineTo(F.x + Math.cos(a) * (r0 + l), F.y + Math.sin(a) * (r0 + l)); ctx.stroke();
      }
      ctx.restore();
    }
    // mở đầu: từ màn hình đen
    const fin = 1 - ramp(t, 0, T.hz0 + 0.9);
    if (fin > 0) { ctx.fillStyle = 'rgba(0,0,0,' + fin + ')'; ctx.fillRect(0, 0, W, H); }
  }

  // ================= PHẦN 2: SÂN KHẤU =================
  const fw = { rockets: [], parts: [], lights: [], fount: [], conf: [], nextLaunch: T.fw0, nextConf: 0 };
  const FW_COLORS = [['rgba(255,70,70,0.9)', 'rgba(255,190,120,0.9)'], ['rgba(255,215,90,0.9)', 'rgba(255,245,190,0.9)'], ['rgba(90,200,255,0.9)', 'rgba(210,240,255,0.9)'],
    ['rgba(255,110,220,0.9)', 'rgba(255,210,245,0.9)'], ['rgba(120,255,160,0.9)', 'rgba(220,255,225,0.9)'], ['rgba(255,150,60,0.9)', 'rgba(255,225,150,0.9)']];
  function launch(x, kind) {
    const h = (0.28 + rnd() * 0.3) * H, T1 = 0.95 + rnd() * 0.35, vy0 = -2 * h / T1;
    fw.rockets.push({ x, y: 0.7 * H, vx: (rnd() - 0.5) * 0.04 * W, vy: vy0, ay: -vy0 / T1, life: T1, age: 0, col: FW_COLORS[(rnd() * FW_COLORS.length) | 0], kind, hist: [] });
  }
  function burst(r) {
    const n = r.kind === 'ring' ? 90 : r.kind === 'willow' ? 130 : 170, base = (r.kind === 'willow' ? 0.3 : 0.55) * H;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * 6.2832 + rnd() * 0.05, v = r.kind === 'ring' ? base * 0.8 : base * (0.25 + rnd() * 0.85);
      fw.parts.push({ x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, age: 0, life: (r.kind === 'willow' ? 2.6 : 1.4) + rnd() * 0.8, col: r.kind === 'willow' ? FW_COLORS[1][0] : r.col[rnd() < 0.7 ? 0 : 1], drag: r.kind === 'willow' ? 0.6 : 1.4, g: (r.kind === 'willow' ? 0.22 : 0.16) * H, hist: [] });
    }
    fw.lights.push({ x: r.x, y: r.y, col: r.col[0], age: 0 });
  }
  function stepStage(dt, t) {
    if (t >= T.fw0 && t >= fw.nextLaunch) {
      const kind = rnd() < 0.2 ? 'willow' : rnd() < 0.3 ? 'ring' : 'peony';
      launch((0.15 + rnd() * 0.7) * W, kind);
      if (rnd() < 0.35) launch((0.15 + rnd() * 0.7) * W, 'peony');
      fw.nextLaunch = t + 0.5 + rnd() * 0.7;
    }
    for (const r of fw.rockets) {
      r.age += dt; r.vy += r.ay * dt; r.x += r.vx * dt; r.y += r.vy * dt;
      r.hist.push([r.x, r.y]); if (r.hist.length > 10) r.hist.shift();
      if (r.age >= r.life && !r.done) { r.done = 1; burst(r); }
    }
    fw.rockets = fw.rockets.filter((r) => !r.done);
    for (const p of fw.parts) {
      p.age += dt; const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy = p.vy * k + p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      p.hist.push([p.x, p.y]); if (p.hist.length > 9) p.hist.shift();
    }
    fw.parts = fw.parts.filter((p) => p.age < p.life);
    for (const l of fw.lights) l.age += dt;
    fw.lights = fw.lights.filter((l) => l.age < 0.7);
    // pháo phun ở mép sân khấu
    if (t > T.open1 - 0.6) for (const sx of [0.1, 0.9]) for (let i = 0; i < 3; i++) {
      const a = -1.5708 + (rnd() - 0.5) * 0.5 + (sx < 0.5 ? 0.12 : -0.12), v = (0.5 + rnd() * 0.45) * H;
      fw.fount.push({ x: sx * W, y: 0.86 * H, vx: Math.cos(a) * v, vy: Math.sin(a) * v, age: 0, life: 0.7 + rnd() * 0.5 });
    }

    } else if (s < O.away) {
      px = pushX(rl); view = 'side'; dir = 1; p.ph = s * 9; p.bob = Math.abs(Math.sin(s * 9)) * 3; p.lean = 0.16 + 0.03 * Math.sin(s * 9); p.push = 1;
      if (s > O.roll2) { const u = ramp(s, O.roll2, O.away); py -= Math.sin(Math.PI * u) * 0.04 * H; p.lean = 0.16 - 0.2 * u; }
    } else {
      const u = (s - O.away) / (O.end - O.away); px = pushX(rollEndX) + (1.5 * W) * u * u * 1.05; view = 'side'; dir = 1; p.ph = s * 24; p.bob = Math.abs(Math.sin(s * 24)) * 5; p.lean = 0.3; p.sx = 1.12;
    }
    // vị trí cuộn / cuộn thu nhỏ thành ống giấy ôm trong cánh
    if (s >= O.roll0 + 0.2) {
      if (s < O.roll2) {
        const rr = rl, y0 = 0, hh = H;
        // phần cảnh còn phẳng
        mainCtx.drawImage(scBuf, rr.x + rr.r, 0, W - (rr.x + rr.r), H, rr.x + rr.r, 0, W - (rr.x + rr.r), H);
        drawRollCyl(mainCtx, rr, y0, hh, 1);
      } else {
        const u = smooth(ramp(s, O.roll2, O.away)), hh = H * (1 - 0.72 * u), cxp = rollEndX.x + (px + 0.07 * H * 1.0 - rollEndX.x) * u, cyp = H * 0.5 + (yb - 0.2 * H - H * 0.5) * u;
        const w = 1 + 0.9 * u; mainCtx.save(); mainCtx.translate(cxp, cyp); mainCtx.rotate(u * 0.45 * (dir || 1)); mainCtx.translate(-cxp, -cyp);
        drawRollCyl(mainCtx, { x: cxp / 1, r: rollEndX.r }, cyp - hh / 2, hh, w);
        mainCtx.restore();
      }
    }
    // chim
    ctx = mainCtx;
    if (s >= 8.5) {                                                  // vệt tốc độ + bụi phía sau
      for (let i = 0; i < 9; i++) { const yy = yb - (0.02 + hash(i) * 0.26) * H, ll = (0.1 + hash(i + 7) * 0.2) * W, xx = px - 0.08 * W - hash(i + 3) * 0.1 * W; ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2 + hash(i + 11) * 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx - ll, yy); ctx.stroke(); }
    }
    for (const d of outro.dust) { const a = 1 - d.age / d.life; if (a > 0) cloud(d.x, d.y, d.r * (0.5 + d.age / d.life), a * 0.9); }
    if (s > 3.9 && s < 4.7 || s >= 8.4) pigeon(px, py, h, view, dir, p); else pigeon(px, py, h, view, dir, p);
    if (s >= O.away - 0.05 && s < O.away + 0.35) {                   // chữ hoạt hình "ZOOM!"
      const u = ramp(s, O.away - 0.05, O.away + 0.35); ctx.save(); ctx.translate(W * 0.5, H * 0.3); ctx.rotate(-0.08); ctx.scale(0.6 + 0.5 * easeOutQ(u), 0.6 + 0.5 * easeOutQ(u)); ctx.globalAlpha = 1 - ramp(u, 0.7, 1);
      ctx.font = '700 ' + 0.12 * H + 'px Tinos, "Times New Roman", serif'; ctx.textAlign = 'center'; ctx.lineWidth = 0.014 * H; ctx.strokeStyle = '#26212e'; ctx.strokeText('ZOOM!', 0, 0); ctx.fillStyle = '#ffd23c'; ctx.fillText('ZOOM!', 0, 0); ctx.restore();
    }
    // đen dần ở cuối
    const fo = ramp(s, O.end - 0.45, O.end); if (fo > 0) { ctx.fillStyle = 'rgba(0,0,0,' + fo + ')'; ctx.fillRect(0, 0, W, H); }
  }
  function stepOutro(dt, t) {
    if (!outro) return;
    const s = t - outro.t0, h = 0.3 * H, yb = 0.94 * H;
    outro.dust = outro.dust.filter((d) => (d.age += dt) < d.life);
    outro.acc = (outro.acc || 0) + dt;
    if (outro.acc > 0.07) {
      outro.acc = 0;
      let px = null;
      if (s > 0.1 && s < 2.0) px = W * (1.14 - 0.64 * easeOutQ(s / 2));
      else if (s > 4.0 && s < 4.6) px = W * 0.5 + (Math.max(rollInfo(4.6).x - rollInfo(4.6).r - 0.085 * H, 0.07 * H) - W * 0.5) * easeOutQ(ramp(s, 4.0, 4.6));
      else if (s > 4.9 && s < O.away) { const r = rollInfo(s); px = Math.max(r.x - r.r - 0.085 * H, 0.07 * H); }
      else if (s >= O.away && s < O.end - 0.3) { const u = (s - O.away) / (O.end - O.away), re = rollInfo(O.roll2); px = Math.max(re.x - re.r - 0.085 * H, 0.07 * H) + 1.5 * W * u * u * 1.05; }
      if (px !== null) outro.dust.push({ x: px + (rnd() - 0.5) * 0.03 * W, y: yb - 0.01 * H, r: (0.014 + rnd() * 0.012) * H, age: 0, life: 0.55 + rnd() * 0.25 });
    }
  }

  // ================= VÒNG LẶP =================
  function draw(t) {
    if (outro) { drawOutro(t); return; }
    if (t < T.white1) {
      drawHorror(t);
      const wa = smooth(ramp(t, T.white0, T.white1));
      if (wa > 0) { ctx.fillStyle = 'rgba(255,248,235,' + wa + ')'; ctx.fillRect(0, 0, W, H); }
    } else drawStage(t);
  }
  let t = 0, last = 0, acc = 0;
  const FIX = 1 / 60;
  function step() { t += FIX; stepStage(FIX, t); stepOutro(FIX, t); }
  function loop(now) {
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    while (acc >= FIX) { step(); acc -= FIX; }
    draw(t); requestAnimationFrame(loop);
  }
  function start() {
    if (STILL) { const o = (/[?&]outro=([\d.]+)/.exec(location.search) || [])[1], n = Math.round(parseFloat(STILL) / FIX), at = o ? Math.round((parseFloat(STILL) - parseFloat(o)) / FIX) : -1; for (let i = 0; i < n; i++) { if (i === at) outro = { t0: t, dust: [] }; step(); } draw(t); window.__ready = true; }
    else { last = performance.now(); requestAnimationFrame(loop); }
  }
  if (stage.complete) start(); else { stage.onload = start; stage.onerror = start; }
  // Trang chính gửi 'finale' khi người xem bấm / Enter ở slide 10: chỉ bắt đầu khi chữ cuối đã hiện, và chỉ một lần
  addEventListener('message', (ev) => { if (ev.data && ev.data.type === 'finale' && !outro && t >= T.text + 0.8) { outro = { t0: t, dust: [] }; } });
  if (STILL && /[?&]outro=([\d.]+)/.test(location.search)) { /* xem thử: ?still=T&outro=S bắt đầu cuộn S giây trước T */ }
  addEventListener('keydown', (e) => {
    if (!EMBED || window.parent === window) return;
    if (e.key === 'Backspace') e.preventDefault();
    window.parent.postMessage({ type: 'slide-key', key: e.key }, '*');
  });
})();
</script>
</body>
</html>
