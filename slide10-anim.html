<body>
<canvas id="c"></canvas>
<!--
  SLIDE 10 (cảnh kết) - "Remembering the Past":
  - 0:00-0:39  màn hình chia đôi bằng đường chéo: dưới-trái là quá khứ (ảnh cổ, hạt phim, năm tụt 1985 -> 1900),
               trên-phải là hiện đại (neon, glitch, năm tăng 2026 -> 2100). Ảnh mỗi bên đổi theo nhịp nhạc (lệch nhịp nhau),
               càng về cuối đường chéo xoay càng nhanh, năm kéo về 2026.
  - 0:39       cú drop của nhạc: flash trắng, hợp nhất thành 2026 + "Thanks for listening" (trái), credits cuộn (phải).
  - hết bài    sập nguồn: icon pin đỏ tụt về 0, màn hình đen, tiếng "erro", rồi gửi 'power-off' lên trang chính.
  Toàn bộ chạy theo audio.currentTime của nhạc (assets/music-waterflame.mp3, chỉ tải khi mở slide này).
  Xem thử một khung: ?still=giây (không phát nhạc).
-->
<script>
(() => {
  'use strict';
  const EMBED = location.search.includes('embed');
  const STILL = parseFloat((/[?&]still=([\d.]+)/.exec(location.search) || [])[1]);

  const cv = document.getElementById('c'), mainCtx = cv.getContext('2d');
  let ctx = mainCtx;
  const mc = document.createElement('canvas'), mctx = mc.getContext('2d');       // khung phụ: vẽ cảnh montage rồi quay + vẽ bóng mờ cho cú hút hố đen
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(1.5, window.devicePixelRatio || 1);

  }
  addEventListener('resize', resize); resize();

  // ===== mốc thời gian (giây theo nhạc) =====
  const TD = 39.05;               // cú drop
  const BEAT = 0.3957;            // 151.65 nhịp/phút; nhịp neo vào cú drop
  const DUR = 163.2;
  const SP0 = 27;                 // bắt đầu xoay
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const smooth = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
  const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const TAU = Math.PI * 2;

  // ===== bộ sinh số ngẫu nhiên có hạt giống (để cảnh vẽ cố định) =====

  const SW = 640, SH = 360;

  // ================= ẢNH CỔ (ảnh thật có sẵn) + chỉnh màu bằng blend mode =================

  function loadPhotos() {

  }
  function blend(src, w, op, fill, alpha) { const g = src.getContext('2d'); g.globalCompositeOperation = op; g.globalAlpha = alpha == null ? 1 : alpha; g.fillStyle = fill; g.fillRect(0, 0, w, src.height); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; }

    g.fillStyle = '#120a06'; let x = 0; while (x < SW) { const w = 22 + rnd() * 40, h = 40 + rnd() * 90; g.beginPath(); g.moveTo(x, SH); g.lineTo(x, SH - h); for (let s = 0; s < 4; s++) g.lineTo(x + w * (s + 1) / 4, SH - h + (rnd() - .5) * 26); g.lineTo(x + w, SH); g.fill(); x += w - 2; }

    g.fillStyle = 'rgba(70,45,28,.55)'; g.beginPath(); g.moveTo(0, 190); for (let x = 0; x <= SW; x += 40) g.lineTo(x, 150 + Math.sin(x * .013) * 26 + rnd() * 10); g.lineTo(SW, 200); g.lineTo(0, 200); g.fill();

  function oLamp(g) {
    R(37);
    g.fillStyle = '#0b0603'; g.fillRect(0, 0, SW, SH);
    let gl = g.createRadialGradient(320, 190, 6, 320, 190, 280); gl.addColorStop(0, 'rgba(255,214,130,1)'); gl.addColorStop(.18, 'rgba(235,150,60,.75)'); gl.addColorStop(.6, 'rgba(110,50,15,.35)'); gl.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gl; g.fillRect(0, 0, SW, SH);

    g.fillStyle = '#1a0e07'; g.beginPath(); g.moveTo(80, 260); g.lineTo(560, 260); g.lineTo(600, 360); g.lineTo(40, 360); g.fill();
    g.fillStyle = '#2b1a0e'; g.fillRect(300, 232, 40, 30); g.fillStyle = 'rgba(255,240,200,.9)'; g.beginPath(); g.moveTo(311, 232); g.quadraticCurveTo(320, 160, 329, 232); g.fill(); g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.ellipse(320, 200, 9, 22, 0, 0, TAU); g.fill();
    g.fillStyle = '#0d0703'; [[150, 236, 34], [490, 236, 34], [230, 248, 24], [410, 248, 24]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y - r * 1.3, r * .75, 0, TAU); g.fill(); g.beginPath(); g.moveTo(x - r * 1.5, y + 60); g.quadraticCurveTo(x - r * 1.6, y - 4, x, y - 4); g.quadraticCurveTo(x + r * 1.6, y - 4, x + r * 1.5, y + 60); g.fill(); });
  }
  const OLD_PROC = [oWar, oBuffalo, oLamp];

  // ================= ẢNH TỰ VẼ: HIỆN ĐẠI (neon) =================
  const PAL = [{ a: '#27e6ff', b: '#ff3df2', bg: '#04051a', bg2: '#16104a', warm: '#ffd36b' }, { a: '#8dff6b', b: '#18b7ff', bg: '#02130f', bg2: '#08354a', warm: '#fff08a' }];
  const rr = (g, x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
  const bgGrad = (g, P) => { const gr = g.createLinearGradient(0, 0, 0, SH); gr.addColorStop(0, P.bg); gr.addColorStop(1, P.bg2); g.fillStyle = gr; g.fillRect(0, 0, SW, SH); };
  const rglow = (g, x, y, r, col, a) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.save(); g.globalAlpha = a; g.globalCompositeOperation = 'lighter'; g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.restore(); };
  function mSkyline(g, P) {
    R(5); bgGrad(g, P); rglow(g, 320, 330, 300, P.b, .5);
    for (let i = 0; i < 70; i++) { g.fillStyle = 'rgba(255,255,255,' + (0.2 + rnd() * .6) + ')'; g.fillRect(rnd() * SW, rnd() * 190, 1.4, 1.4); }
    g.fillStyle = '#fff'; g.shadowColor = '#fff'; g.shadowBlur = 24; g.beginPath(); g.arc(540, 64, 20, 0, TAU); g.fill(); g.shadowBlur = 0;
    const row = (col, hMin, hMax, lit, wMin, wMax) => { let x = -10; while (x < SW) { const w = wMin + rnd() * (wMax - wMin), h = hMin + rnd() * (hMax - hMin); g.fillStyle = col; g.fillRect(x, SH - h, w, h); for (let wy = SH - h + 6; wy < SH - 4; wy += 7) for (let wx = x + 4; wx < x + w - 4; wx += 6) if (rnd() < lit) { g.fillStyle = rnd() < .6 ? P.a : (rnd() < .5 ? P.warm : P.b); g.globalAlpha = .75; g.fillRect(wx, wy, 3, 3); g.globalAlpha = 1; } x += w + 2; } };
    row('#0c0e33', 70, 170, .22, 18, 38); row('#05061a', 110, 230, .45, 28, 56);
    g.fillStyle = '#04041a'; g.fillRect(298, 40, 44, 320); g.fillRect(316, 6, 8, 40); g.fillStyle = '#ff3355'; g.shadowColor = '#f35'; g.shadowBlur = 12; g.beginPath(); g.arc(320, 8, 3.5, 0, TAU); g.fill(); g.shadowBlur = 0;
    g.strokeStyle = P.a; g.lineWidth = 2; g.globalAlpha = .8; for (let y = 70; y < 340; y += 34) { g.beginPath(); g.moveTo(298, y); g.lineTo(342, y); g.stroke(); } g.globalAlpha = 1;
    for (let i = 0; i < 16; i++) { const x = 40 + rnd() * 560, y = 20 + rnd() * 170; g.strokeStyle = P.a; g.globalAlpha = .35; g.lineWidth = 1; g.beginPath(); g.moveTo(x - 22 - rnd() * 18, y + 5); g.lineTo(x, y); g.stroke(); g.globalAlpha = 1; g.fillStyle = '#fff'; g.shadowColor = P.a; g.shadowBlur = 10; g.fillRect(x - 2, y - 2, 4, 4); g.shadowBlur = 0; }
  }
  function mTrails(g, P) {
    R(9); bgGrad(g, P); const vx = 320, vy = 160; rglow(g, vx, vy, 240, P.b, .55);
    g.fillStyle = '#05050f'; g.beginPath(); g.moveTo(vx - 6, vy); g.lineTo(vx + 6, vy); g.lineTo(SW, SH); g.lineTo(0, SH); g.fill();
    [-1, 1].forEach((sd2) => { for (let k = 0; k < 11; k++) { const u = k / 11, x = vx + sd2 * (40 + u * u * 300), h = 20 + u * u * 230, w = 16 + u * 60; g.fillStyle = '#07082a'; g.fillRect(sd2 > 0 ? x : x - w, vy - h * .7, w, h); for (let wy = 0; wy < h; wy += 9) if (rnd() < .5) { g.fillStyle = rnd() < .5 ? P.a : P.warm; g.globalAlpha = .6; g.fillRect((sd2 > 0 ? x : x - w) + 3 + rnd() * (w - 8), vy - h * .7 + wy, 3, 3); g.globalAlpha = 1; } } });
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 170; i++) { const a = .12 * Math.PI + rnd() * .76 * Math.PI, r0 = 10 + rnd() * 70, r1 = 120 + rnd() * 380, dx = Math.cos(a), dy = Math.sin(a), c = rnd() < .5 ? P.a : (rnd() < .5 ? P.b : '#ffffff'); const gr = g.createLinearGradient(vx + dx * r0, vy + dy * r0, vx + dx * r1, vy + dy * r1); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, c); g.strokeStyle = gr; g.lineWidth = .8 + rnd() * 2.4; g.beginPath(); g.moveTo(vx + dx * r0, vy + dy * r0); g.lineTo(vx + dx * r1, vy + dy * r1); g.stroke(); }

  }
  function mSynth(g, P) {
    R(15); bgGrad(g, P); const hy = 210;
    const sg = g.createLinearGradient(0, 70, 0, 210); sg.addColorStop(0, P.warm); sg.addColorStop(1, P.b); g.fillStyle = sg; g.beginPath(); g.arc(320, 150, 78, 0, TAU); g.fill();

  }

    g.strokeStyle = P.b; g.globalAlpha = .6; pts.forEach((p, i) => { const q = pts[(i * 7 + 3) % pts.length]; g.beginPath(); g.moveTo(p[0], p[1]); g.quadraticCurveTo((p[0] + q[0]) / 2, Math.min(p[1], q[1]) - 40, q[0], q[1]); g.stroke(); }); g.globalAlpha = 1;

  function mUI(g, P) {

        ctx.fillStyle = '#ff1111'; const fw = (bw - bw * .07) * k; if (fw > 1) { ctx.fillRect(x + bw * .035, y + bh * .1, fw, bh * .8); }
      }
    }
    if (tau >= 2.4 && !sentOff) { sentOff = true; try { parent.postMessage({ type: 'power-off' }, '*'); } catch (e) {} }
  }
  function startOff() {
    if (offAt >= 0) return; phase = 'off'; offAt = performance.now();
    try { if (audio) audio.pause(); } catch (e) {}
    try { errAudio = new Audio('assets/sfx-erro.mp3'); errAudio.volume = Math.min(1, vol() * 1.0); setTimeout(() => { try { errAudio.play().catch(() => {}); } catch (e) {} }, 150); } catch (e) {}
  }

  // ================= ÂM LƯỢNG (đọc từ cài đặt của trang chính) =================
  function vol() {
    try {
      const on = localStorage.getItem('sndOn') !== '0', mo = localStorage.getItem('musOn') !== '0', sv = parseInt(localStorage.getItem('sndVol'), 10), mv = parseInt(localStorage.getItem('musVol'), 10);
      if (!on || !mo) return 0; return ((isNaN(sv) ? 100 : sv) / 100) * ((isNaN(mv) ? 100 : mv) / 100);
    } catch (e) { return 1; }
  }

  // ================= VÒNG LẶP + ĐỒNG BỘ THEO NHẠC =================
  let phase = 'load', audio = null, tClock = 0, lastNow = 0, loaded = false, audioReady = false, silent = false;
  const post = (type) => { try { if (EMBED && window.parent !== window) window.parent.postMessage({ type }, '*'); } catch (e) {} };
  function drawLoading(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    const n = Math.floor(now / 350) % 4; ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = Math.round(Math.min(W, H) * .03) + 'px "Courier New", monospace'; ctx.textAlign = 'center'; ctx.fillText('. '.repeat(n), W / 2, H / 2); ctx.textAlign = 'left';
  }
  function drawTap() { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = Math.round(Math.min(W, H) * .035) + 'px "Courier New", monospace'; ctx.textAlign = 'center'; ctx.fillText('▶  CLICK TO BEGIN', W / 2, H / 2); ctx.textAlign = 'left'; }
  function render(t, now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const barOpen = smooth(t / 1.3), barH = H * (.075 + .425 * (1 - barOpen)), close = t >= TD ? 1 - smooth((t - TD) / .5) : 1;
    if (t < TD - COL) drawMontage(t); else if (t < TD) drawCollapse(t); else drawFinal(t);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bh2 = t < TD ? barH : H * .075 * close; if (bh2 > 0) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, bh2); ctx.fillRect(0, H - bh2, W, bh2); }
    if (t < .5) { ctx.fillStyle = 'rgba(0,0,0,' + (1 - t / .5) + ')'; ctx.fillRect(0, 0, W, H); }
  }
  function frame(now) {
    const dt = Math.min(.1, (now - lastNow) / 1000); lastNow = now;
    if (IS_STILL) { if (loaded) render(STILL, now); requestAnimationFrame(frame); return; }
    if (phase === 'load') { drawLoading(now); if (loaded && audioReady) tryPlay(); }
    else if (phase === 'tap') drawTap();
    else if (phase === 'play' && silent) { tClock += dt; if (tClock >= DUR) startOff(); else render(tClock, now); }   // nhạc không tải được: vẫn chạy cảnh đúng giờ, im lặng
    else if (phase === 'play') {
      if (!audio.paused && audio.readyState >= 3) tClock += dt;
      const at = audio.currentTime, err = at - tClock; if (Math.abs(err) > .12) tClock = at; else tClock += err * .1;
      if (audio.ended || at >= DUR - .08) startOff(); else render(tClock, now);
    } else if (phase === 'off') drawOff(now);
    requestAnimationFrame(frame);
  }
  function tryPlay() {
    if (phase !== 'load' && phase !== 'tap') return;
    if (audio.error) { silent = true; phase = 'play'; tClock = 0; post('tap-done'); return; }
    phase = 'wait';
    audio.volume = Math.min(1, vol() * .95); audio.muted = vol() === 0;
    const okPlay = () => { phase = 'play'; tClock = audio.currentTime; post('tap-done'); };
    const noPlay = () => { if (audio.error) { phase = 'load'; } else { phase = 'tap'; post('need-tap'); } };       // chưa được phép phát: hiện nút bấm, trang chính mở khóa click cho khung này
    let p; try { p = audio.play(); } catch (e) { noPlay(); return; }
    if (p && p.then) p.then(okPlay).catch(noPlay); else okPlay();
  }
  addEventListener('pointerdown', () => { if (phase === 'tap') tryPlay(); });
  addEventListener('message', (ev) => { if (ev.data && (ev.data.type === 'finale' || ev.data.type === 'go') && phase === 'tap') tryPlay(); });
  addEventListener('pagehide', () => { try { audio && audio.pause(); } catch (e) {} });

  // ===== khởi động: tải ảnh + dựng cảnh; nhạc chỉ tải khi mở slide này =====
  (async () => {
    await loadPhotos();
    try { if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]); } catch (e) {}
    buildScenes(); loaded = true; window.__ready = true;
  })();
  if (!IS_STILL) {
    audio = new Audio('assets/music-waterflame.mp3?v=1'); audio.preload = 'auto';
    const ok = () => { audioReady = true; };
    audio.addEventListener('canplaythrough', ok, { once: true }); audio.addEventListener('error', ok, { once: true }); setTimeout(ok, 14000);
    audio.addEventListener('ended', startOff); audio.load();
  }
  requestAnimationFrame(frame);

  addEventListener('keydown', (e) => {
    if (!EMBED || window.parent === window) return;
    if (e.key === 'Backspace') e.preventDefault();
    window.parent.postMessage({ type: 'slide-key', key: e.key }, '*');
  });
})();
</script>
</body>
</html>
