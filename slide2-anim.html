<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide 2 - animated</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #050505; overflow: hidden; width: 100%; height: 100%; }
    #c { position: absolute; transform-origin: 0 0; visibility: hidden; }
  </style>
</head>
<body>
<!--
  SLIDE 2 (động): màn đen -> click -> xô sơn + cọ: cọ nhúng sơn rồi quét lộ ra bãi đất -> bút chì xuất hiện, tờ doodle phủ kín cảnh và
  chuyển động liên tục trong lúc bút chì viết -> viết xong doodle biến mất, hiện tiêu đề + danh sách tên + 5 người que đi lại (lặp mãi).
  Tổng thời gian hoạt ảnh < 6.5s. Sửa tên thành viên: mảng NAMES / FIG bên dưới (và slides.html nếu cần).
  ?still=GIÂY : dựng sẵn khung tại giây đó (render.js dùng ?still=8&bare để xuất slide2.png: không có người que).
-->
<canvas id="c" width="1536" height="864"></canvas>
<script>
(() => {
  const Q = location.search, EMBED = Q.includes('embed'), BARE = Q.includes('bare');
  const stillM = Q.match(/still=([\d.]+)/), STILL = stillM ? parseFloat(stillM[1]) : null;
  const W = 1536, H = 864;
  const INTRO = false;                         // true = bật lại hiệu ứng mở đầu (xô sơn + cọ + doodle + bút chì)
  if (EMBED) document.documentElement.style.background = document.body.style.background = 'transparent';
  const cv = document.getElementById('c'), g = cv.getContext('2d');
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const cover = mk(W, H), cx = cover.getContext('2d');          // lớp đen che, bị cọ "xoá" dần
  const wet = mk(W, H), wx = wet.getContext('2d');              // vệt sơn ướt mờ dần sau cọ
  const trail = mk(W, H), tx = trail.getContext('2d');          // vệt chì trên tờ giấy
  const ground = mk(384, 216);                                  // bãi đất pixel (vẽ 1 lần)
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const easeOut = (u) => 1 - Math.pow(1 - u, 3);
  const backOut = (u) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
  let seed = 20261026;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  function fit() {
    const k = EMBED ? Math.max(innerWidth / W, innerHeight / H) : Math.min(innerWidth / W, innerHeight / H);
    Object.assign(cv.style, { transform: 'scale(' + k + ')', left: ((innerWidth - W * k) / 2) + 'px', top: ((innerHeight - H * k) / 2) + 'px' });
  }
  addEventListener('resize', fit); fit();

  // ---------- Ảnh ----------
  const IMG = {};
  const load = (k, src) => new Promise((r) => { const im = new Image(); im.onload = im.onerror = () => r(); im.src = src; IMG[k] = im; });

  // ---------- Bãi đất (pixel, 384x216 phóng 4 lần) ----------
  function buildGround() {
    const x = ground.getContext('2d');
    const base = ['#8a5b36', '#7f5231', '#94623b', '#876047'];
    for (let j = 0; j < 216; j++) for (let i = 0; i < 384; i++) { x.fillStyle = base[(rnd() * 4) | 0]; x.fillRect(i, j, 1, 1); }
    for (let n = 0; n < 70; n++) {                        // mảng đất sáng / tối
      const cxp = rnd() * 384, cyp = rnd() * 216, r = 6 + rnd() * 20, dark = rnd() < 0.5;
      x.fillStyle = dark ? 'rgba(60,34,18,0.22)' : 'rgba(190,140,90,0.2)';
      for (let k = 0; k < r * 2; k++) { const a = rnd() * 6.28, d = rnd() * r; x.fillRect(Math.round(cxp + Math.cos(a) * d * 1.6), Math.round(cyp + Math.sin(a) * d * 0.6), 2, 1); }
    }
    for (let n = 0; n < 5; n++) {                         // hai vệt bánh xe
      const y0 = 40 + n * 40;
      for (let i = 0; i < 384; i++) { const yy = y0 + Math.round(Math.sin(i / 38 + n) * 5); x.fillStyle = 'rgba(55,30,16,0.35)'; x.fillRect(i, yy, 1, 1); x.fillRect(i, yy + 5, 1, 1); }
    }
    for (let n = 0; n < 130; n++) {                       // sỏi
      const px = (rnd() * 382) | 0, py = (rnd() * 214) | 0;
      x.fillStyle = rnd() < 0.5 ? '#b99872' : '#5b3b22'; x.fillRect(px, py, 2, 1); x.fillStyle = '#3d2614'; x.fillRect(px, py + 1, 2, 1);
    }
    for (let n = 0; n < 34; n++) {                        // cỏ khô lưa thưa
      const px = (rnd() * 380) | 0, py = (rnd() * 210) | 4;
      x.fillStyle = rnd() < 0.5 ? '#8c9a45' : '#6f7d35';
      x.fillRect(px, py, 1, 3); x.fillRect(px - 1, py + 1, 1, 2); x.fillRect(px + 1, py + 1, 1, 2);
    }
    // bầu trời + núi + mặt trời (hàng 0..61 = y 0..247)
    const HZ = 62;
    for (let j = 0; j < HZ; j++) {
      const u = j / HZ, band = Math.floor(u * 7) / 7;
      x.fillStyle = 'rgb(' + Math.round(96 + band * 100) + ',' + Math.round(170 + band * 62) + ',' + Math.round(228 + band * 12) + ')'; x.fillRect(0, j, 384, 1);
    }
    for (let j = 0; j < HZ; j += 2) for (let i = (j % 4); i < 384; i += 4) { x.fillStyle = 'rgba(255,255,255,0.05)'; x.fillRect(i, j, 1, 1); }
    // mặt trời
    const SX = 330, SY = 26;
    x.fillStyle = '#ffe9a0'; for (let a = 0; a < 16; a++) { const an = a / 16 * 6.283; for (let r = 16; r < 24; r++) x.fillRect(Math.round(SX + Math.cos(an) * r), Math.round(SY + Math.sin(an) * r), 1, 1); }
    for (let j = -14; j <= 14; j++) for (let i = -14; i <= 14; i++) { const d = i * i + j * j; if (d <= 196) { x.fillStyle = d > 150 ? '#ffb02e' : d > 80 ? '#ffd23f' : '#fff2a8'; x.fillRect(SX + i, SY + j, 1, 1); } }
    // núi xa (xanh nhạt) rồi núi gần (xanh rêu), có chóp tuyết
    const ridge = (base, amp, f1, f2, ph) => { const a = []; for (let i = 0; i < 384; i++) a.push(Math.round(base - amp * (0.55 + 0.45 * Math.sin(i / f1 + ph)) - amp * 0.35 * Math.abs(Math.sin(i / f2 + ph * 2)))); return a; };
    const far = ridge(HZ - 4, 30, 38, 17, 1.1), near = ridge(HZ, 22, 27, 11, 3.2);
    for (let i = 0; i < 384; i++) {
      for (let j = far[i]; j < HZ; j++) { x.fillStyle = j < far[i] + 3 && far[i] < 28 ? '#f4f8ff' : (j < far[i] + 1 ? '#a9b9d6' : '#8196bb'); x.fillRect(i, j, 1, 1); }
    }
    for (let i = 0; i < 384; i++) {
      for (let j = near[i]; j < HZ; j++) { x.fillStyle = (j - near[i]) < 1 ? '#7aa65a' : ((i + j) % 7 === 0 ? '#3f6b3c' : '#4c7d45'); x.fillRect(i, j, 1, 1); }
    }
    x.fillStyle = '#2b180b'; x.fillRect(0, HZ, 384, 1);
  }


  // ---------- Bầu trời động: mây trôi, máy bay bay ngang (vẽ trực tiếp, không nằm trong slide2.png) ----------
  function drawSky(c, t) {
    c.save(); c.imageSmoothingEnabled = false;
    const cloud = (cx, cy, s) => {
      c.fillStyle = 'rgba(0,0,0,0.08)'; [[0, 8, 120], [20, 0, 70], [60, -8, 60]].forEach(([dx, dy, w]) => c.fillRect(cx + dx * s, cy + (dy + 22) * s, w * s, 8 * s));
      c.fillStyle = '#ffffff'; [[0, 8, 120, 16], [20, -4, 70, 20], [60, -12, 56, 20], [-4, 14, 128, 8]].forEach(([dx, dy, w, h]) => c.fillRect(Math.round((cx + dx * s) / 4) * 4, Math.round((cy + dy * s) / 4) * 4, Math.round(w * s / 4) * 4, Math.round(h * s / 4) * 4));
    };
    [[0.0, 40, 1.0, 14], [0.4, 120, 0.7, 9], [0.75, 70, 1.3, 19]].forEach(([o, y, s, v]) => { const x = ((o * 1900 + t * v * 4) % 1900) - 260; cloud(x, y, s); });
    // máy bay: bay từ trái sang phải mỗi 15s, hơi chao nghiêng, để lại vệt khói trắng
    const P = 15, ph = (t % P) / P, px = -200 + ph * (1536 + 400), py = 190 + Math.sin(t * 1.3) * 8 - ph * 18;
    c.fillStyle = 'rgba(255,255,255,0.7)'; for (let k = 0; k < 28; k++) { const tx = px - 70 - k * 18; c.globalAlpha = 0.7 * (1 - k / 28); c.fillRect(Math.round(tx / 4) * 4, Math.round((py + 14) / 4) * 4, 16, 6); }
    c.globalAlpha = 1; c.translate(Math.round(px / 4) * 4, Math.round(py / 4) * 4);
    const rects = [['#1b0f06', -4, 0, 120, 28], ['#f2f2f2', 0, 4, 112, 20], ['#c9d3de', 0, 16, 112, 8], ['#e0392f', 8, 12, 88, 4],
      ['#1b0f06', 76, 24, 40, 12], ['#c9d3de', 80, 24, 32, 8], ['#1b0f06', -8, -24, 28, 28], ['#e0392f', -4, -20, 20, 24],
      ['#1b0f06', 112, 8, 16, 12], ['#7ec8ff', 96, 6, 12, 8], ['#7ec8ff', 80, 6, 12, 8], ['#7ec8ff', 64, 6, 12, 8],
      ['#1b0f06', 30, 22, 48, 24], ['#d9e2ec', 34, 22, 40, 16]];
    rects.forEach(([col, x, y, w, h]) => { c.fillStyle = col; c.fillRect(x, y, w, h); });
    c.restore();
  }
  // ---------- Nội dung ----------
  const NAMES = ['Huỳnh Nghĩa', 'Chi Hiếu', 'Hoàng My', 'Đăng Khoa', 'Ngọc Hân'];
  function drawContent(ctx) {
    ctx.save();
    ctx.lineJoin = 'round'; ctx.textBaseline = 'alphabetic';
    ctx.font = '700 100px Tinos, "Liberation Serif", "Times New Roman", serif';
    ctx.lineWidth = 14; ctx.strokeStyle = '#2b180b'; ctx.fillStyle = '#fff1d8';
    ctx.strokeText('Group Members', 72, 142); ctx.fillText('Group Members', 72, 142);
    ctx.fillStyle = '#2b180b'; ctx.fillRect(75, 172, 640, 8); ctx.fillStyle = '#f0c987'; ctx.fillRect(75, 174, 640, 4);
    ctx.font = '700 58px Tinos, "Liberation Serif", "Times New Roman", serif';
    NAMES.forEach((n, i) => {
      const y = 282 + i * 84;
      ctx.fillStyle = '#2b180b'; ctx.fillRect(84, y - 34, 26, 26); ctx.fillStyle = '#f0c987'; ctx.fillRect(88, y - 30, 18, 18);
      ctx.lineWidth = 11; ctx.strokeStyle = '#2b180b'; ctx.fillStyle = '#fff1d8';
      ctx.strokeText(n, 134, y + 4); ctx.fillText(n, 134, y + 4);
    });
    ctx.restore();
  }

  // ---------- Người que ----------
  // path: các điểm (chân) đi vòng lặp; item: đồ cầm
  const FIG = [
    { name: 'Huỳnh Nghĩa', f: 0, col: '#ff5a4f', items: ['mic'], v: 95, path: [[800, 430], [1300, 390], [1430, 610], [1000, 570]] },
    { name: 'Đăng Khoa', f: 0, col: '#5fe06a', items: ['camera'], v: 100, path: [[1450, 810], [1000, 770], [770, 700], [1100, 530], [1450, 520]] },
    { name: 'Chi Hiếu', f: 0, col: '#4fb0ff', items: ['lens'], v: 90, path: [[200, 790], [600, 830], [900, 710], [1100, 830], [520, 800]] },
    { name: 'Hoàng My', f: 0, col: '#ff7be5', items: ['palette'], v: 85, path: [[900, 340], [1200, 340], [1450, 430], [1250, 660], [850, 510]] },
    { name: 'Ngọc Hân', f: 0, col: '#ffd23f', items: ['frame'], v: 80, path: [[1300, 790], [1450, 660], [1150, 650], [800, 830], [400, 810], [300, 815], [1000, 770]] },
  ];
  FIG.forEach((F) => {
    F.seg = []; let tot = 0;
    for (let i = 0; i < F.path.length; i++) { const a = F.path[i], b = F.path[(i + 1) % F.path.length], d = Math.hypot(b[0] - a[0], b[1] - a[1]); F.seg.push([a, b, d]); tot += d; }
    F.len = tot; F.ph = rnd() * tot;
  });
  function figAt(F, t) {
    let s = (F.ph + t * F.v) % F.len;
    for (const [a, b, d] of F.seg) { if (s <= d) { const u = s / d; return { x: a[0] + (b[0] - a[0]) * u, y: a[1] + (b[1] - a[1]) * u, dx: b[0] - a[0] }; } s -= d; }
    return { x: F.path[0][0], y: F.path[0][1], dx: 1 };
  }
  function line(c, pts) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.stroke(); }
  function drawItem(c, kind, hx, hy) {       // vẽ đồ vật tại bàn tay (hx,hy), hệ toạ độ nhìn nghiêng phải
    c.save(); c.translate(hx, hy); c.lineWidth = 3; c.lineJoin = 'round';
    if (kind === 'mic') { c.fillStyle = '#222'; c.fillRect(-3, -26, 6, 26); c.fillStyle = '#d8d8d8'; c.beginPath(); c.arc(0, -32, 9, 0, 7); c.fill(); c.strokeStyle = '#222'; c.stroke(); }
    else if (kind === 'camera') { c.fillStyle = '#333'; c.fillRect(-14, -16, 30, 20); c.fillStyle = '#9ad'; c.beginPath(); c.arc(4, -6, 6, 0, 7); c.fill(); c.strokeStyle = '#111'; c.strokeRect(-14, -16, 30, 20); c.fillStyle = '#c33'; c.fillRect(-10, -20, 8, 4); }
    else if (kind === 'lens') { c.strokeStyle = '#4a2f12'; c.lineWidth = 4; line(c, [[0, 0], [-10, -16]]); c.strokeStyle = '#222'; c.fillStyle = 'rgba(190,230,255,0.6)'; c.beginPath(); c.arc(-16, -26, 11, 0, 7); c.fill(); c.stroke(); }
    else if (kind === 'pencil') { c.fillStyle = '#f2c230'; c.fillRect(-3, -34, 7, 30); c.fillStyle = '#f2b2a0'; c.fillRect(-3, -38, 7, 5); c.fillStyle = '#e8d3a8'; c.beginPath(); c.moveTo(-3, -4); c.lineTo(4, -4); c.lineTo(0, 4); c.fill(); }
    else if (kind === 'palette') { c.fillStyle = '#d9a566'; c.beginPath(); c.ellipse(0, -12, 17, 12, 0, 0, 7); c.fill(); c.strokeStyle = '#4a2f12'; c.stroke(); ['#d33', '#3a3', '#36d', '#fd3'].forEach((col, i) => { c.fillStyle = col; c.beginPath(); c.arc(-8 + i * 6, -14 + (i % 2) * 5, 2.6, 0, 7); c.fill(); }); }
    else if (kind === 'frame') { c.fillStyle = '#5a3a1a'; c.fillRect(-16, -30, 32, 28); c.fillStyle = '#9cd0ee'; c.fillRect(-12, -26, 24, 20); c.fillStyle = '#4a8a3a'; c.fillRect(-12, -14, 24, 8); c.fillStyle = '#fd3'; c.beginPath(); c.arc(6, -20, 3, 0, 7); c.fill(); }
    else if (kind === 'flower') { c.strokeStyle = '#3a8a30'; c.lineWidth = 3; line(c, [[0, 0], [0, -24]]); c.fillStyle = '#ff6b9a'; for (let k = 0; k < 5; k++) { c.beginPath(); c.arc(Math.cos(k * 1.256) * 6, -28 + Math.sin(k * 1.256) * 6, 5, 0, 7); c.fill(); } c.fillStyle = '#fd3'; c.beginPath(); c.arc(0, -28, 4, 0, 7); c.fill(); }
    c.restore();
  }
  function drawFig(c, F, t, labelAlpha) {
    const p = figAt(F, t), dir = p.dx >= 0 ? 1 : -1, sw = Math.sin(t * 7 + F.ph), bob = Math.abs(Math.sin(t * 7 + F.ph)) * 3;
    const S = 1.25;
    c.save(); c.translate(p.x, p.y); c.scale(dir * S, S);
    c.lineCap = 'round'; c.lineJoin = 'round';
    const hipY = -52, shY = -100, headY = -122 - bob * 0.5;
    c.fillStyle = 'rgba(0,0,0,0.22)'; c.beginPath(); c.ellipse(0, 0, 26, 7, 0, 0, 7); c.fill();
    const body = (col, lw) => { c.strokeStyle = col; c.lineWidth = lw; };
    for (const pass of [0, 1]) {                       // lượt 0: viền đen dày, lượt 1: nét trắng kem mảnh (người que dễ đọc trên nền đất)
      body(pass ? F.col : '#1b0f06', pass ? 5 : 10);
      // chân
      line(c, [[0, hipY - bob], [sw * 14, -26], [sw * 18, 0]]);
      line(c, [[0, hipY - bob], [-sw * 14, -26], [-sw * 18, 0]]);
      // thân
      line(c, [[0, hipY - bob], [0, shY - bob]]);
      if (F.f) {                                       // bụng bầu
        c.beginPath(); c.arc(9, -76 - bob, 17, -1.2, 1.9); c.stroke();
      }
      // tay sau (không cầm đồ) / tay trước (cầm đồ)
      const n = F.items.length;
      if (n === 2) { line(c, [[0, shY + 6 - bob], [14, -78 - bob], [24, -74 - bob + sw * 2]]); }
      else { line(c, [[0, shY + 6 - bob], [-12, -78 - bob], [-14 - sw * 8, -58 - bob]]); }
      line(c, [[0, shY + 6 - bob], [18, -86 - bob], [30, -90 - bob + sw * 2]]);
      // đầu
      c.beginPath(); c.arc(0, headY, 17, 0, 7); c.stroke();
    }
    c.fillStyle = F.col; c.beginPath(); c.arc(0, headY, 15.5, 0, 7); c.fill();
    c.fillStyle = '#1b0f06'; c.fillRect(5, headY - 4, 3, 3); c.fillRect(-4, headY - 4, 3, 3);   // mắt
    if (F.f) {                                         // tóc dài
      c.strokeStyle = '#1b0f06'; c.lineWidth = 6;
      for (let k = 0; k < 4; k++) { const o = -14 + k * 8; c.beginPath(); c.moveTo(o, headY - 10); c.quadraticCurveTo(o - 12, headY + 20, o - 6 + Math.sin(t * 5 + k) * 3, -78 - bob); c.stroke(); }
      c.beginPath(); c.arc(0, headY - 2, 17, 3.4, 6.1); c.stroke();
      c.fillStyle = '#ff6b9a'; c.beginPath(); c.arc(-12, headY - 12, 4, 0, 7); c.fill();
    }
    // đồ vật
    if (F.items.length === 1) drawItem(c, F.items[0], 30, -90 - bob + sw * 2);
    else { drawItem(c, F.items[0], 30, -90 - bob + sw * 2); drawItem(c, F.items[1], 24, -74 - bob + sw * 2); }
    c.restore();
    if (labelAlpha > 0) {
      c.save(); c.globalAlpha = labelAlpha; c.font = '700 24px Tinos, "Liberation Serif", serif'; c.textAlign = 'center'; c.lineJoin = 'round';
      c.lineWidth = 6; c.strokeStyle = '#1b0f06'; c.fillStyle = F.col;
      const ly = p.y - 122 * S - 30 - bob; c.strokeText(F.name, p.x, ly); c.fillText(F.name, p.x, ly); c.restore();
    }
  }

  // ---------- Doodle ----------
  const COMPS = [[549,4,149,149],[729,6,235,179],[325,15,201,144],[163,16,182,174],[17,22,113,222],[102,89,152,232],[484,140,183,111],[851,172,112,169],[696,184,81,199],[270,190,166,125],[773,193,83,150],[401,245,186,211],[24,271,100,193],[553,282,205,213],[148,320,253,210],[792,328,60,69],[754,385,195,137],[429,436,153,196],[530,506,170,246],[8,521,154,179],[172,526,275,239],[771,530,201,232],[673,559,90,122],[266,612,57,76],[302,612,58,66],[228,630,51,57],[457,664,193,164],[664,691,144,275],[77,712,116,111],[178,746,117,179],[820,750,119,213],[346,758,77,111],[397,795,72,68],[434,807,84,81],[34,829,79,87],[276,839,375,138],[46,849,82,112],[98,855,51,98]];
  let DOO = [];
  function buildDoodles() {
    const SC = 0.92, offs = [[10, -30], [775, 5], [400, 330]];     // 3 bản sao tờ doodle phủ kín 1536x864
    offs.forEach((o, oi) => COMPS.forEach((c, ci) => {
      const cxp = o[0] + (c[0] + c[2] / 2) * SC, cyp = o[1] + (c[1] + c[3] / 2) * SC;
      if (cxp < -80 || cxp > W + 80 || cyp < -80 || cyp > H + 80) return;
      if (oi === 2 && (cxp < 380 || cxp > 1150 || cyp < 380)) return;      // bản thứ 3 chỉ lấp chỗ trống giữa
      DOO.push({ c, x: cxp, y: cyp, sc: SC * (oi === 2 ? 0.8 : 1), ph: rnd() * 6.28, w: 1.5 + rnd() * 2.2, A: 8 + rnd() * 16, rot: (rnd() - 0.5) * 0.3, d: rnd(), flip: oi === 1 });
    }));
  }
  const T_IN = 2.75, T_OUT = 5.3, T_DONE = 6.35;

  // ---------- Hạt khói "poof" ----------
  const puffs = [];
  const addPuff = (x, y, big) => { for (let i = 0; i < (big ? 14 : 9); i++) { const a = rnd() * 6.28, s = 60 + rnd() * 160; puffs.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, t: 0, life: 0.35 + rnd() * 0.25, r: 8 + rnd() * 14 }); } };
  function drawPuffs(c) {
    puffs.forEach((p) => { const u = p.t / p.life; if (u >= 1) return; c.globalAlpha = 1 - u; c.fillStyle = '#f3e6cf'; const r = Math.round((p.r * (0.6 + u)) / 4) * 4; c.fillRect(Math.round(p.x / 4) * 4 - r / 2, Math.round(p.y / 4) * 4 - r / 2, r, r); });
    c.globalAlpha = 1;
  }

  // ---------- Đường đi của cọ ----------
  const BUCKET = { cx: 760, cy: 650, s: 1.3 };          // tâm xô
  const OPEN = [BUCKET.cx - 119 * BUCKET.s + 110 * BUCKET.s, BUCKET.cy - 123 * BUCKET.s + 40 * BUCKET.s];   // miệng xô
  const BR_S = 1.4, BR_TIP = [40, 195], BRUSH_R = 175;
  const PAINT_T0 = 1.3, PAINT_T1 = 2.75;
  const ROUTE = [[OPEN[0], OPEN[1] - 80], [70, 140], [1480, 140], [1480, 430], [70, 430], [70, 715], [1480, 715]];
  const ROUTE_D = []; let routeLen = 0;
  for (let i = 1; i < ROUTE.length; i++) { const d = Math.hypot(ROUTE[i][0] - ROUTE[i - 1][0], ROUTE[i][1] - ROUTE[i - 1][1]); ROUTE_D.push(d); routeLen += d; }
  function routeAt(s) {
    s = clamp(s, 0, routeLen);
    for (let i = 0; i < ROUTE_D.length; i++) { if (s <= ROUTE_D[i]) { const u = s / ROUTE_D[i], a = ROUTE[i], b = ROUTE[i + 1]; return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u + Math.sin(s / 55) * 22]; } s -= ROUTE_D[i]; }
    const l = ROUTE[ROUTE.length - 1]; return [l[0], l[1]];
  }
  let paintedS = 0;
  function paintUpTo(s) {
    while (paintedS < s) {
      paintedS = Math.min(s, paintedS + 14);
      const p = routeAt(paintedS);
      cx.globalCompositeOperation = 'destination-out'; cx.beginPath(); cx.arc(p[0], p[1], BRUSH_R, 0, 7); cx.fill();
      wx.globalCompositeOperation = 'source-over'; wx.globalAlpha = 1; wx.fillStyle = '#6b3e1f'; wx.beginPath(); wx.arc(p[0], p[1], BRUSH_R - 8, 0, 7); wx.fill();
    }
  }

  // ---------- Pencil ----------
  const PEN_TIP = [1, 43], PEN_S = 5;
  function penPos(t) {      // t: giây kể từ khi bút xuất hiện — nguệch ngoạc khắp tờ giấy
    return [W / 2 + 640 * Math.sin(t * 2.3) * Math.cos(t * 0.7), H / 2 + 330 * Math.sin(t * 3.1 + 1) * (0.7 + 0.3 * Math.sin(t * 1.1))];
  }

  // ---------- Vẽ khung theo thời gian ----------
  let T = 0, WT = 0, phase = 'load', lastPen = null, doneAt = -1;
  function reset() {
    cx.globalCompositeOperation = 'source-over'; cx.fillStyle = '#050505'; cx.fillRect(0, 0, W, H);
    wx.clearRect(0, 0, W, H); tx.clearRect(0, 0, W, H); paintedS = 0; puffs.length = 0; lastPen = null;
  }
  const penStart = T_IN + 0.1;
  function drawScene(ctx, figs, labelA) {
    ctx.imageSmoothingEnabled = false; ctx.drawImage(ground, 0, 0, W, H);
    if (!BARE) drawSky(ctx, WT);
    drawContent(ctx);
    if (figs) { const arr = FIG.map((F) => [figAt(F, WT).y, F]).sort((a, b) => a[0] - b[0]); arr.forEach(([, F]) => drawFig(ctx, F, WT, labelA)); }
  }
  function draw() {
    g.setTransform(1, 0, 0, 1, 0, 0);
    // Giai đoạn xong: nền trong suốt để thấy slide WebGL (ảnh slide2.png) bên dưới, chỉ vẽ người que
    if (phase === 'done' && !BARE && STILL === null && EMBED) {
      const a = clamp((T - (T_DONE + 0.6)) / 0.3);
      g.clearRect(0, 0, W, H);
      if (a < 1) { g.globalAlpha = 1 - a; drawScene(g, false, 0); g.globalAlpha = 1; }
      else drawSky(g, WT);
      FIG.map((F) => [figAt(F, WT).y, F]).sort((a, b) => a[0] - b[0]).forEach(([, F]) => drawFig(g, F, WT, 1));
      return;
    }
    g.clearRect(0, 0, W, H);
    const revealed = T >= 3.0 || phase === 'done';
    if (BARE || revealed || T < 0) {
      drawScene(g, !BARE && T >= T_OUT, 1);
    } else { g.imageSmoothingEnabled = false; g.drawImage(ground, 0, 0, W, H); }
    if (!BARE && T >= 3.0 && T < T_OUT + 0.1) drawScene(g, true, 1);   // (nội dung nằm dưới tờ doodle, chỉ lộ khi doodle tan)
    // lớp đen + vệt sơn
    if (phase !== 'done' && T < PAINT_T1 + 0.5) {
      const fade = clamp((T - PAINT_T1 - 0.1) / 0.3);
      wx.globalCompositeOperation = 'destination-out'; wx.fillStyle = 'rgba(0,0,0,0.1)'; wx.fillRect(0, 0, W, H);
      g.globalAlpha = 1 - fade; g.drawImage(cover, 0, 0); g.globalAlpha = 1;
      g.drawImage(wet, 0, 0);
    }
    // xô + cọ
    if (T < 3.1) {
      const popIn = clamp(T / 0.35), popOut = clamp((T - 2.8) / 0.25);
      const bs = BUCKET.s * backOut(popIn) * (1 - popOut);
      const shake = (T > 0.85 && T < 1.25) ? Math.sin(T * 60) * 3 : 0;
      if (bs > 0.01 && IMG.bucket.width) { g.save(); g.translate(BUCKET.cx + shake, BUCKET.cy); g.scale(bs, bs); g.imageSmoothingEnabled = true; g.drawImage(IMG.bucket, -IMG.bucket.width / 2, -IMG.bucket.height / 2); g.restore(); }
      if (T >= 0.35 && T < 2.9 && IMG.brush.width) {
        let tip;
        if (T < 0.8) { const u = easeOut((T - 0.35) / 0.45); tip = [1050 + (OPEN[0] - 1050) * u, 280 + (OPEN[1] - 90 - 280) * u]; }
        else if (T < 1.0) { const u = (T - 0.8) / 0.2; tip = [OPEN[0], OPEN[1] - 90 + u * 120]; }
        else if (T < PAINT_T0) { const u = easeOut((T - 1.0) / 0.3); tip = [OPEN[0], OPEN[1] + 30 - u * 110]; }
        else { tip = routeAt(((T - PAINT_T0) / (PAINT_T1 - PAINT_T0)) * routeLen); }
        const tilt = T >= PAINT_T0 ? Math.sin(T * 9) * 0.12 : 0, popB = T > 2.7 ? 1 - clamp((T - 2.7) / 0.2) : 1;
        if (popB > 0) { g.save(); g.translate(tip[0], tip[1]); g.rotate(tilt); g.scale(BR_S * popB, BR_S * popB); g.imageSmoothingEnabled = true; g.drawImage(IMG.brush, -BR_TIP[0], -BR_TIP[1]); g.restore(); }
      }
    }
    // tờ giấy + doodle
    if (!BARE && T >= T_IN && T < T_OUT + 0.9) {
      const paperA = T < T_OUT + 0.3 ? clamp((T - T_IN) / 0.25) : 1 - clamp((T - T_OUT - 0.3) / 0.4);
      g.globalAlpha = paperA; g.fillStyle = '#f7ecd9'; g.fillRect(0, 0, W, H);
      g.drawImage(trail, 0, 0); g.globalAlpha = 1;
      const bt = Math.floor(T * 9) / 9;       // "rung" 9 khung/giây như nét vẽ tay
      g.imageSmoothingEnabled = true;
      for (const d of DOO) {
        const inU = clamp((T - T_IN - d.d * 0.35) / 0.3), outU = clamp((T - T_OUT - d.d * 0.45) / 0.35);
        const sc = d.sc * backOut(inU) * (1 - outU * outU);
        if (sc <= 0.01) continue;
        const x = d.x + Math.sin(bt * d.w + d.ph) * d.A + Math.sin(T * 1.3 + d.ph) * 10, y = d.y + Math.cos(bt * d.w * 0.8 + d.ph) * d.A;
        g.save(); g.translate(x, y); g.rotate(Math.sin(bt * d.w * 1.2 + d.ph) * d.rot + outU * 2.2); g.scale(sc * (d.flip ? -1 : 1), sc * (1 + 0.06 * Math.sin(bt * 5 + d.ph)));
        g.drawImage(IMG.doodles, d.c[0], d.c[1], d.c[2], d.c[3], -d.c[2] / 2, -d.c[3] / 2, d.c[2], d.c[3]);
        g.restore();
      }
    }
    // bút chì
    if (!BARE && T >= penStart && T < T_OUT + 0.85) {
      const pt = T - penStart, pp = penPos(pt), popIn = clamp(pt / 0.15), popOut = clamp((T - (T_OUT + 0.55)) / 0.2);
      const jx = Math.round((rnd() - 0.5) * 6), jy = Math.round((rnd() - 0.5) * 6), s = PEN_S * backOut(popIn) * (1 - popOut);
      if (s > 0.1 && IMG.pencil.width) { g.imageSmoothingEnabled = false; g.drawImage(IMG.pencil, Math.round(pp[0] - PEN_TIP[0] * s) + jx, Math.round(pp[1] - PEN_TIP[1] * s) + jy, IMG.pencil.width * s, IMG.pencil.height * s); }
    }
    drawPuffs(g);
  }

  function updatePen() {
    if (T < penStart || T > T_OUT + 0.3) return;
    const p = penPos(T - penStart);
    if (lastPen) { tx.strokeStyle = 'rgba(70,56,40,0.55)'; tx.lineWidth = 3; tx.lineCap = 'round'; tx.beginPath(); tx.moveTo(lastPen[0], lastPen[1]); tx.lineTo(p[0], p[1]); tx.stroke(); }
    lastPen = p;
  }

  // ---------- Máy trạng thái ----------
  const post = (state) => { if (window.parent !== window) window.parent.postMessage({ type: 'anim-state', state }, '*'); };
  const FIX = 1 / 60;
  let started = false, puffed = [false, false, false, false];
  function step(dt) {
    T += dt; WT += dt;
    puffs.forEach((p) => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.95; p.vy *= 0.95; });
    if (T > PAINT_T0) paintUpTo(clamp((T - PAINT_T0) / (PAINT_T1 - PAINT_T0)) * routeLen);
    if (T >= 2.8 && !puffed[0]) { puffed[0] = true; addPuff(routeAt(routeLen)[0], routeAt(routeLen)[1], true); addPuff(BUCKET.cx, BUCKET.cy, true); }
    if (T >= penStart && !puffed[1]) { puffed[1] = true; const p = penPos(0); addPuff(p[0], p[1], false); }
    updatePen();
    if (T >= T_OUT + 0.55 && !puffed[2]) { puffed[2] = true; const p = penPos(T - penStart); addPuff(p[0], p[1], true); }
    if (T >= T_DONE && phase !== 'done') { phase = 'done'; post('done'); }
  }
  let raf = 0, last = 0, acc = 0;
  function loop(now) {
    raf = requestAnimationFrame(loop);
    if (phase === 'wait') { draw(); return; }
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    while (acc >= FIX) { step(FIX); acc -= FIX; }
    draw();
  }
  function start() { if (phase !== 'wait') return; phase = 'run'; T = 0; post('busy'); }
  function skip() {
    if (phase === 'wait') start();
    if (phase === 'done' || phase === 'load') return;
    let guard = 0;
    while (phase !== 'done' && guard++ < 3000) step(1 / 30);
    puffs.length = 0;
  }
  addEventListener('message', (ev) => {
    const d = ev.data; if (!d) return;
    if (d.type === 'anim-start') { if (phase === 'wait') start(); else if (phase !== 'done') skip(); }
    else if (d.type === 'anim-skip') skip();
  });
  addEventListener('click', () => { if (EMBED) return; if (phase === 'wait') start(); else if (phase !== 'done') skip(); });
  addEventListener('keydown', (e) => {
    if (!EMBED || window.parent === window) return;
    if (e.key === 'Backspace') e.preventDefault();
    window.parent.postMessage({ type: 'slide-key', key: e.key }, '*');
  });
  window.__anim = { step, skip, start, get phase() { return phase; }, get T() { return T; } };

  Promise.all([document.fonts ? document.fonts.ready : 0, load('brush', 'assets/paint-brush.png'), load('bucket', 'assets/paint-bucket.png'), load('doodles', 'assets/doodles.png'), load('pencil', 'assets/anim-pencil.png')]).then(() => {
    buildGround(); buildDoodles(); reset();
    cv.style.visibility = 'visible';
    if (STILL !== null) {
      WT = STILL;
      if (BARE) { phase = 'done'; T = STILL; }
      else { phase = 'run'; T = 0; while (T < STILL) step(1 / 60); }
      draw(); window.__ready = true;
      if (!BARE) raf = requestAnimationFrame(loop);
      return;
    }
    if (!INTRO) { phase = 'done'; T = T_DONE + 2; WT = 0; post('done'); raf = requestAnimationFrame(loop); return; }   // tạm tắt hiệu ứng vẽ mở đầu
    phase = 'wait'; post('wait'); raf = requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
