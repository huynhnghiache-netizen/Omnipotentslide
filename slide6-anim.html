<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide 6 - water and power</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="slides.css">
  <style>
    html, body { background: #1b1412; }
    body { padding: 0; overflow: hidden; }
    .deck { position: absolute; left: 0; top: 0; transform-origin: 0 0; zoom: 1; display: block; gap: 0; }
    /* Bố cục slide 6 có sân giếng: 2 thẻ bên trái, khung cảnh pixel bên phải, ảnh sông thật kẹp ở góc trời */
    .s6 .title { top: 52px; left: 68px; font-size: 88px; }
    .s6 .rule { top: 160px; left: 68px; right: 66px; }
    .s6 .c1 { left: 69px; top: 222px; width: 550px; height: 278px; }
    .s6 .c2 { left: 69px; top: 525px; width: 550px; height: 280px; }
    .s6 .card p { max-width: 380px; font-size: 28px; }
    .vpanel { left: 660px; top: 205px; width: 810px; height: 600px; border: 2px solid var(--line); border-radius: 26px; overflow: hidden;
              box-shadow: 0 8px 20px rgba(60,30,10,.18); background: #cfe6ee; }
    #scene { position: absolute; left: 0; top: 0; width: 810px; height: 600px; image-rendering: pixelated; }
    .snap { margin: 0; background: #fffaf2; padding: 7px; box-shadow: 0 4px 10px rgba(60,30,10,.35); z-index: 3; }
    .snap img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .sa { left: 1214px; top: 226px; width: 236px; height: 146px; transform: rotate(-2.5deg); }
  </style>
</head>
<body>
<!--
  SLIDE 6 (động): sân giếng làng chiều muộn ~1980, vẽ bằng pixel: người kéo gàu nước lên (gàu thả xuống, múc, kéo lên, đổ vào thùng),
  các chị gánh nước dừng chờ ở giếng, bé hứng nước ở vòi công cộng, đom đóm. Bóng điện trên cột sáng yếu rồi chập chờn và MẤT ĐIỆN
  (cảnh tối đi, đèn dầu sáng lên) theo chu kỳ 18 giây. Ảnh sông thật là tấm ảnh kẹp ở góc trời.
  Cảnh được vẽ bằng code trong <canvas id="scene"> (270x200 điểm ảnh, mỗi điểm = 3px). Chỉnh người ở mảng CARRIERS.
  Mở với ?still=giây để dừng ở một khung hình (dùng để xuất slide6.png).
-->
<main class="deck">
  <section class="slide s6" id="slide6">
    <h2 class="title">Water &amp; Electricity Supply</h2>
    <hr class="rule">
    <article class="card c1"><h3>Public Water Sources</h3><p>Families gathered around village wells or public taps</p></article>
    <article class="card c2"><h3>Limited Power Supply</h3><p>Frequent use of kerosene lamps due to outages</p></article>
    <div class="vpanel"><canvas id="scene" width="270" height="200"></canvas></div>
    <figure class="snap sa"><img src="assets/s6-water.jpg" alt="Women collecting water in a river"></figure>
  </section>
</main>

<script>
(() => {
  const EMBED = location.search.includes('embed');
  const STILL = (/[?&]still=([\d.]+)/.exec(location.search) || [])[1];
  const deck = document.querySelector('.deck');
  function fit() {
    const k = EMBED ? Math.max(innerWidth / 1536, innerHeight / 864) : Math.min(innerWidth / 1536, innerHeight / 864);
    Object.assign(deck.style, { transform: 'scale(' + k + ')', left: ((innerWidth - 1536 * k) / 2) + 'px', top: ((innerHeight - 864 * k) / 2) + 'px' });
  }
  if (EMBED) document.body.style.cssText = 'background:transparent;padding:0;overflow:hidden';
  addEventListener('resize', fit); fit();

  const W = 270, H = 200;
  const cv = document.getElementById('scene'), g = cv.getContext('2d');
  const bgc = document.createElement('canvas'); bgc.width = W; bgc.height = H;
  const bg = bgc.getContext('2d');
  const mulberry = (a) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const srnd = mulberry(1980);                    // cảnh nền: cố định
  let seed = 7;                                    // chuyển động: xác định để chạy lại giống nhau
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const lerp = (a, b, t) => a + (b - a) * t;
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, t) => 'rgb(' + hex(a).map((v, i) => Math.round(lerp(v, hex(b)[i], t))).join(',') + ')';
  const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); };

  function ellipse(c, cx, cy, rx, ry, col) {
    c.fillStyle = col;
    for (let y = -ry; y <= ry; y++) { const w = Math.round(rx * Math.sqrt(1 - (y * y) / (ry * ry + 0.0001))); c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1); }
  }
  function hut(c, x, base, w, flip) {
    const wallTop = base - 22, roofH = 24, roofTop = wallTop - roofH + 4;
    ellipse(c, x + w / 2, base, w / 2 + 3, 2, 'rgba(70,50,20,.25)');
    R(c, x + 4, wallTop, w - 8, 22, '#d6b688');                         // tường đất
    for (let k = 0; k < 40; k++) R(c, x + 4 + srnd() * (w - 8), wallTop + srnd() * 22, 2, 1, srnd() < 0.5 ? '#c4a373' : '#e4c99c');
    R(c, x + 4, wallTop, w - 8, 1, '#a98a5c');
    const dx = flip ? x + w - 22 : x + 12;
    R(c, dx, wallTop + 8, 10, 14, '#4a3320'); R(c, dx + 1, wallTop + 9, 8, 13, '#2f2014');         // cửa
    const wx = flip ? x + 10 : x + w - 20;
    R(c, wx, wallTop + 6, 8, 7, '#5a4128'); R(c, wx + 1, wallTop + 7, 6, 5, '#caa66e'); R(c, wx + 4, wallTop + 7, 1, 5, '#5a4128');   // cửa sổ
    for (let r = 0; r < roofH; r++) {                                   // mái lá: tam giác thô, vệt rơm
      const hw = Math.round(w / 2 - 2 + r * 0.28 - (roofH - r) * 0.9 * (w / 56) + (roofH - r) * 0.9 * (w / 56) - (roofH - r) * (w / 2 - 6) / roofH + 6);
      const half = Math.round(6 + r * ((w / 2 + 2) - 6) / (roofH - 1));
      const cx = x + w / 2;
      R(c, cx - half, roofTop + r, half * 2, 1, r % 4 === 3 ? '#7d5a30' : '#a07844');
      if (r % 4 !== 3) for (let k = 0; k < half / 3; k++) R(c, cx - half + srnd() * half * 2, roofTop + r, 1, 1, srnd() < 0.5 ? '#b88c52' : '#8a6535');
      R(c, cx - half, roofTop + r, 1, 1, '#6e4c28'); R(c, cx + half - 1, roofTop + r, 1, 1, '#6e4c28');
      void hw;
    }
    R(c, x + w / 2 - 6, roofTop - 1, 12, 2, '#6e4c28');                 // nóc
    R(c, x + w / 2 - 1, roofTop - 4, 2, 4, '#6e4c28');                  // chóp
  }
  function banana(c, x, base) {
    R(c, x, base - 16, 2, 16, '#7d9a4a');
    for (let k = 0; k < 6; k++) {
      const s = k < 3 ? -1 : 1, len = 8 + (k % 3) * 2;
      for (let i = 0; i < len; i++) { R(c, x + 1 + s * i, base - 18 + Math.round(i * i * 0.04) + (k % 3) * 2, 2, 1, i % 2 ? '#5d9a3c' : '#74b04a'); }
    }
  }

  function cloud(c, x, y, s) {
    const rows = [[3, 7], [1, 11], [0, 13], [1, 12]];
    rows.forEach(([a, w], i) => { R(c, x + a * s, y + i * s, Math.round(w * s), Math.max(1, Math.round(s)), i === 3 ? '#e8dcc8' : '#fffbf2'); });
    if (s > 1.1) R(c, x + 6 * s, y - 1 * s, Math.round(5 * s), Math.max(1, Math.round(s)), '#fffbf2');
  }
  function bamboo(c, x, h, t, ph) {
    const base = 134;
    for (let j = 0; j < 4; j++) {
      const bx = x + j * 4 + (j % 2), hh = h - j * 5, sw = Math.sin(t * 1.3 + ph + j);
      for (let y = 0; y < hh; y++) {
        const off = Math.round(sw * (y / hh) * (y / hh) * 3);
        R(c, bx + off, base - y, 2, 1, y % 9 === 0 ? '#3f6a22' : (y % 9 < 4 ? '#7fb246' : '#68a03a'));
      }
      const tx = bx + Math.round(sw * 3), ty = base - hh;
      for (let k = 0; k < 6; k++) {
        const s = k % 2 ? 1 : -1, len = 6 + (k % 3) * 2;
        for (let i = 0; i < len; i++) R(c, tx + s * i, ty + Math.round(i * 0.55) + (k >> 1) * 3 + Math.round(Math.sin(t * 2 + k + ph) * 0.6), 2, 1, i % 3 ? '#79b043' : '#5f9a34');
      }
    }
  }
  function areca(c, x, t) {                 // cây cau
    const base = 134, h = 66, sw = Math.sin(t * 1.1 + 1.7);
    for (let y = 0; y < h; y++) R(c, x + Math.round(sw * (y / h) * (y / h) * 2), base - y, 2, 1, y % 6 === 0 ? '#7a6a48' : '#9a8a64');
    const tx = x + Math.round(sw * 2), ty = base - h;
    for (let k = 0; k < 6; k++) {
      const s = k % 2 ? 1 : -1, len = 9 + (k % 3) * 2;
      for (let i = 0; i < len; i++) R(c, tx + s * i, ty + Math.round(i * i * 0.07) + (k >> 1) * 2 + Math.round(Math.sin(t * 2.2 + k) * 0.7), 2, 1, i % 2 ? '#4f8a35' : '#63a042');
    }
  }
  function chicken(c, x, y, t, ph) {
    const peck = Math.sin(t * 3 + ph) > 0.5 ? 2 : 0;
    R(c, x, y - 4, 5, 3, '#a8562a'); R(c, x - 1, y - 5, 2, 2, '#8a4220'); R(c, x + 4, y - 6 + peck, 2, 2, '#b86a30'); R(c, x + 4, y - 8 + peck, 1, 1, '#d33'); R(c, x + 6, y - 5 + peck, 1, 1, '#e8a030');
    R(c, x + 1, y - 1, 1, 2, '#c8a050'); R(c, x + 3, y - 1, 1, 2, '#c8a050');
  }
  function bird(c, b, t) {
    const x = Math.round(b.x), y = Math.round(b.y + Math.sin(t * 2 + b.p) * 2), up = Math.floor(t * 6 + b.p * 3) % 2;
    c.fillStyle = '#44403c';
    if (up) { c.fillRect(x - 3, y - 2, 2, 1); c.fillRect(x - 1, y - 1, 2, 1); c.fillRect(x + 1, y - 2, 2, 1); }
    else { c.fillRect(x - 3, y, 2, 1); c.fillRect(x - 1, y - 1, 2, 1); c.fillRect(x + 1, y, 2, 1); }
  }
  // ================= NGƯỜI (pixel) =================
  function person(o, t) {
    const d = o.d, k = o.k || 1, ph = o.ph, mv = o.moving;
    const sw = mv ? Math.sin(ph) : 0, bob = mv ? Math.abs(Math.cos(ph)) * 1.2 * k : 0;
    const X = Math.round(o.x), Y = Math.round(o.y);
    const r = (x, y, w, h, col) => {
      const px = d > 0 ? x : -x - w;
      g.fillStyle = col;
      g.fillRect(Math.round(X + px * k), Math.round(Y + y * k - bob), Math.max(1, Math.round(w * k)), Math.max(1, Math.round(h * k)));
    };
    g.fillStyle = 'rgba(60,40,15,.28)'; g.fillRect(Math.round(X - 6 * k), Y, Math.round(12 * k), 1);                  // bóng
    const s = Math.round(sw * 3 * k), lift1 = mv && Math.cos(ph) > 0 ? 1 : 0, lift2 = mv && Math.cos(ph) < 0 ? 1 : 0;
    const st = o.style;
    // chân (quần ống rộng) + dép
    r(-3 - s, -9 + lift2, 3, 9 - lift2, st.pantsD || st.pants); r(-3 - s, -1 - lift2 * 0, 3, 1, '#2b1d12');
    r(1 + s, -9 + lift1, 3, 9 - lift1, st.pants); r(1 + s, -1, 3, 1, '#2b1d12');
    if (o.cane) r(6, -14, 1, 14, '#6b4a2a');
    // tay xa
    r(-1 + Math.round(sw * 2.2 * k), -18, 2, 7, st.shirtD, 0);
    // thân áo + khăn
    r(-3, -19, 7, 10, st.shirt); r(-3, -10, 7, 1, st.shirtD); r(2, -18, 1, 8, st.shirtL);
    if (st.scarf) { r(-3, -19, 7, 1, '#ece8da'); r(-2, -19, 1, 1, '#555'); r(0, -19, 1, 1, '#555'); r(2, -19, 1, 1, '#555'); r(-3, -18, 1, 5, '#ece8da'); r(-3, -16, 1, 1, '#555'); }
    // tay gần
    r(-1 - Math.round(sw * 2.2 * k), -18, 2, 7, st.shirt); r(-1 - Math.round(sw * 2.2 * k), -11, 2, 1, '#e3b184');
    // đầu
    const hx = o.stoop ? 1 : 0;
    r(-1, -20, 3, 1, '#e3b184'); r(-2 + hx, -24, 5, 4, '#e8b98a'); r(2 + hx, -23, 1, 1, '#222');
    if (st.hat === 'non') {                                   // nón lá
      for (const [hy, hw] of [[-31, 1], [-30, 3], [-29, 5], [-28, 7], [-27, 11], [-26, 15]]) {
        r(-(hw >> 1) + hx, hy, hw, 1, '#f1dea4');
        if (hw > 1) r(1 + hx, hy, (hw >> 1), 1, hy > -28 ? '#d2b672' : '#dcc588');
      }
      r(-7 + hx, -25, 15, 1, '#a88b4a'); r(-2 + hx, -24, 1, 3, '#c9485a');
    } else if (st.hat === 'coi') {                            // mũ cối
      r(-3 + hx, -28, 7, 1, '#6a8a4c'); r(-4 + hx, -27, 9, 2, '#5f7e44'); r(-6 + hx, -25, 13, 1, '#465f32'); r(0 + hx, -27, 1, 1, '#d24');
    } else if (st.hat === 'khan') {                           // khăn đội đầu
      r(-3 + hx, -26, 7, 3, '#cfcab8'); r(-3 + hx, -26, 7, 1, '#e8e4d4'); r(-1 + hx, -24, 1, 1, '#555');
    }
    if (o.pole) {                                             // đòn gánh + 2 thúng
      const b = Math.round(Math.sin(ph * 2) * 1.2 * k);
      r(-13, -20 + b, 13, 1, '#8a6a3a'); r(0, -20 - b, 14, 1, '#8a6a3a');
      for (const [bx, by, sg] of [[-13, b, 1], [13, -b, 2]]) {
        r(bx, -19 + by, 1, 8, '#6b5530');
        r(bx - 3, -11 + by, 7, 3, '#8a5a2a'); r(bx - 3, -12 + by, 7, 1, '#aa7a3a'); r(bx - 2, -13 + by, 5, 1, sg === 1 ? '#5f9a3a' : '#d9b04a');
      }
    }
  }
  // ================= TRANG PHỤC (VN ~1980) =================
  const STY = {
    woman:  { shirt: '#6b4a32', shirtD: '#563a27', shirtL: '#7e5a40', pants: '#2c2724', hat: 'non', scarf: true },
    black:  { shirt: '#34302d', shirtD: '#27231f', shirtL: '#4a4540', pants: '#25201d', hat: 'non', scarf: true },
    indigo: { shirt: '#3d5382', shirtD: '#2f4068', shirtL: '#4f679c', pants: '#2c2724', hat: 'non', scarf: false },
    white:  { shirt: '#ebe6d6', shirtD: '#cfc9b6', shirtL: '#fffaf0', pants: '#6b5a3a', hat: 'coi', scarf: false },
    elder:  { shirt: '#8a6f4a', shirtD: '#715a3b', shirtL: '#9b8058', pants: '#2c2724', hat: 'khan', scarf: false },
    boy:    { shirt: '#c08a44', shirtD: '#a47235', shirtL: '#d09c56', pants: '#5a4a35', hat: 'non', scarf: false },
    kid:    { shirt: '#b84a3a', shirtD: '#9a3c2e', shirtL: '#c85e4c', pants: '#3a3a52', hat: 'non', scarf: false }
  };
  // ================= NỀN: chiều muộn ở sân giếng làng (vẽ 1 lần) =================
  const GY = 154;                                                      // chân giếng
  const WELL = { x: 128, ry: 141 };                                    // tâm giếng, mép miệng giếng
  const TAP = { x: 184 };                                              // vòi nước công cộng
  const POLE = { x: 64 };                                              // cột điện
  function drawBackground() {
    const c = bg, B = [[0, 0], [2, 2], [3, 1], [1, 3]];
    const top = '#6f93c4', mid = '#f1b98a', low = '#fbdfa6';
    const pal = Array.from({ length: 12 }, (_, i) => { const t = i / 11; return t < 0.6 ? mix(top, mid, t / 0.6) : mix(mid, low, (t - 0.6) / 0.4); });
    for (let y = 0; y < 116; y++) for (let x = 0; x < W; x++) {
      const v = y / 116 * 11, b = Math.floor(v), f = v - b, thr = B[(y & 1) * 2 + (x & 1)][0] / 4 * 0.9 + 0.05;
      R(c, x, y, 1, 1, pal[Math.min(11, f > thr ? b + 1 : b)]);
    }
    // mặt trời lặn sau núi
    c.globalAlpha = 0.25; ellipse(c, 214, 96, 26, 26, '#ffe6a8'); c.globalAlpha = 0.4; ellipse(c, 214, 96, 18, 18, '#ffd27a'); c.globalAlpha = 1;
    ellipse(c, 214, 98, 11, 11, '#ffb85a'); ellipse(c, 214, 98, 8, 8, '#ffd98a');
    // núi + hàng cây xa
    for (let x = 0; x < W; x++) {
      const y1 = 92 + Math.sin(x * 0.04) * 6 + Math.sin(x * 0.12 + 1) * 3, y2 = 102 + Math.sin(x * 0.07 + 2) * 4;
      R(c, x, y1, 1, 120 - y1, '#9aa8bc'); R(c, x, y2, 1, 120 - y2, '#7d8ea0');
    }
    for (let x = 0; x < W; x += 3) { const h = 6 + srnd() * 6; R(c, x, 112 - h + 6, 4, h, srnd() < 0.5 ? '#4f6e52' : '#5b7b58'); }
    // đất sân
    R(c, 0, 118, W, 72, '#d3ad73');
    for (let k = 0; k < 800; k++) R(c, srnd() * W, 119 + srnd() * 70, 1 + (srnd() < 0.3 ? 1 : 0), 1, srnd() < 0.5 ? '#c19a60' : '#e2c48c');
    R(c, 0, 118, W, 2, '#8fae5c'); for (let k = 0; k < 90; k++) R(c, srnd() * W, 118 + srnd() * 3, 2, 1, srnd() < 0.5 ? '#7d9c4c' : '#a2c06a');
    // lối mòn dẫn tới giếng (đất sẫm do ẩm)
    ellipse(c, WELL.x, GY + 2, 34, 6, '#b99560'); ellipse(c, WELL.x, GY + 2, 26, 4, '#a98650'); ellipse(c, TAP.x - 6, GY + 3, 12, 3, '#a98650');
    // cỏ tiền cảnh
    R(c, 0, 187, W, 13, '#7f9f4c');
    for (let k = 0; k < 150; k++) R(c, srnd() * W, 187 + srnd() * 13, 2, 2, srnd() < 0.5 ? '#6c8c3d' : '#94b45c');
    // nhà tranh hai bên, chuối, cau
    hut(c, 6, 142, 56, false); hut(c, 208, 142, 54, true);
    banana(c, 70, 134); banana(c, 202, 134);
    // hàng rào tre
    for (let x = 8; x < 60; x += 6) R(c, x, 143, 1, 8, '#7a5a34'); R(c, 8, 145, 52, 1, '#8c6b40'); R(c, 8, 148, 52, 1, '#8c6b40');
    // cột điện bê tông + xà ngang + sứ + dây
    R(c, POLE.x, 46, 3, GY - 46 + 2, '#8d8a83'); R(c, POLE.x + 2, 46, 1, GY - 46 + 2, '#6f6c66'); R(c, POLE.x - 7, 52, 17, 2, '#5a4a38'); R(c, POLE.x - 6, 50, 2, 2, '#cfd6d8'); R(c, POLE.x + 6, 50, 2, 2, '#cfd6d8'); R(c, POLE.x + 1, 50, 2, 2, '#cfd6d8');
    for (let x = 0; x <= POLE.x - 5; x++) px(c, x, 52 + Math.round(Math.sin(x / (POLE.x - 5) * Math.PI) * 4) - 3 + 3, '#3d3a36');
    for (let x = POLE.x + 8; x < W; x++) px(c, x, 52 + Math.round(Math.sin((x - POLE.x - 8) / (W - POLE.x - 8) * Math.PI) * 5), '#3d3a36');
  }
  function px(c, x, y, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), 1, 1); }
  function wellFront(c) {                                              // thành giếng gạch (vẽ sau gàu để che phần gàu dưới miệng giếng)
    const x0 = WELL.x - 17, w = 34;
    for (let y = 0; y < 14; y++) {
      const row = Math.floor(y / 3.5);
      for (let x = 0; x < w; x++) { const off = (row % 2) * 4; c.fillStyle = ((x + off) % 8 === 0 || y % 3.5 < 0.6) ? '#7a4a32' : ((x * 7 + y * 3) % 11 < 3 ? '#b56d4a' : '#a95f3e'); c.fillRect(x0 + x, WELL.ry + y, 1, 1); }
    }
    R(c, x0 - 1, WELL.ry - 2, w + 2, 3, '#c9c2b2'); R(c, x0 - 1, WELL.ry - 2, w + 2, 1, '#e3ddcf'); R(c, x0 - 1, WELL.ry + 1, w + 2, 1, '#8a8474');   // gờ miệng giếng
    ellipse(c, WELL.x, GY + 1, 20, 2, 'rgba(60,40,20,.3)');
  }
  function wellFrame(c, t) {                                           // hai trụ gỗ + xà + ròng rọc
    R(c, WELL.x - 16, 112, 3, 31, '#7a5a34'); R(c, WELL.x + 13, 112, 3, 31, '#7a5a34'); R(c, WELL.x - 16, 112, 1, 31, '#5e4426');
    R(c, WELL.x - 19, 110, 38, 3, '#8c6b40'); R(c, WELL.x - 19, 110, 38, 1, '#a98250');
    R(c, WELL.x - 16, 106, 32, 4, '#a07844'); for (let r = 0; r < 4; r++) R(c, WELL.x - 16 + r * 2, 102 + r, 32 - r * 4, 1, r % 2 ? '#8a6535' : '#b48a50');   // mái che nhỏ
    // ròng rọc
    ellipse(c, WELL.x, 118, 4, 4, '#5a5048'); ellipse(c, WELL.x, 118, 2, 2, '#9a9082'); px(c, WELL.x, 118, '#2a2420');
  }
  // đèn dầu (kerosene): kính + ngọn lửa; on = độ sáng 0..1
  function kerosene(c, x, y, t, k) {
    R(c, x - 2, y + 4, 5, 2, '#5a4a38'); R(c, x - 2, y, 5, 4, 'rgba(235,225,190,.85)'); R(c, x - 1, y - 2, 3, 2, '#7a7468');
    const fl = 1 + Math.round(Math.sin(t * 17 + x) * 0.6 + Math.sin(t * 9) * 0.4);
    R(c, x, y + 3 - fl, 1, 1 + fl, '#fff1a8'); R(c, x, y + 2 - fl, 1, 1, '#ffb347');
  }

  // ================= CHUYỂN ĐỘNG: gàu nước, người gánh, vòi nước, điện chập chờn =================
  const clouds = [{ x: 20, y: 18, s: 1 }, { x: 140, y: 10, s: 1.3 }, { x: 225, y: 30, s: 0.9 }];
  const birds = [{ x: 30, y: 40, v: 9, p: 0 }, { x: 14, y: 48, v: 9, p: 1.1 }, { x: 4, y: 36, v: 9, p: 2.0 }];
  const drops = [], flies = Array.from({ length: 16 }, (_, i) => ({ x: 20 + srnd() * 230, y: 100 + srnd() * 70, ph: srnd() * 6.28, sp: 0.4 + srnd() * 0.8 }));
  const smoothS = (u) => u * u * (3 - 2 * u);
  const BT = 7.0, B_TOP = 128, B_BOT = 148;
  function bucketAt(t) {                                               // gàu: thả xuống, múc, kéo lên, đổ vào thùng
    const u = t % BT; let y, tilt = 0;
    if (u < 1.4) y = B_TOP + (B_BOT - B_TOP) * smoothS(u / 1.4);
    else if (u < 2.1) y = B_BOT;
    else if (u < 4.3) y = B_BOT - (B_BOT - B_TOP) * smoothS((u - 2.1) / 2.2);
    else { y = B_TOP; tilt = u < 4.6 ? (u - 4.3) / 0.3 : u < 5.5 ? 1 : Math.max(0, 1 - (u - 5.5) / 0.4); }
    return { u, y, tilt, pour: u > 4.6 && u < 5.5 };
  }
  let prevU = 0;
  function stepScene(dt, t) {
    clouds.forEach((c, i) => { c.x += dt * (1.2 + i * 0.6); if (c.x > W + 6) c.x = -20; });
    birds.forEach((b) => { b.x += dt * b.v; if (b.x > W + 8) b.x = -10; });
    const u = t % BT;
    if (prevU < 1.4 && u >= 1.4) for (let i = 0; i < 9; i++) drops.push({ x: WELL.x - 1 + (rnd() - 0.5) * 4, y: WELL.ry - 1, vx: (rnd() - 0.5) * 22, vy: -(18 + rnd() * 16), a: 0 });
    prevU = u;
    if ((u > 4.6 && u < 5.5 && rnd() < dt * 20) || rnd() < dt * 1.5) drops.push({ x: TAP.x - 5 + (rnd() - 0.5), y: GY - 3, vx: (rnd() - 0.5) * 14, vy: -(10 + rnd() * 10), a: 0, tap: true });
    for (let i = drops.length - 1; i >= 0; i--) { const d = drops[i]; d.a += dt; d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 90 * dt; if (d.a > 0.6) drops.splice(i, 1); }
  }
  function bucketDraw(t) {
    const bk = bucketAt(t), bx = WELL.x - 2;
    // dây: hai nhánh qua ròng rọc, nhánh trái xuống gàu, nhánh phải xuống tay người kéo
    const hy = 140 - (bk.y - B_TOP) * 0.55, hx = WELL.x + 17;
    for (let y = 119; y < bk.y; y++) px(g, WELL.x - 4, y, '#7a6a4a');
    line((a, b) => px(g, a, b, '#7a6a4a'), WELL.x + 4, 119, hx, hy);
    // gàu: thân kẽm, miệng nghiêng khi đổ
    const tx = Math.round(bk.tilt * 4);
    R(g, bx - 3 + tx, bk.y - 1, 7, 1, '#cfd6d8'); R(g, bx - 3 + tx, bk.y, 7, 5, '#98a4aa'); R(g, bx - 3 + tx, bk.y + 5, 7, 1, '#6f7a80'); R(g, bx + 2 + tx, bk.y, 1, 5, '#7e8a90');
    if (!bk.pour) R(g, bx - 2 + tx, bk.y - 1, 5, 1, '#6db6d8');
    px(g, bx - 3 + tx, bk.y - 3, '#4a4440'); px(g, bx + 3 + tx, bk.y - 3, '#4a4440'); L(bx - 3 + tx, bk.y - 3, bx + 3 + tx, bk.y - 3, '#4a4440');
    return { bk, hx, hy };
  }
  function L(x0, y0, x1, y1, col) { line((a, b) => px(g, a, b, col), x0, y0, x1, y1); }
  function line(fn, x0, y0, x1, y1) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1); for (let i = 0; i <= n; i++) fn(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n)); }
  function pailDraw(x, y, level) {                                     // thùng hứng nước
    R(g, x - 4, y - 5, 9, 5, '#8a6a3a'); R(g, x - 4, y - 5, 9, 1, '#b08a50'); R(g, x - 4, y - 2, 9, 1, '#6e5228');
    if (level > 0) R(g, x - 3, y - 5, 7, 1, '#6db6d8');
  }
  // người đi gánh nước: dừng lại gần giếng để chờ
  const CARRIERS = [
    { kind: 'person', x: 10,  y: 166, d: 1,  v: 9,  style: STY.woman, pole: true, stopX: 98 },
    { kind: 'person', x: 260, y: 172, d: -1, v: 8,  style: STY.black, pole: true, stopX: 166 },
    { kind: 'person', x: 90,  y: 180, d: 1,  v: 10, style: STY.indigo, pole: true },
    { kind: 'person', x: 200, y: 124, d: -1, v: 6,  style: STY.elder, cane: true, stoop: true, pausing: true },
    { kind: 'person', x: 150, y: 186, d: -1, v: 12, style: STY.kid, k: 0.7 }
  ];
  CARRIERS.forEach((w, i) => { w.ph = i * 1.3; w.moving = true; w.wait = 0; w.next = 2 + i * 0.7; w.stopped = false; });
  const DRAWER = { x: WELL.x + 24, y: GY + 2, d: -1, k: 1, ph: 0, moving: false, style: STY.woman };
  const KID = { x: TAP.x - 12, y: GY + 5, d: -1, k: 0.72, ph: 0, moving: false, style: STY.kid };
  function stepActors(dt, t) {
    for (const w of CARRIERS) {
      if (w.wait > 0) { w.wait -= dt; w.moving = false; if (w.wait <= 0) { w.moving = true; if (!w.stopX) w.d = rnd() < 0.5 ? w.d : -w.d; } continue; }
      w.x += w.d * w.v * dt; w.ph += dt * w.v * 0.62;
      if (w.x > W + 24) { w.d = -1; w.stopped = false; } else if (w.x < -24) { w.d = 1; w.stopped = false; }
      if (w.stopX && !w.stopped && Math.abs(w.x - w.stopX) < 1.2) { w.stopped = true; w.wait = 3.2 + rnd(); }
      if (w.pausing && t > w.next) { w.next = t + 5 + rnd() * 6; w.wait = 1.6 + rnd() * 1.8; }
    }
  }

  // ================= ĐIỆN: sáng yếu, chập chờn rồi mất điện, đèn dầu sáng lên =================
  function power(t) {                                                  // 0..1; chu kỳ 18 giây
    const s = t % 18;
    const hashT = (a) => { const x = Math.sin(a * 91.7) * 43758.5453; return x - Math.floor(x); };
    if (s < 9) return 0.82 + 0.1 * Math.sin(t * 2.7) * Math.sin(t * 0.9);
    if (s < 10.6) return hashT(Math.floor(t * 14)) > 0.45 ? 0.85 : 0.08;
    if (s < 15) return 0;
    if (s < 16.2) return hashT(Math.floor(t * 14) + 50) > 0.5 ? 0.85 : 0.05;
    return 0.8;
  }
  function halo(x, y, r, col, a) {                                     // quầng sáng pixel: các vòng ellipse nhạt dần
    g.save(); g.globalCompositeOperation = 'lighter';
    for (let i = 5; i >= 1; i--) { g.globalAlpha = a * (0.07 + (6 - i) * 0.028); ellipse(g, x, y, Math.round(r * i / 5), Math.round(r * i / 5 * 0.85), col); }
    g.restore(); g.globalAlpha = 1;
  }
  function lighting(t) {
    const P = power(t), dark = (1 - Math.min(1, P / 0.8)) * 0.34;
    if (dark > 0.01) { g.globalAlpha = dark; R(g, 0, 0, W, H, '#14123a'); g.globalAlpha = 1; }
    // bóng đèn trên cột điện
    const bx = POLE.x + 1, by = 60; R(g, bx + 1, 54, 1, 4, '#3d3a36'); R(g, bx, by - 2, 3, 4, P > 0.3 ? '#fff2b0' : '#8a8576'); R(g, bx, by - 3, 3, 1, '#5a5448');
    if (P > 0.05) halo(bx + 1, by, 15, '#ffe9a8', P * 0.55);
    // đèn dầu: sáng hơn khi mất điện
    const kk = 0.55 + 0.45 * (1 - Math.min(1, P / 0.8)), fl = 0.9 + 0.1 * Math.sin(t * 13) + 0.05 * Math.sin(t * 29);
    for (const [lx, ly] of [[WELL.x + 9, 116], [TAP.x + 3, GY - 19], [DRAWER.x + 3, GY - 36 + 0]]) {
      if (lx === DRAWER.x + 3) continue;
      kerosene(g, lx, ly, t, kk); halo(lx, ly + 2, 10 + 14 * (1 - Math.min(1, P / 0.8)), '#ffb35a', kk * fl);
    }
    // cửa sổ hai nhà: ánh đèn dầu bên trong
    for (const wx of [42, 218]) { R(g, wx, 127, 8, 7, '#3a2a18'); R(g, wx + 1, 128, 6, 5, mix('#c9a050', '#ffd98a', kk * fl)); }
    halo(46, 130, 10 + 10 * (1 - Math.min(1, P / 0.8)), '#ffc060', kk * 0.8); halo(222, 130, 10 + 10 * (1 - Math.min(1, P / 0.8)), '#ffc060', kk * 0.8);
    // đom đóm: hiện rõ khi tối
    for (const f of flies) {
      const x = f.x + Math.sin(t * f.sp + f.ph) * 8, y = f.y + Math.cos(t * f.sp * 0.8 + f.ph) * 5, b = Math.max(0, Math.sin(t * 2 * f.sp + f.ph * 3));
      if (b > 0.3) { g.globalAlpha = (0.35 + dark * 1.2) * b; R(g, x, y, 1, 1, '#e4ff8a'); g.globalAlpha = 0.15 * b; R(g, x - 1, y - 1, 3, 3, '#e4ff8a'); g.globalAlpha = 1; }
    }
    return P;
  }

  // ================= VẼ MỖI KHUNG =================
  function draw(t) {
    g.drawImage(bgc, 0, 0);
    clouds.forEach((c) => cloud(g, c.x, c.y, c.s));
    birds.forEach((b) => bird(g, b, t));
    bamboo(g, 98, 54, t, 0.4 + 6); areca(g, 238, t); areca(g, 22, t + 2);
    chicken(g, 216, 150, t, 0); chicken(g, 30, 152, t, 2.2);
    wellFrame(g, t);
    const bd = bucketDraw(t);
    wellFront(g);
    // người kéo nước: tay theo dây
    person(DRAWER, t);
    const sx = DRAWER.x - 3, sy = DRAWER.y - 18;
    L(sx, sy, bd.hx, bd.hy, '#563a27'); L(sx, sy + 1, bd.hx, bd.hy + 1, '#6b4a32'); px(g, bd.hx, bd.hy, '#e3b184');
    // thùng hứng nước dưới chân + dòng nước đổ
    const pailX = WELL.x + 16, pailY = GY + 4;
    pailDraw(pailX, pailY, 1);
    if (bd.bk.pour) { for (let i = 0; i < 18; i++) { const s = i / 17, x = WELL.x + 4 + (pailX - WELL.x - 4) * s, y = bd.bk.y + 2 + (pailY - 6 - bd.bk.y) * s * s; if ((i + Math.floor(t * 24)) % 3) px(g, x, y, '#8fd0ea'); } }
    // vòi nước công cộng
    R(g, TAP.x, GY - 16, 9, 16, '#a9a49a'); R(g, TAP.x, GY - 16, 9, 2, '#cfc9bc'); R(g, TAP.x + 8, GY - 16, 1, 16, '#86817a');
    R(g, TAP.x - 7, GY - 13, 8, 2, '#6a6e72'); R(g, TAP.x - 8, GY - 12, 2, 4, '#6a6e72');
    const lvl = Math.min(1, (t % 6) / 5);                              // gàu của bé đầy dần
    for (let y = GY - 10; y < GY - 4; y++) if (((y + Math.floor(t * 18)) % 3) !== 0) px(g, TAP.x - 7, y, '#8fd0ea');
    R(g, TAP.x - 10, GY - 4, 7, 5, '#8a6a3a'); R(g, TAP.x - 10, GY - 4, 7, 1, '#b08a50'); if (lvl > 0.1) R(g, TAP.x - 9, GY - 4 - Math.round(lvl * 0.9), 5, 1, '#6db6d8');
    for (const d of drops) { g.globalAlpha = 1 - d.a / 0.6; px(g, d.x, d.y, '#9fdcf0'); g.globalAlpha = 1; }
    // người, xếp theo y
    const items = [];
    CARRIERS.forEach((w) => items.push({ y: w.y, f: () => person(w, t) }));
    items.push({ y: KID.y, f: () => person(KID, t) });
    items.sort((a, b) => a.y - b.y).forEach((it) => it.f());
    lighting(t);
    // cỏ tiền cảnh đung đưa
    for (let i = 0; i < 70; i++) {
      const x = i * 3.9 + (i % 3), h = 5 + (i * 7 % 5), sw = Math.sin(t * 2 + i * 0.7) * 1.4;
      for (let y = 0; y < h; y++) R(g, x + Math.round(sw * y / h * 1.5), 199 - y, 1, 1, i % 4 ? '#6f9440' : '#87ac4e');
      if (i % 13 === 0) R(g, x + Math.round(sw * 1.5), 199 - h - 1, 2, 2, i % 2 ? '#f6d65a' : '#f2a0b8');
    }
  }

  drawBackground();
  let t = 0, last = 0, acc = 0;
  const FIX = 1 / 60;
  function stepAll(dt) { t += dt; stepScene(dt, t); stepActors(dt, t); }
  function loop(now) {
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    while (acc >= FIX) { stepAll(FIX); acc -= FIX; }
    draw(t);
    requestAnimationFrame(loop);
  }
  if (STILL) { const n = Math.round(parseFloat(STILL) / FIX); for (let i = 0; i < n; i++) stepAll(FIX); draw(t); window.__ready = true; }
  else { last = performance.now(); requestAnimationFrame(loop); }
  addEventListener('keydown', (e) => {
    if (!EMBED || window.parent === window) return;
    if (e.key === 'Backspace') e.preventDefault();
    window.parent.postMessage({ type: 'slide-key', key: e.key }, '*');
  });
})();
</script>
</body>
