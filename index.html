<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Critical Slash Slide Presentation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background-color: #030303; font-family: 'Courier New', Courier, monospace; }
    #canvas-container { width: 100vw; height: 100vh; position: relative; }
    #fx {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 10; image-rendering: pixelated;
    }
    /* Lớp đồ họa phủ: vignette tối 4 góc + scanline mờ kiểu màn hình retro */
    #overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 25;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 100%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 3px);
    }
    .dmg {
      position: fixed; display: block; pointer-events: none; z-index: 22;
      image-rendering: pixelated; transform-origin: 50% 50%;
      filter: drop-shadow(4px 4px 0 #000);
    }
    /* Slide đang được phóng từ thẻ lên toàn màn hình */
    .fly {
      position: fixed; z-index: 36; pointer-events: none;
      background-size: 100% 100%; background-repeat: no-repeat;
      box-shadow: 0 0 0 3px #000;
    }
    /* Slide 3: bản có chuyển động (slide3-anim.html) phủ lên khi mở */
    #anim3 { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 20; display: none; background: transparent; pointer-events: none; }
    @keyframes blink { to { visibility: hidden; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ===== Frame 1: START ===== */
    #start {
      position: fixed; inset: 0; z-index: 40;
      display: flex; align-items: center; justify-content: center;
      background: #050205;
    }
    .start-btn {
      position: relative; z-index: 1;
      font-family: 'Press Start 2P', monospace; font-size: clamp(22px, 5vw, 48px);
      letter-spacing: 4px; color: #fff; background: none; border: none; cursor: pointer;
      text-shadow: 4px 4px 0 #8a0016, 8px 8px 0 #000;
      animation: pulse 1.6s ease-in-out infinite;
      transition: color 0.15s, transform 0.15s;
    }
    .start-btn:hover { color: #ff3344; transform: scale(1.05); }
    .start-btn:focus-visible { outline: 3px dashed #ffb3b9; outline-offset: 14px; }

    /* ===== Frame 2: DANH SÁCH 10 SLIDE ===== */
    #grid {
      position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column;
      padding: 36px 48px 0; overflow: hidden;
      background: radial-gradient(ellipse at 50% 0%, #2a0810 0%, #0b0304 60%, #000 100%);
    }
    #deco { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .frame { position: absolute; inset: 14px; border: 2px solid rgba(255, 51, 68, 0.22); pointer-events: none; z-index: 0; }
    .frame::before, .frame::after { content: ''; position: absolute; width: 36px; height: 36px; border: 4px solid #ff3344; }
    .frame::before { left: -4px; top: -4px; border-right: none; border-bottom: none; }
    .frame::after { right: -4px; bottom: -4px; border-left: none; border-top: none; }
    .grid-inner {
      position: relative; z-index: 1; flex: 1; min-height: 0;
      display: flex; flex-direction: column; width: 100%; max-width: 1400px; margin: 0 auto;
      padding-bottom: 24px;
    }
    .grid-head {
      display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px;
      margin-bottom: 26px;
    }
    .grid-head h2 {
      font-family: 'Press Start 2P', monospace; font-weight: 400; font-size: clamp(16px, 2.6vw, 28px);
      color: #fff; text-shadow: 4px 4px 0 #8a0016, 8px 8px 0 #000;
      animation: jitter 3.2s steps(1) infinite;
    }
    @keyframes jitter {
      0%, 88%, 100% { transform: none; }
      90% { transform: translateX(-4px); text-shadow: -3px 0 0 #00e5ff, 4px 4px 0 #8a0016; }
      92% { transform: translateX(3px); text-shadow: 3px 0 0 #ff3344, 6px 6px 0 #000; }
      94% { transform: none; }
    }
    /* Hai nút ở giữa phía trên: bánh răng (mở bảng cài đặt trống) và trái tim xanh Undertale (chỉ để bấm) */
    .tools { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); display: flex; gap: 22px; align-items: center; z-index: 2; }
    .tool {
      width: 54px; height: 54px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;
      background: #111; border: 3px solid #000; box-shadow: 0 5px 0 #000;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    }
    .tool canvas { width: 32px; height: 32px; display: block; image-rendering: pixelated; filter: drop-shadow(2px 2px 0 #000); }
    .tool:hover { transform: translateY(-3px); border-color: #ff3344; box-shadow: 0 8px 0 #000, 0 0 14px rgba(255, 51, 68, 0.45); }
    .tool.heart:hover { border-color: #3d66ff; box-shadow: 0 8px 0 #000, 0 0 14px rgba(0, 60, 255, 0.55); }
    .tool:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
    .tool:focus-visible { outline: 3px dashed #ffb3b9; outline-offset: 4px; }

    /* ===== Chế độ tim xanh: màn đen + tim, lớp glitch, tim đỏ để thoát ===== */
    #soulIntro { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: #000; }
    #soulHeart { width: clamp(96px, 17vmin, 200px); height: auto; image-rendering: pixelated; position: relative; z-index: 1; }
    .soul-ring { position: absolute; inset: 0; margin: auto; width: clamp(96px, 17vmin, 200px); height: clamp(96px, 17vmin, 200px); border: 6px solid #3d66ff; pointer-events: none; }
    #pov { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 12; pointer-events: none; display: none; }
    #glitch { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 52; pointer-events: none; display: none; }
    #soulBack {
      position: fixed; right: 18px; top: 18px; z-index: 56; width: 48px; height: 48px; padding: 0; display: none;
      align-items: center; justify-content: center; cursor: pointer;
      background: rgba(0, 0, 0, 0.6); border: 3px solid #000; box-shadow: 0 5px 0 #000;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    }
    #soulBack canvas { width: 28px; height: auto; display: block; image-rendering: pixelated; filter: drop-shadow(2px 2px 0 #000); animation: soulBeat 1.2s steps(1) infinite; }
    #soulBack:hover { transform: translateY(-3px); border-color: #ff3344; box-shadow: 0 8px 0 #000, 0 0 14px rgba(255, 51, 68, 0.5); }
    #soulBack:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
    #soulBack:focus-visible { outline: 3px dashed #ffb3b9; outline-offset: 4px; }
    @keyframes soulBeat { 0%, 70%, 100% { transform: none; } 78% { transform: scale(1.18); } 86% { transform: none; } 92% { transform: scale(1.1); } }

    /* Bảng cài đặt: để trống */
    #settings {
      position: fixed; inset: 0; z-index: 34; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.72); opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    #settings.show { opacity: 1; pointer-events: auto; }
    .settings-box {
      position: relative; width: min(560px, 88vw); height: min(340px, 62vh);
      background: #000; border: 4px solid #fff; box-shadow: 0 0 0 4px #000, 8px 8px 0 4px rgba(255, 51, 68, 0.5);
    }
    .settings-title { position: absolute; left: 20px; top: 18px; font-family: 'Press Start 2P', monospace; font-size: 14px; color: #fff; text-shadow: 3px 3px 0 #8a0016; }
    .settings-close { position: absolute; right: 12px; top: 10px; padding: 8px; background: none; border: none; cursor: pointer; font-family: 'Press Start 2P', monospace; font-size: 14px; color: #fff; }
    .settings-close:hover { color: #ff3344; }
    .settings-hint { position: absolute; left: 20px; bottom: 14px; font-family: 'Press Start 2P', monospace; font-size: 9px; letter-spacing: 1px; color: rgba(255, 255, 255, 0.4); }

    .cursor { animation: blink 1s steps(2, start) infinite; }
    .grid-head span { font-size: 12px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.55); text-shadow: 2px 2px 0 #000; }
    .cards {
      flex: 1; min-height: 0;
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .card {
      position: relative; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
      padding: 0; text-align: left; cursor: pointer; font: inherit; color: #fff; background: #111;
      border: 3px solid #000; box-shadow: 0 6px 0 #000;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    }
    .card img { flex: 1; min-height: 0; width: 100%; object-fit: cover; display: block; }
    .card-meta {
      flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; background: #0a0a0a; border-top: 3px solid #000;
    }
    .card-num { font-family: 'Press Start 2P', monospace; font-size: 10px; color: #ff3344; }
    .card-title { font-size: 13px; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card::after {
      content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; pointer-events: none;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.22), transparent);
      transition: left 0.6s ease;
    }
    .card:hover::after { left: 120%; }
    .card:hover { transform: translateY(-4px); border-color: #ff3344; box-shadow: 0 10px 0 #000, 0 0 18px rgba(255, 51, 68, 0.45); }
    .card:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
    .card:focus-visible { outline: 3px dashed #ffb3b9; outline-offset: 4px; }
    .ticker {
      flex: 0 0 auto; position: relative; z-index: 1; overflow: hidden; white-space: nowrap;
      margin: 0 -48px; padding: 12px 0; background: #000; border-top: 3px solid #000;
    }
    .ticker-track {
      display: inline-block; animation: ticker 24s linear infinite;
      font-family: 'Press Start 2P', monospace; font-size: 10px; letter-spacing: 1px; color: rgba(255, 255, 255, 0.55);
    }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* ===== Bảng chọn slide cầm kiếm (khi bị Sans chặn) ===== */
    #choose {
      position: fixed; top: 36px; left: 50%; z-index: 32; text-align: center;
      transform: translate(-50%, -20px); opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #choose.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    #choose h3 {
      font-family: 'Press Start 2P', monospace; font-weight: 400; font-size: 13px; color: #fff;
      text-shadow: 3px 3px 0 #8a0016, 6px 6px 0 #000; margin-bottom: 10px;
    }
    #choose p { font-size: 12px; letter-spacing: 1px; color: rgba(255, 255, 255, 0.6); margin-bottom: 14px; text-shadow: 2px 2px 0 #000; }
    #picks { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; max-width: 92vw; }
    .pick {
      font-family: 'Press Start 2P', monospace; font-size: 11px; color: #fff;
      background: #ff3344; border: 3px solid #000; padding: 10px 12px; cursor: pointer;
      box-shadow: 0 5px 0 #000; transition: transform 0.1s, background 0.15s;
    }
    .pick:hover:not(:disabled) { background: #ff5566; transform: translateY(-2px); }
    .pick:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
    .pick:disabled { background: #2a2a2a; color: #666; cursor: not-allowed; box-shadow: 0 5px 0 #000; }

    @media (max-width: 760px) {
      #grid { padding: 24px 16px 0; overflow-y: auto; }
      .grid-inner { flex: none; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: 180px; }
      .ticker { margin: 0 -16px; }
    }

      "......KDDRWhhHK......",
      "......KDDRWhHHK......",
      "......KDRRWhhHK......",
      "......KDRRRhhHK......",
      "......KDRRRhHHK......",
      "......KDDRhhHHK......",
      "......KDRRWhhHK......",
      "......KDDRRhhHK......",
      "......KDRRRhHHK......",
      "......KDRRRhhHK......",
      "......KDrRRhHHK......",
      "......KDDRRhhHK......",
      "......KDDRRhHHK......",
      "......KDDRRhHHK......",
      "......KDRRRhHHK......",
      "......KDDRRhHHK......",
      "......KDrRRhHHK......",
      "......KDRRRhHHK......",
      "......KDRRRhHHK......",
      "......KDDRDhgHK......",
      ".KKKKKKKDDDggKKKKKKK.",
      "KKHHKggKKKDKKKggKHHKK",
      "KgGGKKgggKKKggKKGgGgK",
      "KgggggKKgKhKgKKgggggK",
      "KgKKKKggKKRKKggKKKKgK",
      "KgK..KKKgKDKgKKK..KgK",
      "KgK....KKKKKKK....KgK",
      "KKK....KQQQQQK....KKK",
      ".......KKKKKKK.......",
      ".......KQQQQQK.......",
      ".......KKKKKKK.......",
      ".......KKDDDKK.......",
      ".......KKKKKKK.......",
      ".......KgWGWgK.......",
      ".......KKKKKKK.......",
      ".......KgggggK.......",
      ".......KKWGWKK.......",
      "........KKKKK........",
      ".........KgK.........",
      ".........KKK........."
    ];
    const SWORD_COLORS = {
      K: '#000000', D: '#6c0c00', R: '#e4240c', r: '#d82400', h: '#fc7860',
      H: '#fcd8cc', W: '#fcfcfc', G: '#fcd848', g: '#786c30', Q: '#302424'
    };

    // Chuyển bitmap thành canvas sẵn để vẽ mỗi frame nhanh
    function makeSprite(rows, colorOf, cell) {
      const w = Math.max(...rows.map(r => r.length));
      const c = document.createElement('canvas');
      c.width = w * cell; c.height = rows.length * cell;
      const g = c.getContext('2d');
      rows.forEach((row, r) => {
        for (let x = 0; x < row.length; x++) {
          const col = colorOf(row[x]);
          if (!col) continue;
          g.fillStyle = col;
          g.fillRect(x * cell, r * cell, cell, cell);
        }
      });
      return c;
    }
    const SANS_IMG = makeSprite(SANS_ROWS, (ch) => (ch === 'W' ? '#f2f2f2' : null), 4);
    const BONE_IMG = makeSprite(BONE_ROWS, (ch) => ({ W: '#f2f2f2', K: '#0b0b0b' }[ch] || null), 5);
    const SWORD_IMG = makeSprite(SWORD_ROWS, (ch) => SWORD_COLORS[ch] || null, 6);

    // ================= THREE.JS =================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
    camera.position.z = 5.2;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 1.3));

    // Cache texture: mỗi ảnh chỉ load 1 lần
    const texCache = {};
    function getTex(path) {
      if (!texCache[path]) {
        const t = new THREE.TextureLoader().load(path);
        t.minFilter = THREE.LinearFilter;
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        texCache[path] = t;
      }
      return texCache[path];
    }
    slideImages.forEach(getTex);   // tải sẵn ảnh slide

    // Geometry dùng chung cho mọi slide: mỗi ô là 1 quad riêng, có thuộc tính aCell = tâm ô
    // => mỗi ô bay/thu nhỏ độc lập, không làm méo cả tấm slide
    const SLIDE_GEO = (() => {
      const base = new THREE.PlaneGeometry(SLIDE_W, SLIDE_H, TILES[0], TILES[1]).toNonIndexed();
      const pos = base.attributes.position, uv = base.attributes.uv;
      const cell = new Float32Array(pos.count * 2);
      for (let t = 0; t < pos.count; t += 3) {
        const cu = (uv.getX(t) + uv.getX(t + 1) + uv.getX(t + 2)) / 3;
        const cv = (uv.getY(t) + uv.getY(t + 1) + uv.getY(t + 2)) / 3;
        const ci = Math.min(TILES[0] - 1, Math.floor(cu * TILES[0]));
        const cj = Math.min(TILES[1] - 1, Math.floor(cv * TILES[1]));
        const ccu = (ci + 0.5) / TILES[0], ccv = (cj + 0.5) / TILES[1];
        for (let k = 0; k < 3; k++) {
          cell[(t + k) * 2] = ccu;
          cell[(t + k) * 2 + 1] = ccv;
        }
      }
      base.setAttribute('aCell', new THREE.BufferAttribute(cell, 2));
      return base;
    })();

    // Shader tan: mỗi ô có thời điểm bắt đầu ngẫu nhiên trên toàn slide.
    // local 0 → 1: ô nhấp nháy đen/trắng kiểu mosaic, thu nhỏ, bay nhẹ theo hướng ngẫu nhiên rồi mờ dần.
    const DISSOLVE_VERT = `
      uniform float uProgress;
      attribute vec2 aCell;
      varying vec2 vUv;
      varying vec2 vPos;
      varying float vLocal;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void main() {
        vUv = uv;
        vPos = position.xy;
        vec2 idx = floor(aCell * vec2(${TILES[0]}.0, ${TILES[1]}.0));
        float t0 = hash(idx) * 0.7;
        float local = clamp((uProgress - t0) / 0.3, 0.0, 1.0);
        vLocal = local;
        vec3 p = position;
        vec2 center = vec2((aCell.x - 0.5) * ${SLIDE_W.toFixed(2)}, (aCell.y - 0.5) * ${SLIDE_H.toFixed(2)});
        float s = 1.0 - 0.7 * smoothstep(0.45, 1.0, local);
        float a = hash(idx + 7.7) * 6.2831853;
        vec2 dir = vec2(cos(a), sin(a));
        float disp = (0.15 + hash(idx + 3.1) * 0.45) * local;
        p.xy = center + (p.xy - center) * s + dir * disp;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`;

    // uCutSide != 0: chỉ giữ nửa slide nằm một phía của đường thẳng (điểm uCutP, pháp tuyến uCutN, toạ độ local)
    const DISSOLVE_FRAG = `
      uniform sampler2D map;
      uniform vec2 uCutP;
      uniform vec2 uCutN;
      uniform float uCutSide;
      varying vec2 vUv;
      varying vec2 vPos;
      varying float vLocal;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void main() {
        float edge = 0.0;
        if (uCutSide != 0.0) {
          float sd = dot(vPos - uCutP, uCutN) * uCutSide;
          if (sd < 0.0) discard;
          edge = 1.0 - smoothstep(0.0, 0.05, sd);                // mép cắt sáng trắng
        }
        if (vLocal >= 1.0) discard;
        vec4 c = texture2D(map, vUv);
        vec4 o;
        if (vLocal > 0.2 && vLocal < 0.45) {                    // nhấp nháy đen/trắng
          float bw = step(0.5, hash(floor(vUv * vec2(${TILES[0]}.0, ${TILES[1]}.0)) + 3.3));
          o = vec4(vec3(bw), 1.0);
        } else {
          float a = vLocal <= 0.45 ? 1.0 : 1.0 - (vLocal - 0.45) / 0.55;
          if (c.a < 0.01 || a < 0.01) discard;
          o = vec4(c.rgb, c.a * a);
        }
        gl_FragColor = vec4(mix(o.rgb, vec3(1.0), edge * 0.95), o.a);
      }`;

    function makeDissolveMat(tex) {
      return new THREE.ShaderMaterial({
        uniforms: { map: { value: tex }, uProgress: { value: 0 }, uCutP: { value: [0, 0] }, uCutN: { value: [1, 0] }, uCutSide: { value: 0 } },
        vertexShader: DISSOLVE_VERT,
        fragmentShader: DISSOLVE_FRAG,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      });
    }

    // Phóng slide vừa khít màn hình (phủ kín, không còn viền đen) theo tỉ lệ cửa sổ
    function coverScale() {
      const h = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const w = h * innerWidth / innerHeight;
      return Math.max(w / SLIDE_W, h / SLIDE_H) * 1.01;
    }

    function createSlide(texturePath, zIndex) {
      const group = new THREE.Group();
      group.position.z = zIndex;
      group.scale.setScalar(coverScale());
      const mesh = new THREE.Mesh(SLIDE_GEO, makeDissolveMat(getTex(texturePath)));
      group.add(mesh);
      return { group, mesh };
    }

    function setProgress(obj, v) { obj.mesh.material.uniforms.uProgress.value = v; }
    function tweenProgress(obj, to, dur, ease, onComplete) {
      return gsap.to(obj.mesh.material.uniforms.uProgress, { value: to, duration: dur, ease: ease, onComplete: onComplete });
    }

    function disposeSlide(obj) {
      obj.mesh.material.dispose();           // geometry dùng chung, không dispose
      scene.remove(obj.group);
    }

    let currentSlideObj = null;   // slide đang mở ở frame chi tiết
    let currentIndex = 0;         // số thứ tự slide đang mở

    // ================= LỚP PIXEL (canvas 2D) =================
    const fxCanvas = document.getElementById('fx');
    const fx = fxCanvas.getContext('2d');
    fx.imageSmoothingEnabled = false;
    let COLS = 0, ROWS = 0;
    function resizeFx() {
      fxCanvas.width = innerWidth;
      fxCanvas.height = innerHeight;
      fx.imageSmoothingEnabled = false;
      COLS = Math.ceil(innerWidth / PX);
      ROWS = Math.ceil(innerHeight / PX);
    }
    resizeFx();

    function drawMask(m, color) {
      fx.fillStyle = color;
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        if (m[y * COLS + x]) fx.fillRect(x * PX, y * PX, PX, PX);
      }
    }

    // Vệt chém thẳng: build sẵn hình dạng từng hàng, mở dần từ trên xuống (giật cục).
    // stopRow: hàng mà vệt chém dừng lại (khi bị xương chặn)
    let slash = null;
    let flashUntil = 0;
    const FLASH_DEFAULT = 'rgba(255, 40, 60, 0.12)';
    let flashCol = FLASH_DEFAULT;
    function flash(ms, col) { flashCol = col || FLASH_DEFAULT; flashUntil = performance.now() + ms; }
    function startSlash(hitX, stopRow = ROWS) {
      const rows = new Array(ROWS);
      let x = hitX, half = 2, left = 0;
      for (let y = 0; y < ROWS; y++) {
        if (left <= 0) {
          left = 4 + ((Math.random() * 12) | 0);
          x = hitX + ((Math.random() * 7) | 0) - 3;
          half = 1 + ((Math.random() * 3) | 0);
        }
        left--;
        rows[y] = [x - half, x + half];
      }
      slash = { start: performance.now(), rows, stop: Math.max(0, Math.min(ROWS, stopRow)) };
      return rows;
    }

    function slashMask(now) {
      const e = now - slash.start;
      if (e > 450) { slash = null; return null; }
      const step = Math.floor(e / 40) * 40;
      const grow = Math.min(slash.stop, Math.ceil(ROWS * Math.min(1, step / 280)));
      const m = new Uint8Array(COLS * ROWS);
      for (let y = 0; y < grow; y++) {
        const [a, b] = slash.rows[y];
        for (let x = Math.max(0, a); x <= Math.min(COLS - 1, b); x++) m[y * COLS + x] = 1;
      }
      return m;
    }

    // Vết máu: lấy đúng hình của vệt chém rồi phóng to 2.5 lần (BLOOD_PX = PX * 2.5)
    let splat = null;
    const bloodFade = { a: 1 };
    function startSplat(rows) {
      const bc = Math.ceil(innerWidth / BLOOD_PX), br = Math.ceil(innerHeight / BLOOD_PX);
      const body = new Uint8Array(bc * br), core = new Uint8Array(bc * br);
      const set = (m, x, y) => { if (x >= 0 && y >= 0 && x < bc && y < br) m[y * bc + x] = 1; };

      for (let j = 0; j < br; j++) {
        const s = Math.min(rows.length - 1, Math.floor((j * BLOOD_PX + BLOOD_PX / 2) / PX));
        const [a, b] = rows[s];
        const cx = Math.round(((a + b) / 2) * PX / BLOOD_PX);
        const half = (b - a) / 2;
        for (let dx = -half; dx <= half; dx++) {
          set(body, cx + dx, j);
          if (dx === 0) set(core, cx, j);
        }
        if (Math.random() < 0.05) for (let k = 1; k <= 4; k++) set(body, cx, j + k);   // giọt chảy
      }
      splat = { body, core, bc, br };
      bloodFade.a = 1;
    }

    function drawBlood(s) {
      fx.globalAlpha = bloodFade.a;
      for (let y = 0; y < s.br; y++) for (let x = 0; x < s.bc; x++) {
        const i = y * s.bc + x;
        if (!s.body[i]) continue;
        fx.fillStyle = '#8a0016';
        fx.fillRect(x * BLOOD_PX, y * BLOOD_PX, BLOOD_PX, BLOOD_PX);
        if (s.core[i]) {
          fx.fillStyle = '#ff3344';
          fx.fillRect(x * BLOOD_PX + 4, y * BLOOD_PX, BLOOD_PX - 8, BLOOD_PX);
        }
      }
      fx.globalAlpha = 1;
    }

    // ================= BỤI / MẢNH VỠ =================
    const particles = [];
    let dustUntil = 0;
    function spawnDust(n) {
      for (let i = 0; i < n && particles.length < 500; i++) {
        const r = Math.random();
        particles.push({
          x: innerWidth * (0.1 + Math.random() * 0.8),
          y: innerHeight * (0.1 + Math.random() * 0.8),
          vx: (Math.random() - 0.5) * 1.6,
          vy: (Math.random() - 0.5) * 1.6,
          life: 50 + Math.random() * 50, age: 0,
          c: r < 0.12 ? '#ff3344' : (r < 0.56 ? '#e8dcc4' : '#7a6a52'),
          s: Math.random() < 0.5 ? PX * 0.5 : PX * 0.35
        });
      }
    }

    // Vỡ thành mảnh pixel trong một hình chữ nhật (dùng cho thẻ bị giết)
    function shatterRect(r, colors) {
      const cols = colors || ['#e8dcc4', '#7a6a52', '#ff3344', '#f2f2f2'];
      for (let i = 0; i < 70 && particles.length < 500; i++) {
        particles.push({
          x: r.left + Math.random() * r.width,
          y: r.top + Math.random() * r.height,
          vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
          life: 40 + Math.random() * 40, age: 0,
          c: cols[(Math.random() * cols.length) | 0],
          s: PX * (0.5 + Math.random() * 0.5)
        });
      }
    }

    // ================= SANS & XƯƠNG (khi vệt chém bị chặn) =================
    let block = null;   // { x, y, side, start, breakAt, end, broke }
    function drawBlock(now) {
      const e = now - block.start;
      if (e > block.end) { block = null; return; }
      const broken = e >= block.breakAt;
      const bx = block.x - BONE_IMG.width / 2, by = block.y - BONE_IMG.height / 2;
      if (!broken) {
        fx.globalAlpha = 1;
        fx.drawImage(BONE_IMG, Math.round(bx + (Math.random() - 0.5) * 6), Math.round(by));
      } else if (!block.broke) {
        block.broke = true;
        shatterRect({ left: bx, top: by, width: BONE_IMG.width, height: BONE_IMG.height }, ['#f2f2f2', '#0b0b0b']);
      }
      const sx = block.side > 0 ? bx + BONE_IMG.width + 30 : bx - 30 - SANS_IMG.width;
      const sy = block.y - SANS_IMG.height + 40 + Math.sin(e / 110) * 4;
      let a = Math.min(1, e / 180);
      if (broken) a = Math.max(0, 1 - (e - block.breakAt) / 300);
      fx.globalAlpha = a;
      fx.drawImage(SANS_IMG, Math.round(sx), Math.round(sy));
      fx.globalAlpha = 1;
    }

    // ================= CHẾ ĐỘ TIM XANH: Sans chặn, rồi cảnh chém góc nhìn thứ nhất (cắt đôi bone, Sans và màn hình) =================
    function halfClip(sb, sg) {
      const L = Math.hypot(innerWidth, innerHeight) * 2;
      fx.beginPath();
      fx.moveTo(sb.x - sb.dx * L, sb.y - sb.dy * L);
      fx.lineTo(sb.x + sb.dx * L, sb.y + sb.dy * L);
      fx.lineTo(sb.x + sb.dx * L + sb.nx * sg * L, sb.y + sb.dy * L + sb.ny * sg * L);
      fx.lineTo(sb.x - sb.dx * L + sb.nx * sg * L, sb.y - sb.dy * L + sb.ny * sg * L);
      fx.closePath();
      fx.clip();
    }
    // Vệt chém lưỡi liềm: dày ở giữa, mỏng hai đầu, hơi cong; 5 lớp đỏ sẫm -> đỏ -> cam -> hồng -> hồng nhạt,
    // có vài vệt tối chạy dọc thân. tEnd: -1 -> 1 là nhát chém quét từ đầu này sang đầu kia.
    function drawCrescent(sb, tEnd, alpha, wMul) {
      const N = 60, L = sb.L;
      const q = (u, v) => [Math.round((sb.x + sb.dx * u + sb.nx * v) / PX) * PX, Math.round((sb.y + sb.dy * u + sb.ny * v) / PX) * PX];
      const arcV = (t) => -sb.bend * t * t;
      const poly = (pts, col) => {
        fx.fillStyle = col; fx.beginPath();
        pts.forEach(([x, y], i) => { if (i) fx.lineTo(x, y); else fx.moveTo(x, y); });
        fx.closePath(); fx.fill();
      };
      fx.globalAlpha = alpha;
      const layers = [
        { wf: 1.00, off: 0.00,  col: '#6e0012' },
        { wf: 0.86, off: -0.02, col: '#e81a00' },
        { wf: 0.62, off: -0.10, col: '#ff4a33' },
        { wf: 0.36, off: -0.20, col: '#ff8f7e' },
        { wf: 0.12, off: -0.28, col: '#ffe3e8' }
      ];
      for (const Ly of layers) {
        const outer = [], inner = [];
        for (let k = 0; k <= N; k++) {
          const t = -1 + (tEnd + 1) * k / N, taper = Math.pow(Math.max(0, 1 - t * t), 0.6);
          const w = sb.w * wMul * Ly.wf * taper + 2, v = arcV(t) + Ly.off * sb.w * wMul * taper;
          outer.push(q(t * L, v + w / 2)); inner.push(q(t * L, v - w / 2));
        }
        poly(outer.concat(inner.reverse()), Ly.col);
      }
      for (const st of sb.streaks) {
        const a = Math.max(-1, st.t0), b = Math.min(tEnd, st.t1);
        if (b <= a) continue;
        const o = [], i2 = [];
        for (let k = 0; k <= 16; k++) {
          const t = a + (b - a) * k / 16, taper = Math.pow(Math.max(0, 1 - t * t), 0.6);
          const v = arcV(t) + st.v * sb.w * wMul * taper, hw = Math.max(PX * 0.5, sb.w * wMul * 0.05 * taper);
          o.push(q(t * L, v + hw)); i2.push(q(t * L, v - hw));
        }
        poly(o.concat(i2.reverse()), '#7a1200');
      }
      fx.globalAlpha = 1;
    }
    // Vết nứt trên "mặt kính" màn hình: đứng yên trong khi nội dung phía sau bị tách ra
    let crack = null;
    function makeCracks(x, y, dx, dy) {
      const D = Math.hypot(innerWidth, innerHeight), base = Math.atan2(dy, dx);
      const angs = [base, base + Math.PI];
      for (let i = 0; i < 6; i++) angs.push(Math.random() * Math.PI * 2);
      const walk = (p0, a0, len, step) => {
        const pts = [p0]; let a = a0, d = 0;
        while (d < len) {
          const st = step * (0.6 + Math.random() * 0.9); a += (Math.random() - 0.5) * 0.55;
          const q = pts[pts.length - 1]; pts.push([q[0] + Math.cos(a) * st, q[1] + Math.sin(a) * st]); d += st;
        }
        return pts;
      };
      const lines = angs.map((a0, k) => {
        const pts = walk([x, y], a0, D * (k < 2 ? 0.9 : 0.35 + Math.random() * 0.4), 28);
        const br = [];
        for (let j = 2; j < pts.length; j++) if (Math.random() < 0.25) br.push(walk(pts[j], a0 + (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.6), 40 + Math.random() * 90, 16));
        return { pts, br };
      });
      crack = { t0: performance.now(), lines };
    }
    function drawCracks(now) {
      const e = now - crack.t0;
      if (e > 3400) { crack = null; return; }
      const prog = Math.min(1, e / 240), a = e > 2100 ? 1 - (e - 2100) / 1300 : 1;
      const path = (pts) => {
        const n = Math.max(2, Math.ceil(pts.length * prog));
        fx.beginPath(); fx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < n && i < pts.length; i++) fx.lineTo(pts[i][0], pts[i][1]);
        fx.stroke();
      };
      fx.lineJoin = 'miter';
      for (const [col, w, off, al] of [['#000000', 5, 2, 0.55], ['#cfe6ff', 2.5, 0, 0.95], ['#ffffff', 1, 0, 1]]) {
        fx.strokeStyle = col; fx.lineWidth = w; fx.globalAlpha = a * al;
        fx.save(); fx.translate(off, off);
        for (const L of crack.lines) { path(L.pts); L.br.forEach(path); }

    // ----- nền đất khi nhìn xuống -----

    // ----- lớp POV (cố định theo màn hình, không xoay theo cảnh) -----

    // ================= VỆT CHÉM HÌNH TRĂNG KHUYẾT (cú chém của kiếm) =================

    let cuts = [];

      }

    // ================= KIẾM ĐỎ =================
    let sword = null;   // { holder, start, endAt }
    function drawSword(now) {

      const e = now - sword.start;
      let a = Math.min(1, e / 200);
      if (sword.endAt) a = Math.max(0, 1 - (now - sword.endAt) / 250);
      const r = cards[sword.holder].getBoundingClientRect();
      const rise = Math.max(0, 1 - e / 300) * 160;
      const bob = Math.sin(now / 160) * 4;
      fx.globalAlpha = a;
      fx.drawImage(SWORD_IMG,
        Math.round(r.left + r.width / 2 - SWORD_IMG.width / 2),
        Math.round(r.top + r.height / 2 - SWORD_IMG.height * 0.45 + rise + bob));
      fx.globalAlpha = 1;
    }

    function fxLoop(now) {
      fx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      if (now < flashUntil) {
        fx.fillStyle = flashCol;
        fx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
      } else flashCol = FLASH_DEFAULT;
      if (cine) drawCineBack(now);
      if (slash) {
        const m = slashMask(now);
        if (m) drawMask(m, '#ff3344');
      }
      if (splat) drawBlood(splat);
      if (block) drawBlock(now);
      if (cine) drawCine(now);
      if (crack) drawCracks(now);
      cuts = cuts.filter(c => drawCut(c, now));
      if (sword) drawSword(now);
      if (now < dustUntil) spawnDust(6);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.age++; p.x += p.vx; p.y += p.vy;
        if (p.age > p.life) { particles.splice(i, 1); continue; }
        fx.globalAlpha = 1 - p.age / p.life;
        fx.fillStyle = p.c;
        fx.fillRect(Math.round(p.x / PX) * PX, Math.round(p.y / PX) * PX, p.s, p.s);
      }
      fx.globalAlpha = 1;
      requestAnimationFrame(fxLoop);
    }
    requestAnimationFrame(fxLoop);

    // Rung màn hình khi chém
    function shake(p = 1, reps = 5) {
      gsap.fromTo('#canvas-container', { x: 0, y: 0 }, {
        x: () => (Math.random() - 0.5) * 16 * p,
        y: () => (Math.random() - 0.5) * 10 * p,
        duration: 0.05, repeat: reps, yoyo: true, ease: 'none', repeatRefresh: true,
        onComplete: () => gsap.set('#canvas-container', { x: 0, y: 0 })
      });
    }
    // Phóng to nhẹ rồi bật về: cảm giác "lực" của nhát chém
    function punch(sc = 1.04) {
      gsap.fromTo('#canvas-container', { scale: sc }, { scale: 1, duration: 0.32, ease: 'power3.out' });
    }
    // Cú va chạm: chớp trắng + rung + phóng nhẹ. power càng lớn càng mạnh.
    function impact(power) {
      flash(60 + 45 * power, 'rgba(255, 255, 255, ' + Math.min(0.85, 0.2 + 0.25 * power).toFixed(2) + ')');
      shake(1 + power * 0.8, 5 + Math.round(power * 3));
      punch(1 + 0.025 * power);
    }

    // ================= SỐ DAMAGE (pixel font 3x5) =================
    const GLYPHS = {
      '0': ['111','101','101','101','111'], '1': ['010','110','010','010','111'],
      '2': ['111','001','111','100','111'], '3': ['111','001','111','001','111'],
      '4': ['101','101','111','001','001'], '5': ['111','100','111','001','111'],
      '6': ['111','100','111','101','111'], '7': ['111','001','010','010','010'],
      '8': ['111','101','111','101','111'], '9': ['111','101','111','001','111']
    };
    // Mỗi số là 1 canvas riêng, để nhiều số có thể hiện cùng lúc (999 ở nhiều thẻ)
    function popDamage(px, py, num) {
      const cell = Math.max(4, Math.round(innerHeight / 160));
      const s = String(num);
      const pad = 2, border = 1, gap = 1;
      const W = s.length * 3 + (s.length - 1) * gap + (pad + border) * 2;
      const H = 5 + (pad + border) * 2;
      const el = document.createElement('canvas');
      el.className = 'dmg';
      el.width = W; el.height = H;
      const g = el.getContext('2d');
      g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#ff3344'; g.fillRect(border, border, W - border * 2, H - border * 2);
      g.fillStyle = '#ffb3b9'; g.fillRect(border, border, W - border * 2, 1);
      g.fillStyle = '#000';
      let x = pad + border;
      for (const ch of s) {
        const rows = GLYPHS[ch];
        for (let y = 0; y < 5; y++) for (let i = 0; i < 3; i++) {
          if (rows[y][i] === '1') g.fillRect(x + i, pad + border + y, 1, 1);
        }
        x += 3 + gap;
      }
      el.style.width = W * cell + 'px';
      el.style.height = H * cell + 'px';
      el.style.left = (px - W * cell / 2) + 'px';
      el.style.top = (py - H * cell / 2) + 'px';
      document.body.appendChild(el);
      gsap.timeline({ onComplete: () => el.remove() })
        .fromTo(el, { scale: 0.2 }, { scale: 1.25, duration: 0.12, ease: 'back.out(3)' })
        .to(el, { scale: 1, duration: 0.08 })
        .to(el, { y: -40, opacity: 0, duration: 0.35, delay: 0.25, ease: 'power2.in' });
    }

    // ================= SLIDE BAY VÀO / PHÓNG TO =================
    // Slide bay vào từ 1 trong 4 hướng ngẫu nhiên
    const ENTRY = [
      { x: 0,  y: -4.5 },   // từ dưới lên
      { x: 0,  y:  4.5 },   // từ trên xuống
      { x: -8, y:  0   },   // từ trái sang phải
      { x:  8, y:  0   }    // từ phải sang trái
    ];

    function enterFrom(obj, onDone) {
      setProgress(obj, 0);
      const e = ENTRY[Math.floor(Math.random() * ENTRY.length)];
      obj.group.position.set(e.x, e.y, 0);
      obj.group.visible = true;
      gsap.to(obj.group.position, { x: 0, y: 0, duration: 0.95, ease: 'power3.out', onComplete: onDone });
    }

    // Thẻ được chọn phóng từ vị trí thẻ lên toàn màn hình
    function flyTo(i, done) {
      const r = cards[i].getBoundingClientRect();
      const el = document.createElement('div');
      el.className = 'fly';
      el.style.backgroundImage = 'url("' + slideImages[i] + '")';
      el.style.left = r.left + 'px';
      el.style.top = r.top + 'px';
      el.style.width = r.width + 'px';
      el.style.height = r.height + 'px';
      document.body.appendChild(el);
      gsap.to(el, {
        left: 0, top: 0, width: innerWidth, height: innerHeight, duration: 0.7, ease: 'power3.inOut',
        onComplete: () => { done(); el.remove(); }
      });
    }

    // ================= MÀN START / DANH SÁCH / CHI TIẾT =================
    // view: 'start' | 'grid' | 'busy' | 'choose' (bị chặn, chọn slide cầm kiếm) | 'detail'
    let view = 'start';
    const dead = new Set();   // các thẻ đã bị giết trong lượt chém hiện tại
    const startEl = document.getElementById('start');
    const startBtn = document.getElementById('startBtn');
    const gridEl = document.getElementById('grid');
    const cardsEl = document.getElementById('cards');
    const chooseEl = document.getElementById('choose');
    const picksEl = document.getElementById('picks');
    const tickerTrack = document.getElementById('ticker-track');
    const anim3 = document.getElementById('anim3');
    // Slide có bản động (iframe phủ lên): slide 2 (cọ sơn + bút chì vẽ), slide 3 (gió + keo dán), slide 7 (làng quê)
    const ANIM_SRC = { 1: 'slide2-anim.html?embed', 2: 'slide3-anim.html?embed', 6: 'slide7-anim.html?embed' };
    const BLANK_SLIDE = 'assets/anim-blank.png';            // nền đen cho slide 2 lúc chưa vẽ
    const slidePath = (i) => i === 1 ? BLANK_SLIDE : slideImages[i];
    let animState = null, animBusyAt = 0;                     // slide 2: 'loading' | 'wait' | 'busy' | 'done'
    // Click / Enter trên slide 2 chưa vẽ xong: bắt đầu vẽ (hoặc bỏ qua cho xong ngay), chưa chuyển slide
    function animGate() {
      const idx = view === 'soul' ? soul.i : currentIndex;
      if (idx !== 1 || animState === null || animState === 'done') return false;
      const w = anim3.contentWindow;
      if (animState === 'wait' && w) w.postMessage({ type: 'anim-start' }, '*');
      else if (animState === 'busy' && w && performance.now() - animBusyAt > 900) w.postMessage({ type: 'anim-skip' }, '*');
      return true;
    }
    // Vẽ xong: thay nền đen bằng ảnh slide 2 đầy đủ (giống hệt) để chém / tan được như các slide khác
    function animFinished() {
      let cur, set;
      if (view === 'soul' && soul.i === 1) { cur = soul.cur; set = (n) => { soul.cur = n; }; }
      else if (view === 'detail' && currentIndex === 1) { cur = currentSlideObj; set = (n) => { currentSlideObj = n; }; }
      else return;
      const n = createSlide(slideImages[1], 0);
      n.mesh.renderOrder = cur.mesh.renderOrder;
      scene.add(n.group);
      set(n);
      setTimeout(() => {
        disposeSlide(cur);
        if (animState === 'done') anim3.style.display = 'none';
      }, 350);
    }

    const TICKER_LINE = [
      "IT'S A BEAUTIFUL DAY OUTSIDE.", "SLASH A SLIDE, SEE WHAT'S INSIDE.", "ONE BONE. ONE SOUL.", "TEN SLIDES."
    ].map(t => t + "   *   ").join('');
    tickerTrack.textContent = TICKER_LINE + TICKER_LINE;

    // 10 thẻ slide
    const cards = slideImages.map((src, i) => {
      const c = document.createElement('button');
      c.type = 'button';
      c.className = 'card';
      c.innerHTML = '<img src="' + src + '" alt="">' +
        '<div class="card-meta"><span class="card-num">' + pad2(i + 1) + '</span><span class="card-title"></span></div>';
      c.querySelector('.card-title').textContent = SLIDE_INFO[i].title;
      c.addEventListener('click', () => chemFromCard(i));
      cardsEl.appendChild(c);
      return c;
    });

    // 10 nút chọn slide cầm kiếm
    const picks = slideImages.map((_, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick';
      b.textContent = pad2(i + 1);
      b.addEventListener('click', (e) => { e.stopPropagation(); pickSword(i); });
      picksEl.appendChild(b);
      return b;
    });

    // ----- Hạt trang trí nền: tim đỏ và xương bay lên -----
    const HEART_SPR = [
      ".XX.XX.",
      "XXXXXXX",
      "XXXXXXX",
      ".XXXXX.",
      "..XXX..",
      "...X..."
    ];
    const decoCanvas = document.getElementById('deco');
    const dctx = decoCanvas.getContext('2d');
    function makeDeco(initial) {
      const bone = Math.random() < 0.4;
      return {
        bone,
        x: Math.random() * innerWidth,
        y: initial ? Math.random() * innerHeight : innerHeight + 40,
        vy: -(0.25 + Math.random() * 0.6),
        sway: Math.random() * 6.28,
        s: bone ? 0.3 + Math.random() * 0.2 : 4,
        a: 0.2 + Math.random() * 0.4
      };
    }
    const decos = [];
    for (let i = 0; i < 28; i++) decos.push(makeDeco(true));
    function decoLoop(t) {
      if (gridEl.style.display === 'flex') {
        dctx.clearRect(0, 0, decoCanvas.width, decoCanvas.height);
        for (const d of decos) {
          d.y += d.vy;
          d.x += Math.sin(t / 900 + d.sway) * 0.35;
          if (d.y < -40) Object.assign(d, makeDeco(false));
          dctx.globalAlpha = d.a;
          if (d.bone) {
            dctx.drawImage(BONE_IMG, Math.round(d.x), Math.round(d.y), BONE_IMG.width * d.s, BONE_IMG.height * d.s);
          } else {
            drawHeart(d.x, d.y, d.s);
          }
        }
        dctx.globalAlpha = 1;
      }
      requestAnimationFrame(decoLoop);
    }
    function drawHeart(x, y, cell) {
      for (let r = 0; r < HEART_SPR.length; r++) for (let c = 0; c < HEART_SPR[r].length; c++) {
        if (HEART_SPR[r][c] !== 'X') continue;
        dctx.fillStyle = '#ff3344';
        dctx.fillRect(Math.round(x + c * cell), Math.round(y + r * cell), cell, cell);
      }
    }
    requestAnimationFrame(decoLoop);

    // Hiện danh sách: thẻ bay lên lần lượt, mọi thẻ đều hiện lại
    function showGrid() {
      gsap.killTweensOf(gridEl);
      gsap.killTweensOf(cards);
      dead.clear();
      cards.forEach(c => { c.style.visibility = ''; });
      gridEl.style.display = 'flex';
      decoCanvas.width = innerWidth;
      decoCanvas.height = innerHeight;
      gsap.fromTo(gridEl, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out', onComplete: () => { view = 'grid'; } });
      gsap.fromTo(cards, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.05, ease: 'power2.out', clearProps: 'transform,opacity' });
    }

    function hideGrid(onDone) {
      gsap.killTweensOf(gridEl);
      gsap.to(gridEl, { opacity: 0, duration: 0.3, ease: 'power2.in', onComplete: () => { gridEl.style.display = 'none'; if (onDone) onDone(); } });
    }

    // START: nhấp nháy, tối hẳn, rồi hiện danh sách
    function enterGrid() {
      if (view !== 'start') return;
      view = 'busy';
      gsap.timeline()
        .to(startEl, { opacity: 0.15, duration: 0.06, repeat: 7, yoyo: true, ease: 'steps(1)' })
        .to(startEl, { opacity: 0, duration: 0.3, ease: 'power1.in' })
        .call(() => {
          startEl.style.display = 'none';
          startEl.style.opacity = 1;
          showGrid();
        });
    }

    // Danh sách (hoặc bảng chọn) → START
    function backToStart() {
      if (view !== 'grid' && view !== 'choose') return;
      view = 'busy';
      chooseEl.classList.remove('show');
      hideGrid(() => {
        startEl.style.display = 'flex';
        gsap.fromTo(startEl, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out', onComplete: () => { view = 'start'; } });
      });
    }

    // Mở slide đã phóng toàn màn hình: xem thông tin, Backspace để về danh sách
    function openSlide(i) {
      currentIndex = i;
      if (ANIM_SRC[i]) {                   // slide 2, 3: mở bản động
        animState = i === 1 ? 'loading' : null;
        anim3.src = ANIM_SRC[i];
        anim3.style.opacity = '1';
        anim3.style.display = 'block';
        window.focus();
      }
      currentSlideObj = createSlide(slidePath(i), 0);
      scene.add(currentSlideObj.group);
      view = 'detail';
    }

    // Giết 1 thẻ: vỡ thành mảnh, (tuỳ chọn) hiện 999
    function killCard(j, withDmg) {
      if (dead.has(j)) return;
      dead.add(j);
      const r = cards[j].getBoundingClientRect();
      shatterRect(r);
      if (withDmg) popDamage(r.left + r.width / 2, r.top + r.height / 2, 999);
      gsap.to(cards[j], {
        opacity: 0, scale: 0.85, duration: 0.25, ease: 'power2.in',
        onComplete: () => { cards[j].style.visibility = 'hidden'; }
      });
    }

    // Chém từ thẻ được click: vệt chém dọc giữa màn hình
    function chemFromCard(i) {
      if (view !== 'grid') return;
      view = 'busy';
      const hitX = Math.round((innerWidth * 0.5 + (Math.random() - 0.5) * innerWidth * 0.1) / PX);
      const cx = hitX * PX, cy = innerHeight * 0.5;
      const blocked = Math.random() < BLOCK_CHANCE;
      const rows = startSlash(hitX, blocked ? Math.floor(cy / PX) : ROWS);

      if (blocked) {
        block = { x: cx, y: cy, side: cx < innerWidth / 2 ? 1 : -1, start: performance.now(), breakAt: 1000, end: 1400, broke: false };
        setTimeout(showChoose, 1500);
        return;
      }

      // Không bị chặn: máu + 1 số damage ngẫu nhiên ở giữa, các thẻ khác tan, thẻ này phóng to
      setTimeout(() => { shake(); flashUntil = performance.now() + 90; }, 260);
      setTimeout(() => {
        startSplat(rows);
        popDamage(cx, cy, 1 + Math.floor(Math.random() * 100));
      }, 320);
      setTimeout(() => {
        dustUntil = performance.now() + DISSOLVE_MS;
        gsap.to(bloodFade, { a: 0, duration: DISSOLVE_MS / 1000, ease: 'none', onComplete: () => { splat = null; } });
        cards.forEach((_, k) => { if (k !== i) killCard(k, false); });
        flyTo(i, () => openSlide(i));
        hideGrid(() => {});
      }, 320 + BLOOD_TO_DISSOLVE_MS);
    }

    // Bị chặn: hiện bảng chọn slide cầm kiếm
    function showChoose() {
      block = null;
      picks.forEach((b) => { b.disabled = false; });
      chooseEl.classList.add('show');
      view = 'choose';
    }

    // Slide được chọn cầm kiếm, rồi chém vòng quanh màn hình cho tới khi không còn slide nào sống
    function pickSword(t) {
      if (view !== 'choose') return;
      view = 'busy';
      chooseEl.classList.remove('show');
      sword = { holder: t, start: performance.now(), endAt: null };
      setTimeout(swordRound, 500);
    }

    // Một vòng chém: mỗi slide còn sống có khả năng bị nhắm tới (ít nhất 1 slide)
    function swordRound() {
      if (!sword || sword.endAt) return;
      const alive = cards.map((_, k) => k).filter(k => k !== sword.holder && !dead.has(k));
      if (alive.length === 0) { finishSword(); return; }
      let targets = alive.filter(() => Math.random() < 0.7);
      if (targets.length === 0) targets = [alive[Math.floor(Math.random() * alive.length)]];
      let t = 0;
      targets.forEach((k) => { setTimeout(() => slashCard(k), t); t += 280; });
      setTimeout(swordRound, t + 150);
    }

    // Một cú chém đi qua tâm thẻ k; thẻ nào bị vệt chém trúng cũng bị giết (999)
    function slashCard(k) {
      if (!sword || sword.endAt || dead.has(k)) return;
      const r = cards[k].getBoundingClientRect();
      const cut = {
        cx: r.left + r.width / 2, cy: r.top + r.height / 2,
        dx: 0, dy: 0,
        L: Math.hypot(innerWidth, innerHeight) * 0.55,
        bend: (Math.random() < 0.5 ? -1 : 1) * (60 + Math.random() * 120),
        width: 46 + Math.random() * 26,
        color: '#ff1f3d',
        start: performance.now(), dur: 200
      };
      const ang = Math.random() * Math.PI;
      cut.dx = Math.cos(ang); cut.dy = Math.sin(ang);
      cuts.push(cut);
      setTimeout(() => {
        for (let j = 0; j < cards.length; j++) {
          if (!sword || j === sword.holder || dead.has(j)) continue;
          if (arcHits(cut, cards[j].getBoundingClientRect())) killCard(j, true);
        }
      }, 200);
    }

    // Hết slide sống: kiếm biến mất, slide cầm kiếm phóng to toàn màn hình
    function finishSword() {
      const holder = sword.holder;
      sword.endAt = performance.now();
      flyTo(holder, () => openSlide(holder));
      hideGrid(() => {});
    }

    // Bảng chọn: đóng thì quay về START, không cho chém dở
    // Backspace trong slide: slide tan đi (mosaic), rồi quay về danh sách
    function closeDetail() {
      if (view !== 'detail') return;
      view = 'busy';
      const cur = currentSlideObj;
      if (ANIM_SRC[currentIndex]) {        // slide 2, 3: ẩn bản động dần trong lúc slide tan
        animState = null;
        gsap.to(anim3, { opacity: 0, duration: DISSOLVE_MS / 1000, ease: 'none',
          onComplete: () => { anim3.style.display = 'none'; anim3.src = 'about:blank'; } });
      }
      tweenProgress(cur, 1.0, DISSOLVE_MS / 1000, 'none', () => {
        disposeSlide(cur);
        currentSlideObj = null;
        showGrid();
      });
    }

    // ----- Nút bánh răng (mở bảng cài đặt trống) và trái tim xanh Undertale (chỉ để bấm, không dẫn tới đâu) -----
    const gearBtn = document.getElementById('gearBtn');
    const heartBtn = document.getElementById('heartBtn');
    const settingsEl = document.getElementById('settings');
    const GEAR_ROWS = (() => {
      const N = 15, c = 7, q = Math.PI / 4, out = [];
      for (let y = 0; y < N; y++) {
        let row = '';
        for (let x = 0; x < N; x++) {
          const r = Math.hypot(x - c, y - c), a = ((Math.atan2(y - c, x - c) % q) + q) % q;
          const tooth = r <= 7.2 && Math.min(a, q - a) < 0.26;
          row += ((r <= 5.2 || tooth) && r > 2.3) ? 'W' : '.';
        }
        out.push(row);
      }
      return out;
    })();
    const SOUL_ROWS = [
      ".HXX.XXX.",
      "XHXXXXXXX",
      "XXXXXXXXX",
      "XXXXXXXXX",
      ".XXXXXXX.",
      "..XXXXX..",
      "...XXX...",
      "....X...."
    ];
    const gearCv = makeSprite(GEAR_ROWS, (ch) => (ch === 'W' ? '#f2f2f2' : null), 1);
    const heartCv = makeSprite(SOUL_ROWS, (ch) => ({ X: '#003cff', H: '#7b97ff' }[ch] || null), 1);
    gearBtn.appendChild(gearCv);
    heartBtn.appendChild(heartCv);

    function openSettings() {
      if (view !== 'grid') return;
      view = 'settings';
      settingsEl.classList.add('show');
      settingsEl.setAttribute('aria-hidden', 'false');
      gsap.fromTo(gearCv, { rotation: 0 }, { rotation: 90, duration: 0.35, ease: 'steps(4)' });
    }
    function closeSettings() {
      if (view !== 'settings') return;
      settingsEl.classList.remove('show');
      settingsEl.setAttribute('aria-hidden', 'true');
      view = 'grid';
    }
    gearBtn.addEventListener('click', (e) => { e.stopPropagation(); openSettings(); });
    document.getElementById('settingsClose').addEventListener('click', closeSettings);
    settingsEl.addEventListener('click', (e) => { if (e.target === settingsEl) closeSettings(); });
    // Trái tim xanh: đập một nhịp rồi vào chế độ tim xanh
    heartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (view !== 'grid') return;
      gsap.fromTo(heartCv, { scale: 1 }, { scale: 1.35, duration: 0.09, yoyo: true, repeat: 1, ease: 'steps(2)' });
      enterSoul();
    });

    // ================= CHẾ ĐỘ TIM XANH (soul mode) =================
    // Bấm tim xanh: màn đen -> tim đỏ -> đổi xanh -> glitch -> slide 1.
    // Click = slide kế (chém + tan), Backspace = slide trước, tim đỏ ở góc phải = về danh sách.
    // Mỗi lượt có đúng 1 lần Sans chặn, chắc chắn xảy ra, ở một slide ngẫu nhiên từ slide 1 đến 7
    // (lúc bấm tiếp từ slide đó); lần đó có thêm cú chém lưỡi liềm chéo cắt đôi cả màn hình.
    const SOUL_BLOCK_AT = 3;   // Sans chỉ xuất hiện giữa 'How People Moved Around' (slide 4) và 'Daily Living Conditions' (slide 5), 1 lần mỗi lượt
    const soul = { on: false, i: 0, cur: null, blockUsed: false, blockAt: 0 };
    const soulIntro = document.getElementById('soulIntro');
    const soulHeartCv = document.getElementById('soulHeart');
    const soulBack = document.getElementById('soulBack');
    const glitchCv = document.getElementById('glitch');
    const glitchCx = glitchCv.getContext('2d');
    const containerEl = document.getElementById('canvas-container');
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const tw = (t, v) => new Promise((res) => gsap.to(t, Object.assign({}, v, { onComplete: res })));
    const HEART_RED = makeSprite(SOUL_ROWS, (ch) => ({ X: '#ff0000', H: '#ff9a9a' }[ch] || null), 1);
    const HEART_BLUE = makeSprite(SOUL_ROWS, (ch) => ({ X: '#003cff', H: '#7b97ff' }[ch] || null), 1);
    soulHeartCv.width = 9; soulHeartCv.height = 8;
    soulBack.appendChild(makeSprite(SOUL_ROWS, (ch) => ({ X: '#ff0000', H: '#ff9a9a' }[ch] || null), 1));
    function paintHeart(spr) {
      const g = soulHeartCv.getContext('2d');
      g.clearRect(0, 0, 9, 8);
      g.drawImage(spr, 0, 0);
    }

    // ----- Glitch: dải ảnh trượt ngang + vạch màu + nhiễu hạt, vẽ chồng lên màn hình -----
    const glitch = { on: false, t0: 0, dur: 1, hold: 0.4, p: 1 };
    function glitchK(now) {
      const t = (now - glitch.t0) / glitch.dur;
      if (t < 0) return 0;
      return t < glitch.hold ? 1 : Math.max(0, 1 - (t - glitch.hold) / (1 - glitch.hold));
    }
    const GL_COLORS = ['#00e5ff', '#ff00aa', '#ffffff', '#000000', '#ff3344', '#3d66ff'];
    function drawGlitch(now) {
      const W = innerWidth, H = innerHeight, g = glitchCx, k = glitchK(now) * glitch.p, strong = glitch.p >= 0.8;
      g.clearRect(0, 0, W, H);
      if (k <= 0.02) { if (strong) { containerEl.style.transform = ''; containerEl.style.filter = ''; } return; }
      const src = renderer.domElement, sc = src.width / W;
      for (let i = 0, n = 3 + Math.floor(k * 9); i < n; i++) {                 // dải ảnh bị trượt ngang
        const h = 6 + Math.random() * 80 * k, y = Math.random() * (H - h), dx = (Math.random() - 0.5) * 220 * k;
        g.drawImage(src, 0, y * sc, src.width, h * sc, dx, y, W, h);
      }
      for (let i = 0, m = 2 + Math.floor(k * 7); i < m; i++) {                 // vạch màu
        g.globalAlpha = 0.35 + Math.random() * 0.55;
        g.fillStyle = GL_COLORS[(Math.random() * GL_COLORS.length) | 0];
        g.fillRect(Math.random() * W * 0.5, Math.random() * H, W * (0.2 + Math.random() * 0.8), 2 + Math.random() * 26 * k);
      }
      for (let i = 0, m = 40 * k; i < m; i++) {                                 // nhiễu hạt
        g.globalAlpha = 0.9;
        g.fillStyle = Math.random() < 0.5 ? '#fff' : '#000';
        g.fillRect(Math.round(Math.random() * W / PX) * PX, Math.round(Math.random() * H / PX) * PX, PX, PX);
      }
      g.globalAlpha = 1;
      if (!strong) return;           // glitch nhẹ không đụng vào rung / phóng to của container
      containerEl.style.transform = k > 0.3 ? 'translate(' + ((Math.random() - 0.5) * 30 * k).toFixed(1) + 'px,' + ((Math.random() - 0.5) * 10 * k).toFixed(1) + 'px)' : '';
      containerEl.style.filter = (k > 0.5 && Math.random() < 0.35) ? 'hue-rotate(' + ((Math.random() * 360) | 0) + 'deg) saturate(2.2)' : '';
    }
    function startGlitch(ms, hold, power = 1) {
      glitchCv.width = innerWidth; glitchCv.height = innerHeight;
      glitchCv.style.display = 'block';
      Object.assign(glitch, { on: true, t0: performance.now(), dur: ms, hold, p: power });
    }
    function stopGlitch() {
      glitch.on = false;
      glitchCx.clearRect(0, 0, glitchCv.width, glitchCv.height);
      glitchCv.style.display = 'none';
      if (glitch.p >= 0.8) { containerEl.style.transform = ''; containerEl.style.filter = ''; }
    }

    // ----- Slide 3 có bản động (iframe) -----
    function showAnim3(i = 2) {
      animState = i === 1 ? 'loading' : null;
      anim3.src = ANIM_SRC[i];
      anim3.style.display = 'block';
      anim3.style.opacity = '0';
      gsap.to(anim3, { opacity: 1, duration: 0.35, ease: 'none' });
      window.focus();
    }
    function hideAnim3Now() {
      animState = null;
      gsap.killTweensOf(anim3);
      anim3.style.display = 'none';
      anim3.src = 'about:blank';
    }

    // ----- Màn mở đầu -----
    async function enterSoul() {
      if (view !== 'grid') return;
      view = 'busy';
      Object.assign(soul, { on: true, i: 0, cur: null, blockUsed: false, blockAt: SOUL_BLOCK_AT });
      gsap.killTweensOf(gridEl);
      // 1. màn hình tối đen
      soulIntro.style.display = 'flex';
      soulIntro.style.background = '#000';
      soulIntro.style.opacity = '0';
      soulHeartCv.style.visibility = 'hidden';
      paintHeart(HEART_RED);
      await tw(soulIntro, { opacity: 1, duration: 0.5, ease: 'steps(6)' });
      gridEl.style.display = 'none';
      await wait(500);
      // 2. tim đỏ hiện giữa màn hình, đập 2 nhịp
      soulHeartCv.style.visibility = 'visible';
      gsap.fromTo(soulHeartCv, { scale: 0.25, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'steps(4)' });
      await wait(750);
      for (let b = 0; b < 2; b++) {
        await tw(soulHeartCv, { scale: 1.3, duration: 0.09, yoyo: true, repeat: 1, ease: 'steps(2)' });
        await wait(b === 0 ? 420 : 700);
      }
      // 3. đổi đỏ -> xanh: chớp trắng, tim rung, vòng sóng lan ra
      soulIntro.style.background = '#fff';
      paintHeart(HEART_BLUE);
      await wait(70);
      soulIntro.style.background = '#000';
      const ring = document.createElement('div');
      ring.className = 'soul-ring';
      soulIntro.appendChild(ring);
      gsap.fromTo(ring, { scale: 1, opacity: 1 }, { scale: 6, opacity: 0, duration: 0.6, ease: 'power2.out', onComplete: () => ring.remove() });
      gsap.fromTo(soulHeartCv, { x: -16 }, { x: 16, duration: 0.04, repeat: 7, yoyo: true, ease: 'none', onComplete: () => gsap.set(soulHeartCv, { x: 0 }) });
      await wait(750);
      // 4. glitch: tim xanh vỡ kênh màu, rồi slide 1 lộ ra
      startGlitch(1600, 0.45);
      const jit = setInterval(() => {
        const o = (Math.random() * 18 - 9) | 0;
        soulHeartCv.style.marginLeft = o + 'px';
        soulHeartCv.style.filter = Math.random() < 0.7 ? 'drop-shadow(' + (-o - 6) + 'px 0 #00e5ff) drop-shadow(' + (o + 6) + 'px 0 #ff00aa)' : 'none';
      }, 45);
      await wait(420);
      clearInterval(jit);
      soul.cur = createSlide(slideImages[0], 0);
      soul.cur.mesh.renderOrder = 1;
      scene.add(soul.cur.group);
      soulHeartCv.style.visibility = 'hidden'; soulHeartCv.style.marginLeft = ''; soulHeartCv.style.filter = '';
      for (const [o, ms] of [[0, 70], [1, 45], [0, 60], [1, 35], [0, 0]]) {      // màn đen nhấp nháy rồi tắt hẳn
        soulIntro.style.opacity = String(o);
        if (ms) await wait(ms);
      }
      soulIntro.style.display = 'none';
      soulIntro.style.opacity = '1';
      await wait(850);                                                           // glitch giảm dần trên slide 1
      stopGlitch();
      soulBack.style.display = 'flex';
      view = 'soul';
    }

    // ----- Chuyển slide trong chế độ tim xanh -----
    // Chuyển tới slide kế (dir = +1: click, chém) hoặc slide trước (dir = -1: Backspace, tan)
    async function soulStep(dir, clickX) {
      if (!soul.on || view !== 'soul') return;
      const ni = soul.i + dir;
      if (ni < 0 || ni >= slideImages.length) return;       // slide đầu / cuối: không có tác dụng, chỉ tim đỏ ở góc mới thoát được
      view = 'busy';
      if (ANIM_SRC[soul.i]) hideAnim3Now();
      const cur = soul.cur;
      const next = createSlide(slidePath(ni), 0);        // nằm sau slide hiện tại, lộ ra khi nó tan
      next.mesh.renderOrder = 0;
      cur.mesh.renderOrder = 1;
      scene.add(next.group);
      if (dir > 0) await soulSlash(cur, clickX);
      else await soulDissolve(cur);
      next.mesh.renderOrder = 1;
      soul.cur = next; soul.i = ni;
      if (ANIM_SRC[ni]) showAnim3(ni);
      view = 'soul';
    }

    async function soulDissolve(cur) {
      dustUntil = performance.now() + DISSOLVE_MS;
      await tw(cur.mesh.material.uniforms.uProgress, { value: 1, duration: DISSOLVE_MS / 1000, ease: 'none' });
      disposeSlide(cur);
    }

    // Click: vệt chém dọc tại chỗ click. Có thể bị Sans chặn (tối đa 1 lần mỗi lượt tim xanh).
    async function soulSlash(cur, clickX) {
      const blocked = !soul.blockUsed && soul.i === soul.blockAt;
      const px = blocked ? Math.max(innerWidth * 0.3, Math.min(innerWidth * 0.7, clickX)) : clickX;   // Sans phải nằm trong màn hình
      const hitX = Math.max(2, Math.min(COLS - 3, Math.round(px / PX)));
      const cx = hitX * PX, cy = innerHeight * 0.5;
      const rows = startSlash(hitX, blocked ? Math.floor(cy / PX) : ROWS);
      if (blocked) {
        soul.blockUsed = true;
        await soulBlockCut(cur, cx, cy);
        return;
      }
      await wait(260);
      impact(0.7);
      await wait(60);
      startSplat(rows);
      popDamage(cx, cy, 1 + Math.floor(Math.random() * 100));
      await wait(480);
      gsap.to(bloodFade, { a: 0, duration: DISSOLVE_MS / 1000, ease: 'none', onComplete: () => { splat = null; } });
      await soulDissolve(cur);
    }

    // Cắt đôi slide theo đường thẳng qua (px, py) hướng (dx, dy) (toạ độ màn hình) -> 2 nửa tách ra
    function screenToLocal(px, py, group) {
      const h = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const k = h / innerHeight, sc = group.scale.x;
      return [(px - innerWidth / 2) * k / sc, -(py - innerHeight / 2) * k / sc];
    }
    // ----- lớp cảnh (trên canvas #fx, xoay cùng máy quay) -----
    function drawCineBack(now) {                                    // tối màn hình, chừa sáng quanh Sans
      const c = cine, t = now - c.t0, W = innerWidth, H = innerHeight;
      let d = 0.66 * ramp(t, CT.block - 20, CT.block + 500);
      if (t > CT.hit) d *= 1 - 0.55 * ramp(t - CT.hit, 0, 600);
      if (d < 0.01) return;
      const g = fx.createRadialGradient(c.sans.x, c.sans.y, H * 0.08, c.sans.x, c.sans.y, c.D * 0.7);
      g.addColorStop(0, 'rgba(6,3,16,' + (d * 0.3) + ')'); g.addColorStop(1, 'rgba(6,3,16,' + d + ')');
      fx.fillStyle = g; fx.fillRect(0, 0, W, H);
    }
    function lineAt(c, ox, oy, sc) {                                // điểm trên vệt cong tại tham số tt (-1..1)
      return (tt) => { const u = tt * c.L * sc, v = -c.bend * sc * tt * tt; return [ox + c.dx * u + c.nx * v, oy + c.dy * u + c.ny * v]; };
    }
    function drawGhostLine(c, ox, oy, sc, alpha) {                  // vệt đỏ mờ lơ lửng sau cú chém
      const P = lineAt(c, ox, oy, sc), N = 40;
      fx.lineCap = 'round';
      for (const [wm, col] of [[1.9, 'rgba(255,30,50,0.09)'], [1.2, 'rgba(255,40,60,0.14)'], [0.6, 'rgba(255,70,80,0.22)'], [0.2, 'rgba(255,215,220,0.45)']]) {
        for (let i = 0; i < N; i++) {
          const t0 = -1 + 2 * i / N, t1 = -1 + 2 * (i + 1) / N, m = (t0 + t1) / 2, tp = Math.pow(Math.max(0, 1 - m * m), 0.6);
          const a = P(t0), b = P(t1);
          fx.strokeStyle = col; fx.globalAlpha = alpha; fx.lineWidth = Math.max(2, c.w * sc * wm * tp * 0.55);
          fx.beginPath(); fx.moveTo(a[0], a[1]); fx.lineTo(b[0], b[1]); fx.stroke();
        }
      }
      fx.globalAlpha = 1;
    }
    // nhát chém bay: lúc u = 0 ở gần máy quay (to, thấp), u = UH đi ngang qua Sans (nằm đúng trên đường cắt), rồi thu nhỏ dần vào điểm tụ
    function waveAt(c, u) {
      const near = -0.22 * c.D, fx_ = c.nx * c.fwd, fy_ = c.ny * c.fwd;
      if (u <= UH) {
        const e = Math.pow(u / UH, 1.3), trav = near * (1 - e);
        return { x: c.x + fx_ * trav, y: c.y + fy_ * trav, sc: 1.25 - 0.25 * e };
      }
      const v = (u - UH) / (1 - UH), e = 1 - Math.pow(1 - v, 1.8);
      return { x: c.x + (c.vp.x - c.x) * e, y: c.y + (c.vp.y - c.y) * e, sc: 0.95 * Math.pow(1 - v, 1.2) + 0.05 };
    }
    function drawWave(c, t) {
      const u = ramp(t, CT.wave, CT.wave + CT.waveLen);
      const fade = u > 0.82 ? Math.max(0, (1 - u) / 0.18) : 1, born = ramp(t, CT.wave - 150, CT.wave);
      for (let i = 6; i >= 0; i--) {
        const uu = u - i * 0.032;
        if (i && uu <= 0) continue;
        const w = waveAt(c, Math.max(0, uu)), al = (i ? 0.34 * (1 - i / 7) : 1) * fade * (i ? 1 : born);
        if (al <= 0.01) continue;
        drawCrescent({ x: w.x, y: w.y, dx: c.dx, dy: c.dy, nx: c.nx, ny: c.ny, L: c.L * w.sc, w: c.w * w.sc, bend: c.bend * w.sc, streaks: c.streaks }, 1, al, 1);
      }
      if (u > 0 && u < 0.9) {                                       // vệt tốc độ toả ra từ điểm tụ: cảm giác chiều sâu
        fx.lineCap = 'butt';
        for (let i = 0; i < 26; i++) {
          const ang = hash1(c, i + 500) * 6.2832, r0 = (0.12 + 0.5 * ((hash1(c, i + 600) + u * 1.8) % 1)) * c.D, ln = 30 + r0 * 0.25;
          fx.strokeStyle = 'rgba(255,' + (90 + (hash1(c, i) * 120 | 0)) + ',110,' + (0.35 * (1 - u)) + ')'; fx.lineWidth = 2;
          fx.beginPath(); fx.moveTo(c.vp.x + Math.cos(ang) * r0, c.vp.y + Math.sin(ang) * r0); fx.lineTo(c.vp.x + Math.cos(ang) * (r0 + ln), c.vp.y + Math.sin(ang) * (r0 + ln)); fx.stroke();
        }
      }
    }
    function drawRift(c, ce) {                                       // khe hư vô: hình nêm mở ra như cánh cửa, sao bay tới như đang lao vào
      const a = 1 - ramp(ce, 1100, 1500);
      if (a <= 0) return;
      const W = innerWidth, H = innerHeight, D = c.D, phi = 0.11 * easeOut3(ramp(ce, 60, 1100)), P = c.pivot, Ln = D * 1.15;
      const E = (sg) => { const ang = -sg * phi, ca = Math.cos(ang), sa = Math.sin(ang), vx = -c.dx * Ln, vy = -c.dy * Ln; return [P.x + vx * ca - vy * sa, P.y + vx * sa + vy * ca]; };
      const e1 = E(1), e2 = E(-1);
      fx.save(); fx.globalAlpha = a;
      fx.beginPath(); fx.moveTo(P.x, P.y); fx.lineTo(e1[0], e1[1]); fx.lineTo(e2[0], e2[1]); fx.closePath(); fx.clip();
      fx.fillStyle = '#04000a'; fx.fillRect(0, 0, W, H);
      const rg = fx.createRadialGradient(c.vp.x, c.vp.y, 4, c.vp.x, c.vp.y, D * 0.55);
      rg.addColorStop(0, 'rgba(255,90,110,0.55)'); rg.addColorStop(0.25, 'rgba(120,20,70,0.35)'); rg.addColorStop(1, 'rgba(4,0,10,0)');
      fx.fillStyle = rg; fx.fillRect(0, 0, W, H);
      fx.lineCap = 'butt';
      for (let i = 0; i < 120; i++) {
        const ang = hash1(c, i) * 6.2832, sp = 0.4 + hash1(c, i + 300), f = (hash1(c, i + 90) + ce * 0.0009 * sp) % 1;
        const r = Math.pow(f, 2.4) * D * 0.95, ln = r * 0.14 + 2, x = c.vp.x + Math.cos(ang) * r, y = c.vp.y + Math.sin(ang) * r;
        fx.strokeStyle = hash1(c, i + 7) < 0.3 ? 'rgba(255,120,140,0.9)' : 'rgba(255,255,255,0.9)'; fx.lineWidth = 1 + r / 160;
        fx.beginPath(); fx.moveTo(x - Math.cos(ang) * ln, y - Math.sin(ang) * ln); fx.lineTo(x, y); fx.stroke();
      }
      fx.restore();
      fx.globalAlpha = a;
      for (const e of [e1, e2]) {
        fx.strokeStyle = '#ff3344'; fx.lineWidth = 6; fx.beginPath(); fx.moveTo(P.x, P.y); fx.lineTo(e[0], e[1]); fx.stroke();
        fx.strokeStyle = '#ffe3e8'; fx.lineWidth = 2; fx.stroke();
      }
      fx.globalAlpha = 1;
    }
    function drawHalfCine(c, act, sg, ce) {                          // nửa bone / nửa Sans: tách ra, lăn và rơi xuống, mờ dần
      const al = 1 - ramp(ce, 950, 1450);
      if (al <= 0) return;
      const phi = 0.11 * easeOut3(ramp(ce, 60, 1100)), fall = 0.5 * 1500 * Math.pow(Math.max(0, ce - 250) / 1000, 2);
      const roll = sg * easeOut3(ramp(ce, 150, 1300)) * 1.1, sep = easeOut3(ramp(ce, 60, 800)) * c.D * 0.05;
      fx.save(); fx.globalAlpha = al;
      fx.translate(c.pivot.x, c.pivot.y); fx.rotate(-sg * phi); fx.translate(-c.pivot.x, -c.pivot.y);
      fx.translate(c.nx * sg * sep, c.ny * sg * sep + fall);
      const mx = act.x + act.w / 2, my = act.y + act.h / 2;
      fx.translate(mx, my); fx.rotate(roll); fx.translate(-mx, -my);
      halfClip(c, sg);
      fx.drawImage(act.img, Math.round(act.x), Math.round(act.y), act.w, act.h);
      fx.restore();
    }
    function updateHalves(c, ce) {                                   // hai nửa slide xoay quanh điểm tụ như cánh cửa, rồi tan
      const phi = 0.11 * easeOut3(ramp(ce, 60, 1100)), pw = { x: (c.pivot.x - innerWidth / 2) * c.k, y: -(c.pivot.y - innerHeight / 2) * c.k };
      for (const h of c.halves) {
        const a = h.sg * phi, ca = Math.cos(a), sa = Math.sin(a);
        h.obj.group.rotation.z = a;
        h.obj.group.position.x = pw.x - (ca * pw.x - sa * pw.y);
        h.obj.group.position.y = pw.y - (sa * pw.x + ca * pw.y);
        h.obj.mesh.material.uniforms.uProgress.value = ramp(ce, 600, 1700);
      }
    }
    function cineCut(c) {                                            // khoảnh khắc nhát chém đi qua Sans
      flash(110, 'rgba(255,255,255,0.6)');
      startGlitch(900, 0.25, 0.24);                                  // nhiễu nhẹ
      sparkLine(c, 190);
      makeCracks(c.x, c.y, c.dx, c.dy);
      try { navigator.vibrate && navigator.vibrate([70, 40, 140]); } catch (e) { }
      c.halves = [1, -1].map((sg) => {
        const half = createSlide(slideImages[soul.i], 0);
        half.mesh.renderOrder = 2;
        const u = half.mesh.material.uniforms;
        u.uCutP.value = screenToLocal(c.x, c.y, half.group);
        u.uCutN.value = [c.nx, -c.ny];                              // trục y của màn hình ngược với trục y của scene
        u.uCutSide.value = sg;
        scene.add(half.group);
        return { obj: half, sg };
      });
      c.cur.group.visible = false;
    }
    function drawCine(now) {
      const c = cine, t = now - c.t0, ev = c.ev;
      if (!ev.block && t >= CT.block) {                              // bone chặn vệt chém
        ev.block = 1; flash(70, 'rgba(255,255,255,0.5)'); shake(0.8, 3);
        const cols = ['#ffffff', '#ffd0d8', '#ff3344'];
        for (let i = 0; i < 40; i++) particles.push({ x: c.x, y: c.y, vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.5) * 14, life: 30 + Math.random() * 30, age: 0, c: cols[(Math.random() * 3) | 0], s: PX * (0.5 + Math.random() * 0.7) });
      }
      if (!ev.cut && t >= CT.hit) { ev.cut = 1; cineCut(c); }
      const p = camAt(t);
      applyCam(c, p);
      const W = innerWidth, H = innerHeight, ce = t - CT.hit;
      const sS = c.sansScale, sw = SANS_O.width * sS, sh = SANS_O.height * sS, bw = BONE_O.width * c.boneScale, bh = BONE_O.height * c.boneScale;
      if (ce < 0) {                                                  // Sans đứng sau bone, hiện rõ
        const par = -p.yaw * 2.2, sxc = c.sans.x + par, syc = c.sans.y + Math.sin(t / 230) * 4;
        fx.globalAlpha = ramp(t, CT.block + 30, CT.block + 480);
        fx.drawImage(SANS_O, Math.round(sxc - sw / 2), Math.round(syc - sh / 2), sw, sh);
        fx.globalAlpha = 1;
        if (t >= CT.block) {
          const shk = 2 + Math.min(1, (t - CT.block) / 1500) * 7;
          fx.drawImage(BONE_O, Math.round(c.x - bw / 2 + (Math.random() - 0.5) * shk), Math.round(c.y - bh / 2), bw, bh);
        }
        if (t > CT.up + 50 && t < CT.wave - 150) drawGhostLine(c, c.x - c.nx * c.fwd * 0.22 * c.D, c.y - c.ny * c.fwd * 0.22 * c.D, 1.25, ramp(t, CT.up + 50, CT.up + 650) * (0.75 + 0.25 * Math.sin(t / 110)));
        if (t >= CT.wave - 150) drawWave(c, t);
      } else {
        if (!c.acts) c.acts = { sans: { img: SANS_O, x: c.sans.x - sw / 2, y: c.sans.y - sh / 2, w: sw, h: sh }, bone: { img: BONE_O, x: c.x - bw / 2, y: c.y - bh / 2, w: bw, h: bh } };
        updateHalves(c, ce);
        drawRift(c, ce);
        for (const sg of [1, -1]) { drawHalfCine(c, c.acts.bone, sg, ce); drawHalfCine(c, c.acts.sans, sg, ce); }
        if (!ev.dust && ce > 1000) { ev.dust = 1; shatterRect({ left: c.acts.sans.x, top: c.acts.sans.y + 700, width: sw, height: sh * 0.8 }, ['#f2f2f2', '#0b0b0b']); }
        drawWave(c, t);
      }
      drawPov(c, t, p);
    }

    // Bị Sans chặn: cảnh điện ảnh góc nhìn người chém (xem trình tự ở trên), kết thúc bằng slide kế lộ ra
    async function soulBlockCut(cur, cx, cy) {
      const W = innerWidth, H = innerHeight, D = Math.hypot(W, H);
      const side = cx < W / 2 ? 1 : -1;
      const sans = { x: cx + side * 0.17 * W, y: cy - 0.17 * H };     // Sans đứng trên đường cắt đi qua tâm bone
      let dx = sans.x - cx, dy = sans.y - cy; const dl = Math.hypot(dx, dy); dx /= dl; dy /= dl;
      const nx = -dy, ny = dx, fwd = ny <= 0 ? 1 : -1;
      const hW = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const vp = { x: Math.max(0.12 * W, Math.min(0.88 * W, cx + nx * fwd * 0.55 * D)), y: Math.max(0.1 * H, Math.min(0.9 * H, cy + ny * fwd * 0.55 * D)) };
      const c = cine = {
        t0: performance.now(), x: cx, y: cy, side, dx, dy, nx, ny, fwd, sans, D, vp, cur,
        L: D * 0.62, w: D * 0.075, bend: (Math.random() < 0.5 ? -1 : 1) * D * 0.045, seed: Math.random() * 1000,
        pivot: { x: cx + dx * 0.95 * D, y: cy + dy * 0.95 * D }, k: hW / H,
        sansScale: 0.36 * H / SANS_IMG.height, boneScale: 1.5, halves: null, acts: null, embers: [], ev: {}, camOn: false,
        streaks: [{ v: 0.22, t0: -0.7, t1: 0.25 }, { v: -0.15, t0: -0.3, t1: 0.8 }, { v: 0.05, t0: 0.1, t1: 0.9 }, { v: 0.32, t0: -0.9, t1: -0.2 }]
      };
      await wait(CT.end);
      stopGlitch();
      if (c.halves) c.halves.forEach((h) => disposeSlide(h.obj));
      disposeSlide(cur);
      resetCam();
      povCv.style.display = 'none';
      cine = null;
    }

    // Thoát chế độ tim xanh: slide hiện tại tan, quay về danh sách
    function soulExit() {
      if (view !== 'soul') return;
      view = 'busy';
      hideAnim3Now();
      soulBack.style.display = 'none';
      const cur = soul.cur;
      dustUntil = performance.now() + DISSOLVE_MS;
      tweenProgress(cur, 1.0, DISSOLVE_MS / 1000, 'none', () => {
        disposeSlide(cur);
        soul.cur = null; soul.on = false;
        showGrid();
      });
    }

    soulBack.addEventListener('click', (e) => { e.stopPropagation(); soulExit(); });
    window.addEventListener('click', (e) => {
      if (view === 'detail' && currentIndex === 1) { animGate(); return; }
      if (view !== 'soul' || e.target.closest('#soulBack')) return;
      if (animGate()) return;
      soulStep(1, e.clientX);
    });

    startBtn.addEventListener('click', (e) => { e.stopPropagation(); enterGrid(); });

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (view === 'start') {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterGrid(); }
        return;
      }
      if (e.key === 'Escape' && view === 'settings') { closeSettings(); return; }
      if (view === 'soul') {                  // chế độ tim xanh: click / phím phải = tiếp, Backspace / phím trái = lùi
        if (e.key === 'Backspace' || e.key === 'ArrowLeft') { e.preventDefault(); soulStep(-1); }
        else if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          if (animGate()) return;
          soulStep(1, innerWidth * (0.45 + Math.random() * 0.1));
        }
        return;
      }
      if (e.key === 'Backspace') {
        e.preventDefault();
        if (view === 'settings') closeSettings();
        else if (view === 'grid' || view === 'choose') backToStart();
        else if (view === 'detail') closeDetail();
      } else if ((e.key === 'Enter' || e.key === ' ') && view === 'detail' && currentIndex === 1) {
        e.preventDefault();
        animGate();
      }
    });

    // Phím bấm trong slide 3 (iframe) được chuyển lên đây: Backspace quay lại danh sách
    window.addEventListener('message', (ev) => {
      const d = ev.data;
      if (ev.source !== anim3.contentWindow || !d) return;
      if (d.type === 'anim-state') {
        animState = d.state;
        if (d.state === 'busy') animBusyAt = performance.now();
        if (d.state === 'done') animFinished();
        return;
      }
      if (d.type !== 'slide-key') return;
      if (d.key === 'Backspace') {
        if (view === 'detail') closeDetail();
        else if (view === 'soul') soulStep(-1);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      const k = coverScale();
      scene.children.forEach((g) => { if (g.isGroup) g.scale.setScalar(k); });
      resizeFx();
      if (glitch.on) { glitchCv.width = innerWidth; glitchCv.height = innerHeight; }
    });

    (function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
      if (glitch.on) drawGlitch(performance.now());      // phải vẽ ngay sau render để còn lấy được ảnh WebGL
    })();
  </script>
</body>
</html>
