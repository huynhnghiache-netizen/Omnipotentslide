<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài thuyết trình Critical Slash</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background-color: #050505; font-family: 'Courier New', Courier, monospace; }
#canvas-container { width: 100vw; height: 100vh; position: relative; }

/* Hiệu ứng chém pixel */
.slash-effect {
  position: absolute;
  top: 50%; left: 50%;
  width: 24px; height: 120vh;
  background: #ff3344;
  border: 3px solid #000000;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 10;
  opacity: 0;
}

/* Khung số 99999 chuẩn Game RPG Pixel */
.damage-text {
  position: absolute;
  top: 40%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background-color: #ff3344;
  color: #000000;
  border: 4px solid #000000;
  padding: 6px 16px;
  font-size: 55px;
  font-weight: 900;
  font-family: 'Courier New', Courier, monospace;
  letter-spacing: 4px;
  box-shadow: 4px 4px 0px #000000;
  pointer-events: none;
  z-index: 20;
  white-space: nowrap;
}

.ui-layer {
  position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
  color: rgba(255, 255, 255, 0.6); font-size: 14px; pointer-events: none; z-index: 30;
  font-family: sans-serif;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<div class="ui-layer">Click chuột hoặc dùng phím Mũi tên phải / Space để chém slide tiếp theo!</div>
<div id="canvas-container">
  <div id="slash" class="slash-effect"></div>
  <div id="damage" class="damage-text">99999</div>
</div>

<script>
// Danh sách 10 slide (từ slide1.png đến slide10.png)
const slideImages = [
  'slide1.png', 'slide2.png', 'slide3.png', 'slide4.png', 'slide5.png',
  'slide6.png', 'slide7.png', 'slide8.png', 'slide9.png', 'slide10.png'
];
let currentIndex = 0;
let isAnimating = false;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.getElementById('canvas-container').appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambientLight);

const textureLoader = new THREE.TextureLoader();

function createSlicedSlide(texturePath, zIndex) {
  const group = new THREE.Group();
  group.position.z = zIndex;

  const width = 4.8;
  const height = 2.7;
  const texture = textureLoader.load(texturePath);

  // Mảnh trái
  const leftGeo = new THREE.PlaneGeometry(width / 2, height);
  leftGeo.translate(-width / 4, 0, 0);
  const leftUv = leftGeo.attributes.uv;
  for (let i = 0; i < leftUv.count; i++) leftUv.setX(i, leftUv.getX(i) * 0.5);
  const leftMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true });
  const leftPiece = new THREE.Mesh(leftGeo, leftMat);
  leftPiece.position.x = width / 4;

  // Mảnh phải
  const rightGeo = new THREE.PlaneGeometry(width / 2, height);
  rightGeo.translate(width / 4, 0, 0);
  const rightUv = rightGeo.attributes.uv;
  for (let i = 0; i < rightUv.count; i++) rightUv.setX(i, 0.5 + rightUv.getX(i) * 0.5);
  const rightMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true });
  const rightPiece = new THREE.Mesh(rightGeo, rightMat);
  rightPiece.position.x = -width / 4;

  group.add(leftPiece);
  group.add(rightPiece);
  return { group, leftPiece, rightPiece };
}

let currentSlideObj = createSlicedSlide(slideImages[currentIndex], 0);
scene.add(currentSlideObj.group);

let nextSlideObj = (currentIndex + 1 < slideImages.length)
  ? createSlicedSlide(slideImages[currentIndex + 1], -1.5)
  : null;
if (nextSlideObj) scene.add(nextSlideObj.group);

// Mảng các Frame clip-path pixel giật cục mô phỏng hiệu ứng chém game
const pixelSlashFrames = [
  'polygon(40% 0%, 60% 0%, 60% 12%, 40% 12%)',
  'polygon(20% 5%, 80% 5%, 80% 45%, 20% 45%)',
  'polygon(0% 0%, 100% 0%, 100% 70%, 0% 70%)',
  'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)',
  'polygon(0% 20%, 100% 20%, 100% 100%, 0% 80%)'
];

function playPixelSlashAnimation(callback) {
  const slashEl = document.getElementById('slash');
  slashEl.style.opacity = '1';
  let frameIndex = 0;

  const interval = setInterval(() => {
    if (frameIndex < pixelSlashFrames.length) {
      slashEl.style.clipPath = pixelSlashFrames[frameIndex];
      frameIndex++;
    } else {
      clearInterval(interval);
      slashEl.style.opacity = '0';
      if (callback) callback();
    }
  }, 35);
}

function nextSlide() {
  if (isAnimating || currentIndex >= slideImages.length - 1) return;
  isAnimating = true;

  const damageEl = document.getElementById('damage');

  // 1. Kích hoạt hiệu ứng chém Pixel
  playPixelSlashAnimation(() => {});

  // 2. Nhảy số 99999 lên đồng bộ
  gsap.timeline()
    .set(damageEl, { scale: 0.2, opacity: 1, y: 0 })
    .to(damageEl, { scale: 1.4, duration: 0.15, ease: "back.out(3)" })
    .to(damageEl, { scale: 1, duration: 0.1 })
    .to(damageEl, { y: -50, opacity: 0, duration: 0.4, delay: 0.2, ease: "power2.in" });

  // 3. Tách đôi slide hiện tại và rơi xuống
  const { leftPiece, rightPiece, group } = currentSlideObj;
  const duration = 1.2;

  gsap.to(leftPiece.position, {
    y: -7, x: leftPiece.position.x - 1.2,
    duration: duration, delay: 0.05, ease: "power2.in"
  });
  gsap.to(leftPiece.rotation, {
    z: 0.25, x: 0.15,
    duration: duration, delay: 0.05, ease: "power2.in"
  });

  gsap.to(rightPiece.position, {
    y: -7, x: rightPiece.position.x + 1.2,
    duration: duration, delay: 0.05, ease: "power2.in"
  });
  gsap.to(rightPiece.rotation, {
    z: -0.25, x: -0.15,
    duration: duration, delay: 0.05, ease: "power2.in"
  });

  // 4. Slide tiếp theo tiến lên
  if (nextSlideObj) {
    gsap.to(nextSlideObj.group.position, {
      z: 0, duration: 1.0, delay: 0.2, ease: "power2.out",
      onComplete: () => {
        scene.remove(group);
        currentIndex++;
        currentSlideObj = nextSlideObj;
        nextSlideObj = (currentIndex + 1 < slideImages.length)
          ? createSlicedSlide(slideImages[currentIndex + 1], -1.5)
          : null;
        if (nextSlideObj) scene.add(nextSlideObj.group);
        isAnimating = false;
      }
    });
  }
}

window.addEventListener('click', nextSlide);
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
