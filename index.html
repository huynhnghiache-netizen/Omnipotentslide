<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Critical Slash Slide Presentation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background-color: #030303; font-family: 'Courier New', Courier, monospace; }
    #canvas-container { width: 100vw; height: 100vh; position: relative; }
    #fx {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 10; image-rendering: pixelated;
    }
    #dmg {
      position: fixed; display: none; pointer-events: none; z-index: 20;
      image-rendering: pixelated; transform-origin: 50% 50%;
    }
    .ui-layer {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.4); font-size: 14px; pointer-events: none; z-index: 30;
      white-space: nowrap;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div class="ui-layer">Click / Space: chém slide tiếp &nbsp;·&nbsp; ← : quay lại slide trước</div>
  <div id="canvas-container"></div>
  <canvas id="fx"></canvas>
  <canvas id="dmg"></canvas>

  <script>
    // ================= CẤU HÌNH =================
    const slideImages = [
      'slide1.png', 'slide2.png', 'slide3.png', 'slide4.png', 'slide5.png',
      'slide6.png', 'slide7.png', 'slide8.png', 'slide9.png', 'slide10.png'
    ];
    const PX = 8;                     // kích thước 1 "pixel" trên màn hình
    const MOSAIC = [80, 45];          // số ô mosaic khi slide vỡ (ngang x dọc)
    const BREAK_END = 1.3;            // mốc uProgress để slide vỡ hết
    let currentIndex = 0;
    let isAnimating = false;

    // ================= THREE.JS =================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
    camera.position.z = 5.2;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 1.3));

    // Cache texture: mỗi ảnh chỉ load 1 lần
    const texCache = {};
    function getTex(path) {
      if (!texCache[path]) {
        const t = new THREE.TextureLoader().load(path);
        t.minFilter = THREE.LinearFilter;
        texCache[path] = t;
      }
      return texCache[path];
    }

    // Shader vỡ mosaic: mỗi ô có số ngẫu nhiên d = r - uProgress.
    // d > 0: còn nguyên | -0.25 < d < 0: ô đen/trắng kiểu mosaic | d < -0.25: biến mất
    const BREAK_VERT = `
      uniform float uProgress;
      varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void main() {
        vUv = uv;
        vec2 cell = floor(uv * vec2(${MOSAIC[0]}.0, ${MOSAIC[1]}.0));
        float k = uProgress * uProgress;
        vec3 p = position;
        p.x += (hash(cell + 17.31) - 0.5) * 1.6 * k;
        p.y += (0.5 + hash(cell + 41.70)) * 2.2 * k;
        p.z += hash(cell) * 0.4 * k;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`;

    const BREAK_FRAG = `
      uniform sampler2D map;
      uniform float uProgress;
      varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void main() {
        vec2 cell = floor(vUv * vec2(${MOSAIC[0]}.0, ${MOSAIC[1]}.0));
        float d = hash(cell) - uProgress;
        if (d < -0.25) discard;
        if (d < 0.0) {
          float bw = step(0.5, hash(cell + 3.3));
          gl_FragColor = vec4(vec3(bw), 1.0 + d / 0.25);
          return;
        }
        vec4 c = texture2D(map, vUv);
        if (c.a < 0.01) discard;
        gl_FragColor = vec4(c.rgb, c.a * clamp(d / 0.08, 0.0, 1.0));
      }`;

    function makeBreakMat(tex) {
      return new THREE.ShaderMaterial({
        uniforms: { map: { value: tex }, uProgress: { value: 0 } },
        vertexShader: BREAK_VERT,
        fragmentShader: BREAK_FRAG,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      });
    }

    function createSlicedSlide(texturePath, zIndex) {
      const group = new THREE.Group();
      group.position.z = zIndex;
      const width = 7.5, height = 4.2;
      const texture = getTex(texturePath);

      // Nửa trái: UV 0 → 0.5
      const leftGeo = new THREE.PlaneGeometry(width / 2, height);
      leftGeo.translate(-width / 4, 0, 0);
      const lu = leftGeo.attributes.uv;
      for (let i = 0; i < lu.count; i++) lu.setX(i, lu.getX(i) * 0.5);
      const leftPiece = new THREE.Mesh(leftGeo, makeBreakMat(texture));

      // Nửa phải: UV 0.5 → 1
      const rightGeo = new THREE.PlaneGeometry(width / 2, height);
      rightGeo.translate(width / 4, 0, 0);
      const ru = rightGeo.attributes.uv;
      for (let i = 0; i < ru.count; i++) ru.setX(i, 0.5 + ru.getX(i) * 0.5);
      const rightPiece = new THREE.Mesh(rightGeo, makeBreakMat(texture));

      group.add(leftPiece, rightPiece);
      return { group, leftPiece, rightPiece };
    }

    function setProgress(obj, v) {
      obj.leftPiece.material.uniforms.uProgress.value = v;
      obj.rightPiece.material.uniforms.uProgress.value = v;
    }
    function tweenProgress(obj, to, dur, ease, onComplete) {
      return gsap.to(
        [obj.leftPiece.material.uniforms.uProgress, obj.rightPiece.material.uniforms.uProgress],
        { value: to, duration: dur, ease: ease, onComplete: onComplete }
      );
    }

    function disposeSlide(obj) {
      obj.group.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) o.material.dispose();
      });
      scene.remove(obj.group);
    }

    let currentSlideObj = createSlicedSlide(slideImages[currentIndex], 0);
    scene.add(currentSlideObj.group);
    let nextSlideObj = currentIndex + 1 < slideImages.length
      ? createSlicedSlide(slideImages[currentIndex + 1], -1.5) : null;
    if (nextSlideObj) scene.add(nextSlideObj.group);

    // ================= LỚP PIXEL (canvas 2D) =================
    const fxCanvas = document.getElementById('fx');
    const fx = fxCanvas.getContext('2d');
    let COLS = 0, ROWS = 0;
    function resizeFx() {
      fxCanvas.width = innerWidth;
      fxCanvas.height = innerHeight;
      COLS = Math.ceil(innerWidth / PX);
      ROWS = Math.ceil(innerHeight / PX);
    }
    resizeFx();

    function drawMask(m, color) {
      fx.fillStyle = color;
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        if (m[y * COLS + x]) fx.fillRect(x * PX, y * PX, PX, PX);
      }
    }

    // Vệt chém: build sẵn hình dạng từng hàng, mở dần từ trên xuống theo bước 40ms (giật cục)
    let slash = null;
    let flashUntil = 0;
    function startSlash(hitX) {
      const rows = new Array(ROWS);
      let x = hitX, half = 2, left = 0;
      for (let y = 0; y < ROWS; y++) {
        if (left <= 0) {
          left = 4 + ((Math.random() * 12) | 0);
          x = hitX + ((Math.random() * 7) | 0) - 3;
          half = 1 + ((Math.random() * 3) | 0);
        }
        left--;
        rows[y] = [x - half, x + half];
      }
      slash = { start: performance.now(), rows };
      return rows;
    }

    function slashMask(now) {
      const e = now - slash.start;
      if (e > 450) { slash = null; return null; }
      const step = Math.floor(e / 40) * 40;
      const grow = Math.min(ROWS, Math.ceil(ROWS * Math.min(1, step / 280)));
      const m = new Uint8Array(COLS * ROWS);
      for (let y = 0; y < grow; y++) {
        const [a, b] = slash.rows[y];
        for (let x = Math.max(0, a); x <= Math.min(COLS - 1, b); x++) m[y * COLS + x] = 1;
      }
      return m;
    }

    // Vết máu nhỏ kiểu Undertale: vệt đỏ méo, có vài giọt chảy xuống, nằm đúng chỗ chém
    let splat = null;
    function startSplat(hitX, hitY) {
      const mask = new Uint8Array(COLS * ROWS);
      const set = (x, y) => { if (x >= 0 && y >= 0 && x < COLS && y < ROWS) mask[y * COLS + x] = 1; };
      const len = Math.round(ROWS * 0.16) + ((Math.random() * ROWS * 0.06) | 0);
      let x = hitX, w = 1;
      const top = hitY - ((len * 0.4) | 0);
      for (let i = 0; i < len; i++) {
        const y = top + i;
        if (Math.random() < 0.3) x += Math.random() < 0.5 ? -1 : 1;
        if (Math.random() < 0.25) w = Math.max(1, Math.min(2, w + (Math.random() < 0.5 ? -1 : 1)));
        const taper = i > len * 0.75 ? 0 : 1;   // đuôi nhọn dần
        for (let dx = -w * taper; dx <= w * taper; dx++) set(x + dx, y);
        if (Math.random() < 0.05) for (let k = 1; k <= 3; k++) set(x, y + k);  // giọt chảy
      }
      splat = { mask };
    }

    // Bụi bay lên
    const particles = [];
    let dustUntil = 0;
    function spawnDust(n) {
      for (let i = 0; i < n && particles.length < 500; i++) {
        const r = Math.random();
        particles.push({
          x: innerWidth * (0.15 + Math.random() * 0.7),
          y: innerHeight * (0.2 + Math.random() * 0.6),
          vx: (Math.random() - 0.5) * 1.2,
          vy: -(0.8 + Math.random() * 2.2),
          life: 50 + Math.random() * 50, age: 0,
          c: r < 0.12 ? '#ff3344' : (r < 0.56 ? '#e8dcc4' : '#7a6a52'),
          s: Math.random() < 0.5 ? PX * 0.5 : PX * 0.35
        });
      }
    }

    function fxLoop(now) {
      fx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      if (now < flashUntil) {
        fx.fillStyle = 'rgba(255, 40, 60, 0.12)';
        fx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
      }
      if (slash) {
        const m = slashMask(now);
        if (m) drawMask(m, '#ff3344');
      }
      if (splat) drawMask(splat.mask, '#c8102e');
      if (now < dustUntil) spawnDust(6);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.age++; p.x += p.vx; p.y += p.vy; p.vy *= 0.99;
        if (p.age > p.life) { particles.splice(i, 1); continue; }
        fx.globalAlpha = 1 - p.age / p.life;
        fx.fillStyle = p.c;
        fx.fillRect(Math.round(p.x / PX) * PX, Math.round(p.y / PX) * PX, p.s, p.s);
      }
      fx.globalAlpha = 1;
      requestAnimationFrame(fxLoop);
    }
    requestAnimationFrame(fxLoop);

    // Rung màn hình khi chém
    function shake() {
      gsap.fromTo('#canvas-container', { x: 0, y: 0 }, {
        x: () => (Math.random() - 0.5) * 16,
        y: () => (Math.random() - 0.5) * 10,
        duration: 0.05, repeat: 5, yoyo: true, ease: 'none',
        onComplete: () => gsap.set('#canvas-container', { x: 0, y: 0 })
      });
    }

    // ================= SỐ DAMAGE (pixel font 3x5) =================
    const GLYPHS = {
      '0': ['111','101','101','101','111'], '1': ['010','110','010','010','111'],
      '2': ['111','001','111','100','111'], '3': ['111','001','111','001','111'],
      '4': ['101','101','111','001','001'], '5': ['111','100','111','001','111'],
      '6': ['111','100','111','101','111'], '7': ['111','001','010','010','010'],
      '8': ['111','101','111','101','111'], '9': ['111','101','111','001','111']
    };
    const dmgEl = document.getElementById('dmg');
    function showDamage(px, py, num) {
      const cell = Math.max(4, Math.round(innerHeight / 160)); // kích thước 1 pixel font
      const s = String(num);
      const pad = 2, border = 1, gap = 1;
      const W = s.length * 3 + (s.length - 1) * gap + (pad + border) * 2;
      const H = 5 + (pad + border) * 2;
      dmgEl.width = W; dmgEl.height = H;
      const g = dmgEl.getContext('2d');
      g.clearRect(0, 0, W, H);
      g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#ff3344'; g.fillRect(border, border, W - border * 2, H - border * 2);
      g.fillStyle = '#000';
      let x = pad + border;
      for (const ch of s) {
        const rows = GLYPHS[ch];
        for (let y = 0; y < 5; y++) for (let i = 0; i < 3; i++) {
          if (rows[y][i] === '1') g.fillRect(x + i, pad + border + y, 1, 1);
        }
        x += 3 + gap;
      }
      dmgEl.style.width = W * cell + 'px';
      dmgEl.style.height = H * cell + 'px';
      dmgEl.style.left = (px - W * cell / 2) + 'px';
      dmgEl.style.top = (py - H * cell / 2) + 'px';

      gsap.killTweensOf(dmgEl);
      gsap.timeline()
        .set(dmgEl, { display: 'block', opacity: 1, scale: 0.2, y: 0 })
        .to(dmgEl, { scale: 1.25, duration: 0.12, ease: 'back.out(3)' })
        .to(dmgEl, { scale: 1, duration: 0.08 })
        .to(dmgEl, { y: -40, opacity: 0, duration: 0.35, delay: 0.25, ease: 'power2.in' })
        .set(dmgEl, { display: 'none' });
    }

    // ================= CHUYỂN SLIDE =================
    // Slide sau trồi lên từ dưới, hiện ra theo mosaic ngược lại với lúc vỡ
    function revealNext(nxt) {
      nxt.group.position.z = 0;
      nxt.group.position.y = -4;
      setProgress(nxt, BREAK_END);
      gsap.to(nxt.group.position, { y: 0, duration: 1.0, ease: 'power3.out' });
      tweenProgress(nxt, 0, 0.9, 'power1.out', () => finishSlide(nxt));
    }

    function finishSlide(nxt) {
      currentSlideObj = nxt;
      currentIndex++;
      nextSlideObj = currentIndex + 1 < slideImages.length
        ? createSlicedSlide(slideImages[currentIndex + 1], -1.5) : null;
      if (nextSlideObj) scene.add(nextSlideObj.group);
      isAnimating = false;
    }

    // Tiến: chém -> vết máu -> slide vỡ mosaic -> slide sau trồi lên
    function nextSlide() {
      if (isAnimating || currentIndex >= slideImages.length - 1) return;
      isAnimating = true;

      const cur = currentSlideObj;
      const nxt = nextSlideObj;
      const hitX = Math.round((innerWidth * 0.5 + (Math.random() - 0.5) * innerWidth * 0.15) / PX);
      const hitY = Math.round(innerHeight * 0.42 / PX);

      // 0ms: vệt chém từ trên xuống
      const rows = startSlash(hitX);

      // 260ms: chạm đích: rung + nháy đỏ
      setTimeout(() => { shake(); flashUntil = performance.now() + 90; }, 260);

      // 320ms: vết máu nhỏ dính vào slide + số damage ngẫu nhiên 1-100
      setTimeout(() => {
        startSplat(hitX, hitY);
        showDamage(hitX * PX, hitY * PX, 1 + Math.floor(Math.random() * 100));
      }, 320);

      // 500ms: slide vỡ thành mosaic rồi bay lên thành bụi
      setTimeout(() => {
        dustUntil = performance.now() + 1500;
        tweenProgress(cur, BREAK_END, 1.5, 'none', () => {
          splat = null;
          disposeSlide(cur);
          revealNext(nxt);
        });
      }, 500);
    }

    // Lùi: slide trước hiện lại từ mosaic, slide hiện tại vỡ đi
    function prevSlide() {
      if (isAnimating || currentIndex <= 0) return;
      isAnimating = true;
      splat = null;

      const cur = currentSlideObj;
      const ahead = nextSlideObj;
      const back = createSlicedSlide(slideImages[currentIndex - 1], -0.05);
      setProgress(back, BREAK_END);
      scene.add(back.group);

      tweenProgress(back, 0, 1.2, 'power1.out');
      tweenProgress(cur, BREAK_END, 1.0, 'power1.in', () => {
        disposeSlide(cur);
        if (ahead) disposeSlide(ahead);
        back.group.position.z = 0;
        currentSlideObj = back;
        currentIndex--;
        nextSlideObj = createSlicedSlide(slideImages[currentIndex + 1], -1.5);
        scene.add(nextSlideObj.group);
        isAnimating = false;
      });
    }

    window.addEventListener('click', nextSlide);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); prevSlide(); }
    });

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      resizeFx();
    });

    (function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
