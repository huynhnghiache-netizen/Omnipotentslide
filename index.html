<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Critical Slash Slide Presentation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background-color: #030303; font-family: 'Courier New', Courier, monospace; }
    #canvas-container { width: 100vw; height: 100vh; position: relative; }
    #fx {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 10; image-rendering: pixelated;
    }
    /* Lớp đồ họa phủ: vignette tối 4 góc + scanline mờ kiểu màn hình retro */
    #overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 25;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 100%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 3px);
    }
    .dmg {
      position: fixed; display: block; pointer-events: none; z-index: 22;
      image-rendering: pixelated; transform-origin: 50% 50%;
      filter: drop-shadow(4px 4px 0 #000);
    }
    /* Slide đang được phóng từ thẻ lên toàn màn hình */
    .fly {
      position: fixed; z-index: 36; pointer-events: none;
      background-size: 100% 100%; background-repeat: no-repeat;
      box-shadow: 0 0 0 3px #000;
    }
    /* Slide 3: bản có chuyển động (slide3-anim.html) phủ lên khi mở */
    #anim3 { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 20; display: none; background: transparent; pointer-events: none; }
    @keyframes blink { to { visibility: hidden; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ===== Frame 1: START ===== */
    #start {
      position: fixed; inset: 0; z-index: 40;
      display: flex; align-items: center; justify-content: center;
      background: #050205;
    }
    .start-btn {
      position: relative; z-index: 1;
      font-family: 'Press Start 2P', monospace; font-size: clamp(22px, 5vw, 48px);
      letter-spacing: 4px; color: #fff; background: none; border: none; cursor: pointer;
      text-shadow: 4px 4px 0 #8a0016, 8px 8px 0 #000;
      animation: pulse 1.6s ease-in-out infinite;
      transition: color 0.15s, transform 0.15s;
    }
    .start-btn:hover { color: #ff3344; transform: scale(1.05); }
    .start-btn:focus-visible { outline: 3px dashed #ffb3b9; outline-offset: 14px; }


    /* ===== Màn LOADING (trước START) ===== */
    #loader { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, 84vw); text-align: center; font-family: 'Press Start 2P', monospace; color: #fff; }
    #loader .ld-heart { width: 34px; height: 30px; margin: 0 auto 26px; animation: soulBeat 1.1s infinite; image-rendering: pixelated; }
    #loader .ld-title { font-size: clamp(16px, 3vw, 26px); letter-spacing: 4px; text-shadow: 3px 3px 0 #8a0016, 6px 6px 0 #000; }
    #loader .ld-bar { margin: 28px 0 14px; height: 30px; border: 4px solid #fff; background: #b00018; box-shadow: 6px 6px 0 #000; padding: 0; position: relative; }
    #loader .ld-fill { display: block; height: 100%; width: 0%; background: #ffe000; box-shadow: inset 0 -6px 0 rgba(0,0,0,.18); }
    #loader .ld-meta { display: flex; justify-content: space-between; gap: 16px; font-size: clamp(9px, 1.5vw, 12px); letter-spacing: 1px; color: #d9cfcf; }
    #loader .ld-task { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
    #loader .ld-warn { margin-top: 18px; font-size: 10px; line-height: 1.8; color: #ffb3b9; display: none; }
    #start.loading .start-btn { display: none; }
    #start:not(.loading) #loader { display: none; }

    /* ===== Frame 2: DANH SÁCH 10 SLIDE ===== */
    #grid {
      position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column;
      padding: 36px 48px 0; overflow: hidden;
      background: radial-gradient(ellipse at 50% 0%, #2a0810 0%, #0b0304 60%, #000 100%);
    }
    #deco { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .frame { position: absolute; inset: 14px; border: 2px solid rgba(255, 51, 68, 0.22); pointer-events: none; z-index: 0; }
    .frame::before, .frame::after { content: ''; position: absolute; width: 36px; height: 36px; border: 4px solid #ff3344; }
    .frame::before { left: -4px; top: -4px; border-right: none; border-bottom: none; }
    .frame::after { right: -4px; bottom: -4px; border-left: none; border-top: none; }
    .grid-inner {
      position: relative; z-index: 1; flex: 1; min-height: 0;
      display: flex; flex-direction: column; width: 100%; max-width: 1400px; margin: 0 auto;
      padding-bottom: 24px;
    }
    .grid-head {
      display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px;
      margin-bottom: 26px;
    }
    .grid-head h2 {
      font-family: 'Press Start 2P', monospace; font-weight: 400; font-size: clamp(16px, 2.6vw, 28px);
      color: #fff; text-shadow: 4px 4px 0 #8a0016, 8px 8px 0 #000;
      animation: jitter 3.2s steps(1) infinite;
    }
    @keyframes jitter {
      0%, 88%, 100% { transform: none; }
      90% { transform: translateX(-4px); text-shadow: -3px 0 0 #00e5ff, 4px 4px 0 #8a0016; }
      92% { transform: translateX(3px); text-shadow: 3px 0 0 #ff3344, 6px 6px 0 #000; }
      94% { transform: none; }
    }
    /* Hai nút ở giữa phía trên: bánh răng (mở bảng cài đặt trống) và trái tim xanh Undertale (chỉ để bấm) */
    .tools { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); display: flex; gap: 22px; align-items: center; z-index: 2; }
    .tool {
      width: 54px; height: 54px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;
      background: #111; border: 3px solid #000; box-shadow: 0 5px 0 #000;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    }
    .tool canvas { width: 32px; height: 32px; display: block; image-rendering: pixelated; filter: drop-shadow(2px 2px 0 #000); }
    .tool:hover { transform: translateY(-3px); border-color: #ff3344; box-shadow: 0 8px 0 #000, 0 0 14px rgba(255, 51, 68, 0.45); }
    .tool.heart:hover { border-color: #3d66ff; box-shadow: 0 8px 0 #000, 0 0 14px rgba(0, 60, 255, 0.55); }
    .tool:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
    .tool:focus-visible { outline: 3px dashed #ffb3b9; outline-offset: 4px; }

    /* ===== Chế độ tim xanh: màn đen + tim, lớp glitch, tim đỏ để thoát ===== */
    #soulIntro { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: #000; }
    #soulHeart { width: clamp(96px, 17vmin, 200px); height: auto; image-rendering: pixelated; position: relative; z-index: 1; }
    .soul-ring { position: absolute; inset: 0; margin: auto; width: clamp(96px, 17vmin, 200px); height: clamp(96px, 17vmin, 200px); border: 6px solid #3d66ff; pointer-events: none; }
    /* Cảnh Hiệp sĩ chém: video đã cắt (nền đen) trộn "screen" lên trên slide */
    #knStage { position: fixed; inset: 0; z-index: 11; pointer-events: none; display: none; }
    #knDim { position: absolute; background: #000; opacity: 0; }
    #knWrap { position: absolute; overflow: hidden; opacity: 0; transform-origin: 0 0;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 9%); mask-image: linear-gradient(to right, transparent 0, #000 9%); }
    #knCv2 { position: absolute; display: none; opacity: 0; filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 0 14px rgba(255,255,255,.35)); }
    #knVid2 { position: absolute; left: 0; top: 0; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; }
    #knVid { position: absolute; left: 0; top: 0; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; }
    #knCv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
    #cineBlack { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 60; }
    #glitch { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 52; pointer-events: none; display: none; }
    #soulBack {
      position: fixed; right: 18px; top: 18px; z-index: 56; width: 48px; height: 48px; padding: 0; display: none;
      align-items: center; justify-content: center; cursor: pointer;
      background: rgba(0, 0, 0, 0.6); border: 3px solid #000; box-shadow: 0 5px 0 #000;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    }
    #soulBack canvas { width: 28px; height: auto; display: block; image-rendering: pixelated; filter: drop-shadow(2px 2px 0 #000); animation: soulBeat 1.2s steps(1) infinite; }
    #soulGear {
      position: fixed; right: 78px; top: 18px; z-index: 56; width: 48px; height: 48px; padding: 0; display: none;
      align-items: center; justify-content: center; cursor: pointer;
      background: rgba(0, 0, 0, 0.6); border: 3px solid #000; box-shadow: 0 5px 0 #000;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    }
    #soulGear canvas { width: 28px; height: 28px; display: block; image-rendering: pixelated; filter: drop-shadow(2px 2px 0 #000); }
    #soulGear:hover { transform: translateY(-3px); border-color: #3d66ff; box-shadow: 0 8px 0 #000, 0 0 14px rgba(0, 60, 255, 0.55); }
    #soulGear:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
    #soulBack:hover { transform: translateY(-3px); border-color: #ff3344; box-shadow: 0 8px 0 #000, 0 0 14px rgba(255, 51, 68, 0.5); }
    #soulBack:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
    #soulBack:focus-visible { outline: 3px dashed #ffb3b9; outline-offset: 4px; }
    @keyframes soulBeat { 0%, 70%, 100% { transform: none; } 78% { transform: scale(1.18); } 86% { transform: none; } 92% { transform: scale(1.1); } }

    /* Bảng cài đặt: để trống */
    #settings {
      position: fixed; inset: 0; z-index: 34; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.72); opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    #settings.show { opacity: 1; pointer-events: auto; }
    .settings-box {
      position: relative; width: min(560px, 88vw); height: min(340px, 62vh);
      background: #000; border: 4px solid #fff; box-shadow: 0 0 0 4px #000, 8px 8px 0 4px rgba(255, 51, 68, 0.5);
    }
    .settings-title { position: absolute; left: 20px; top: 18px; font-family: 'Press Start 2P', monospace; font-size: 14px; color: #fff; text-shadow: 3px 3px 0 #8a0016; }
    .settings-close { position: absolute; right: 12px; top: 10px; padding: 8px; background: none; border: none; cursor: pointer; font-family: 'Press Start 2P', monospace; font-size: 14px; color: #fff; }
    .settings-close:hover { color: #ff3344; }
    .settings-hint { position: absolute; left: 20px; bottom: 14px; font-family: 'Press Start 2P', monospace; font-size: 9px; letter-spacing: 1px; color: rgba(255, 255, 255, 0.4); }

    .sans-row { position: absolute; left: 22px; right: 22px; top: 86px; font-family: 'Press Start 2P', monospace; color: #fff; }
    .sans-row .sr-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; letter-spacing: 1px; margin-bottom: 14px; }
    .sans-row .sr-val { color: #ffe000; font-size: 14px; text-shadow: 2px 2px 0 #000; }
    .sans-row .sr-note { margin-top: 12px; font-size: 8px; line-height: 1.8; color: rgba(255, 255, 255, 0.45); letter-spacing: 1px; }
    .sans-row input[type=range] { width: 100%; height: 26px; accent-color: #ff3344; cursor: pointer; background: transparent; }
    .settings-box.list .sans-row { position: static; margin-top: 18px; padding-top: 14px; border-top: 3px solid #333; }
    .settings-box.list { height: auto; max-height: 94vh; overflow-y: auto; padding: 58px 22px 46px; }
    .slide-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .slide-item { font-family: 'Press Start 2P', monospace; font-size: 10px; line-height: 1.5; text-align: left; color: #fff; background: #000; border: 3px solid #fff; padding: 11px 10px; cursor: pointer; }
    .slide-item b { color: #ff3344; margin-right: 8px; }
    .slide-item:hover { border-color: #3d66ff; color: #7b97ff; }
    .slide-item.cur { background: #0a1a66; border-color: #3d66ff; }
    @media (max-width: 560px) { .slide-list { grid-template-columns: 1fr; } }

    .cursor { animation: blink 1s steps(2, start) infinite; }
    .grid-head span { font-size: 12px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.55); text-shadow: 2px 2px 0 #000; }
    .cards {
      flex: 1; min-height: 0;
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .card {
      position: relative; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
      padding: 0; text-align: left; cursor: pointer; font: inherit; color: #fff; background: #111;
      border: 3px solid #000; box-shadow: 0 6px 0 #000;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    }
    .card img { flex: 1; min-height: 0; width: 100%; object-fit: cover; display: block; }
    .card-meta {
      flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; background: #0a0a0a; border-top: 3px solid #000;
    }
    .card-num { font-family: 'Press Start 2P', monospace; font-size: 10px; color: #ff3344; }
    .card-title { font-size: 13px; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card::after {
      content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; pointer-events: none;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.22), transparent);
      transition: left 0.6s ease;
    }
    .card:hover::after { left: 120%; }
    .card:hover { transform: translateY(-4px); border-color: #ff3344; box-shadow: 0 10px 0 #000, 0 0 18px rgba(255, 51, 68, 0.45); }
    .card:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
    .card:focus-visible { outline: 3px dashed #ffb3b9; outline-offset: 4px; }
    .ticker {
      flex: 0 0 auto; position: relative; z-index: 1; overflow: hidden; white-space: nowrap;
      margin: 0 -48px; padding: 12px 0; background: #000; border-top: 3px solid #000;
    }
    .ticker-track {
      display: inline-block; animation: ticker 24s linear infinite;
      font-family: 'Press Start 2P', monospace; font-size: 10px; letter-spacing: 1px; color: rgba(255, 255, 255, 0.55);
    }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* ===== Bảng chọn slide cầm kiếm (khi bị Sans chặn) ===== */
    #choose {
      position: fixed; top: 36px; left: 50%; z-index: 32; text-align: center;
      transform: translate(-50%, -20px); opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #choose.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    #choose h3 {
      font-family: 'Press Start 2P', monospace; font-weight: 400; font-size: 13px; color: #fff;
      text-shadow: 3px 3px 0 #8a0016, 6px 6px 0 #000; margin-bottom: 10px;
    }
    #choose p { font-size: 12px; letter-spacing: 1px; color: rgba(255, 255, 255, 0.6); margin-bottom: 14px; text-shadow: 2px 2px 0 #000; }
    #picks { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; max-width: 92vw; }
    .pick {
      font-family: 'Press Start 2P', monospace; font-size: 11px; color: #fff;
      background: #ff3344; border: 3px solid #000; padding: 10px 12px; cursor: pointer;
      box-shadow: 0 5px 0 #000; transition: transform 0.1s, background 0.15s;
    }
    .pick:hover:not(:disabled) { background: #ff5566; transform: translateY(-2px); }
    .pick:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
    .pick:disabled { background: #2a2a2a; color: #666; cursor: not-allowed; box-shadow: 0 5px 0 #000; }

    @media (max-width: 760px) {
      #grid { padding: 24px 16px 0; overflow-y: auto; }
      .grid-inner { flex: none; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: 180px; }
      .ticker { margin: 0 -16px; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <canvas id="fx"></canvas>
  <div id="knStage" aria-hidden="true">
    <div id="knDim"></div>
    <div id="knWrap"><canvas id="knCv" width="578" height="322"></canvas><video id="knVid" muted playsinline preload="auto"><source src="assets/knight-attack.webm" type="video/webm"><source src="assets/knight-attack.mp4" type="video/mp4"></video></div>
    <canvas id="knCv2" width="266" height="282"></canvas><video id="knVid2" muted playsinline preload="auto"><source src="assets/knight-front.webm" type="video/webm"><source src="assets/knight-front.mp4" type="video/mp4"></video>
  </div>
  <div id="cineBlack"></div>
  <div id="overlay"></div>
  <iframe id="anim3" title="Slide 3" aria-hidden="true"></iframe>
  <iframe id="anim3b" title="Slide (tải sẵn)" aria-hidden="true" style="position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;z-index:-1;pointer-events:none;display:none"></iframe>
  <iframe id="anim3c" title="Slide (tải sẵn)" aria-hidden="true" style="position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;z-index:-1;pointer-events:none;display:none"></iframe>

  <!-- Frame 1: chỉ có chữ START -->
  <div id="start" class="loading">
    <div id="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg class="ld-heart" viewBox="0 0 9 8" shape-rendering="crispEdges"><path fill="#ff2a3a" d="M1 0h2v1h1v1h1V1h1V0h2v1h1v3H8v1H7v1H6v1H5v1H4V8H3V7H2V6H1V5H0V1h1z"/></svg>
      <div class="ld-title">LOADING<span id="ldDots"></span></div>
      <div class="ld-bar"><i class="ld-fill" id="ldFill"></i></div>
      <div class="ld-meta"><span id="ldPct">0%</span><span class="ld-task" id="ldTask">...</span></div>
      <div class="ld-warn" id="ldWarn">SOME FILES DID NOT LOAD.<br>CHECK THE CONNECTION - THE SHOW CAN STILL START.</div>
    </div>
    <button id="startBtn" class="start-btn" type="button">START</button>
  </div>

  <!-- Frame 2: 10 slide, click để chém / mở -->
  <div id="grid">
    <canvas id="deco"></canvas>
    <div class="frame"></div>
    <div class="grid-inner">
      <div class="tools">
        <button id="gearBtn" class="tool" type="button" aria-label="Settings"></button>
        <button id="heartBtn" class="tool heart" type="button" aria-label="Soul"></button>
      </div>
      <header class="grid-head">
        <h2>SELECT A SLIDE<span class="cursor">_</span></h2>
        <span>CLICK TO SLASH · BACKSPACE TO EXIT</span>
      </header>
      <div id="cards" class="cards"></div>
    </div>
    <div class="ticker"><div id="ticker-track" class="ticker-track"></div></div>
  </div>

  <!-- Bảng cài đặt (trống) -->
  <div id="settings" aria-hidden="true">
    <div class="settings-box" role="dialog" aria-label="Settings">
      <div class="settings-title">SETTINGS</div>
      <button id="settingsClose" class="settings-close" type="button" aria-label="Close">X</button>
      <div class="settings-hint">BACKSPACE · CLOSE</div>
    </div>
  </div>

  <!-- Chế độ tim xanh: màn đen + tim, lớp glitch, tim đỏ ở góc để quay về danh sách -->
  <div id="soulIntro" aria-hidden="true"><canvas id="soulHeart"></canvas></div>
  <canvas id="glitch" aria-hidden="true"></canvas>
  <button id="soulBack" type="button" aria-label="Back to list"></button>
  <button id="soulGear" type="button" aria-label="Slide list"></button>

  <!-- Bảng chọn slide cầm kiếm khi bị Sans chặn -->
  <div id="choose">
    <h3>SANS BLOCKED THE SLASH</h3>
    <p>PICK A SLIDE TO WIELD THE SWORD</p>
    <div id="picks"></div>
  </div>

  <script>
    // ================= CẤU HÌNH =================
    const slideImages = [
      'slide1.png', 'slide2.png', 'slide3.png', 'slide4.png', 'slide5.png',
      'slide6.png', 'slide7.png', 'slide8.png', 'slide9.png', 'slide10.png'
    ];
    // Thông tin hiển thị khi mở từng slide: sửa title / desc ở đây
    const SLIDE_INFO = [
      { title: 'Life in My Neighbourhood',   desc: 'Unit 4: Remembering the Past - what our neighbourhood was like 40 years ago.' },
      { title: 'Group Members',              desc: 'Presenter, Researcher, Slide Designer and Image Collector.' },
      { title: 'A Look at the Past',    desc: 'A simple lifestyle and a tight-knit community.' },
      { title: 'How People Moved Around',    desc: 'Walking and cycling; quiet streets with fewer vehicles.' },
      { title: 'Daily Life at Home',    desc: 'Basic household tools and traditional cooking on wood, straw or charcoal.' },
      { title: 'Water and Electricity', desc: 'Village water and not much electricity (oil lamps).' },

    const SLIDE_GEO = (() => {
      const base = new THREE.PlaneGeometry(SLIDE_W, SLIDE_H, TILES[0], TILES[1]).toNonIndexed();
      const pos = base.attributes.position, uv = base.attributes.uv;
      const cell = new Float32Array(pos.count * 2);
      for (let t = 0; t < pos.count; t += 3) {
        const cu = (uv.getX(t) + uv.getX(t + 1) + uv.getX(t + 2)) / 3;
        const cv = (uv.getY(t) + uv.getY(t + 1) + uv.getY(t + 2)) / 3;
        const ci = Math.min(TILES[0] - 1, Math.floor(cu * TILES[0]));
        const cj = Math.min(TILES[1] - 1, Math.floor(cv * TILES[1]));
        const ccu = (ci + 0.5) / TILES[0], ccv = (cj + 0.5) / TILES[1];
        for (let k = 0; k < 3; k++) {

    const DISSOLVE_VERT = `
      uniform float uProgress;
      attribute vec2 aCell;
      varying vec2 vUv;
      varying vec2 vPos;
      varying float vLocal;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void main() {
        vUv = uv;
        vPos = position.xy;
        vec2 idx = floor(aCell * vec2(${TILES[0]}.0, ${TILES[1]}.0));
        float t0 = hash(idx) * 0.7;
        float local = clamp((uProgress - t0) / 0.3, 0.0, 1.0);
        vLocal = local;
        vec3 p = position;
        vec2 center = vec2((aCell.x - 0.5) * ${SLIDE_W.toFixed(2)}, (aCell.y - 0.5) * ${SLIDE_H.toFixed(2)});
        float s = 1.0 - 0.7 * smoothstep(0.45, 1.0, local);
        float a = hash(idx + 7.7) * 6.2831853;
        vec2 dir = vec2(cos(a), sin(a));
        float disp = (0.15 + hash(idx + 3.1) * 0.45) * local;
        p.xy = center + (p.xy - center) * s + dir * disp;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);

      uniform sampler2D map;
      uniform vec2 uCutP;
      uniform vec2 uCutN;
      uniform float uCutSide;
      varying vec2 vUv;
      varying vec2 vPos;
      varying float vLocal;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void main() {
        float edge = 0.0;
        if (uCutSide != 0.0) {
          float sd = dot(vPos - uCutP, uCutN) * uCutSide;
          if (sd < 0.0) discard;
          edge = 1.0 - smoothstep(0.0, 0.05, sd);                // mép cắt sáng trắng
        }
        if (vLocal >= 1.0) discard;
        vec4 c = texture2D(map, vUv);
        vec4 o;
        if (vLocal > 0.2 && vLocal < 0.45) {                    // nhấp nháy đen/trắng

          o = vec4(vec3(bw), 1.0);
        } else {
          float a = vLocal <= 0.45 ? 1.0 : 1.0 - (vLocal - 0.45) / 0.55;
          if (c.a < 0.01 || a < 0.01) discard;
          o = vec4(c.rgb, c.a * a);
        }
        gl_FragColor = vec4(mix(o.rgb, vec3(1.0), edge * 0.95), o.a);

        transparent: true,
        depthWrite: false,

      const w = h * innerWidth / innerHeight;
      return Math.max(w / SLIDE_W, h / SLIDE_H) * 1.01;

      group.position.z = zIndex;
      group.scale.setScalar(coverScale());

      group.add(mesh);
      return { group, mesh };

    const fxCanvas = document.getElementById('fx');

    function resizeFx() {

    function drawMask(m, color) {
      fx.fillStyle = color;
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        if (m[y * COLS + x]) fx.fillRect(x * PX, y * PX, PX, PX);

    }

    // Vệt chém thẳng: build sẵn hình dạng từng hàng, mở dần từ trên xuống (giật cục).
    // stopRow: hàng mà vệt chém dừng lại (khi bị xương chặn)
    let slash = null;
    let flashUntil = 0;
    const FLASH_DEFAULT = 'rgba(255, 40, 60, 0.12)';
    let flashCol = FLASH_DEFAULT;
    function flash(ms, col) { flashCol = col || FLASH_DEFAULT; flashUntil = performance.now() + ms; }
    function startSlash(hitX, stopRow = ROWS) {
      const rows = new Array(ROWS);
      let x = hitX, half = 2, left = 0;
      for (let y = 0; y < ROWS; y++) {
        if (left <= 0) {
          left = 4 + ((Math.random() * 12) | 0);
          x = hitX + ((Math.random() * 7) | 0) - 3;
          half = 1 + ((Math.random() * 3) | 0);
        }
        left--;
        rows[y] = [x - half, x + half];
      }
      slash = { start: performance.now(), rows, stop: Math.max(0, Math.min(ROWS, stopRow)) };
      return rows;
    }

    function slashMask(now) {
      const e = now - slash.start;
      if (e > 450) { slash = null; return null; }
      const step = Math.floor(e / 40) * 40;
      const grow = Math.min(slash.stop, Math.ceil(ROWS * Math.min(1, step / 280)));
      const m = new Uint8Array(COLS * ROWS);
      for (let y = 0; y < grow; y++) {
        const [a, b] = slash.rows[y];
        for (let x = Math.max(0, a); x <= Math.min(COLS - 1, b); x++) m[y * COLS + x] = 1;
      }
      return m;
    }

    // ---- Vệt chém mới: lưỡi chém trắng-đỏ quét xuống rất nhanh (có đuôi mờ), rồi màn hình toạc ra một khe tối viền đỏ, tia lửa bắn ra ----
    const SLASH_SWEEP = 130, SLASH_LIFE = 820;
    function slashPath(sl, yMax) {                                   // tâm vệt chém tại từng độ cao, đi theo đường gấp khúc của rows
      const pts = [];
      for (let y = 0; y <= yMax; y += 6) {
        const r = sl.rows[Math.min(ROWS - 1, Math.floor(y / PX))];
        pts.push([((r[0] + r[1]) / 2 + 0.5) * PX, y]);
      }
      return pts;
    }
    function slashBand(pts, wfun) {                                  // dải có độ rộng thay đổi dọc đường chém
      const L = [], Rr = [], n = pts.length;
      pts.forEach(([x, y], i) => { const w = wfun(i / Math.max(1, n - 1), y); L.push([x - w, y]); Rr.push([x + w, y]); });
      const all = L.concat(Rr.reverse());
      fx.beginPath(); all.forEach(([x, y], i) => { if (i) fx.lineTo(x, y); else fx.moveTo(x, y); }); fx.closePath();
    }
    function drawSlashFx(now) {
      const e = now - slash.start; if (e > SLASH_LIFE) { slash = null; return; }
      const H = innerHeight, full = slash.stop >= ROWS - 1, yStop = H * Math.min(1, slash.stop / ROWS);
      const sweep = Math.min(1, e / SLASH_SWEEP), pr = 1 - Math.pow(1 - sweep, 2.4), yTip = yStop * pr;
      fx.save();
      // lưỡi chém: đầu nhọn ở mũi, rộng dần ở giữa, bay màu theo thời gian
      const blade = 1 - Math.max(0, Math.min(1, (e - SLASH_SWEEP * 0.9) / 260));
      if (blade > 0 && yTip > 4) {
        const pts = slashPath(slash, yTip), wmax = 22 * blade;
        const tail = (u) => Math.pow(u, 0.55);                       // đầu (u=1) nhọn, đuôi dày dần theo độ dài
        fx.shadowColor = '#ff2a3a'; fx.shadowBlur = 38 * blade;
        slashBand(pts, (u, y) => wmax * 0.9 * Math.sin(Math.min(1, (yTip - y) / 140 + 0.05) * Math.PI / 2) * Math.min(1, (yTip - y + 2) / 6 + 0.1) + 1.5);
        fx.fillStyle = 'rgba(255,42,58,' + (0.55 * blade) + ')'; fx.fill();
        fx.shadowBlur = 0;
        slashBand(pts, (u, y) => wmax * 0.32 * Math.min(1, (yTip - y + 2) / 80 + 0.1) + 1);
        fx.fillStyle = 'rgba(255,255,255,' + blade + ')'; fx.fill();
        fx.fillStyle = 'rgba(255,208,216,' + (0.9 * blade) + ')'; fx.fillRect(pts[pts.length - 1][0] - 10, yTip - 3, 20, 3);
      }
      // khe toạc ra sau cú chém: tối, viền đỏ, mở rồi khép
      if (full && e > SLASH_SWEEP * 0.8) {
        const t = e - SLASH_SWEEP * 0.8, open = easeOut3(Math.min(1, t / 160)) * (1 - Math.max(0, Math.min(1, (t - 300) / 420)));
        if (open > 0.01) {

    function drawCrescent(sb, tEnd, alpha, wMul) {

    // ================= CẢNH SANS CHẶN (gọn): bone chặn -> nhát chém đỏ xé màn hình xuyên bone -> trúng Sans (9999) -> Sans chảy máu -> đen 0.5s -> slide kế =================
    // Trình tự (ms): 0 Sans hiện; 250 bone chặn; 1000 nhát chém đỏ lao từ xa, xé màn hình, cắt đôi bone; ~1520 trúng Sans: 9999, máu;

    const SANS_SMUG = new Image(); let SANS_SMUG_F = null;
    SANS_SMUG.onload = () => { const c = document.createElement('canvas'); c.width = SANS_SMUG.width; c.height = SANS_SMUG.height; const g = c.getContext('2d'); g.drawImage(SANS_SMUG, 0, 0); g.globalCompositeOperation = 'destination-in'; const gr = g.createLinearGradient(0, 0, 0, c.height); gr.addColorStop(0, '#000'); gr.addColorStop(0.72, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height); SANS_SMUG_F = c; };
    SANS_SMUG.src = 'assets/sans-smug.png';       // mặt Sans cười nhắm mắt, đeo tai nghe (ảnh bạn gửi)
    const BONES_SND = new Audio('assets/dry-bones-death.mp3'); BONES_SND.preload = 'auto'; BONES_SND.volume = 0.9;
    const SANS_HURT = new Image();

    SANS_CUT.src = 'assets/sans-cut.png';              // Sans đứng, vết chém đỏ ngang ngực
    function outlineSprite(img, o, col) {                            // viền đen quanh sprite trắng cho dễ nhìn trên nền sáng

    const SANS_O = outlineSprite(SANS_IMG, 6, '#0b0b0b');

    const ramp = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));

    // ================= VỆT CHÉM HÌNH TRĂNG KHUYẾT (cú chém của kiếm) =================

    let cuts = [];
    function arcPoint(c, t) {

        outer.concat(inner.reverse()).forEach(([x, y], i) => {
          const qx = Math.round(x / PX) * PX, qy = Math.round(y / PX) * PX;
          if (i === 0) fx.moveTo(qx, qy); else fx.lineTo(qx, qy);
        });
        fx.closePath();
        fx.fill();
      }
      fx.globalAlpha = 1;
      return true;
    }
    // Vệt chém có trúng hình chữ nhật (thẻ) không
    function arcHits(c, r) {
      for (let k = 0; k <= 60; k++) {
        const [x, y] = arcPoint(c, -1 + 2 * k / 60);
        if (x >= r.left - 20 && x <= r.right + 20 && y >= r.top - 20 && y <= r.bottom + 20) return true;
      }
      return false;
    }

    // ================= KIẾM ĐỎ =================
    let sword = null;   // { holder, start, endAt }
    function drawSword(now) {
      if (sword.endAt && now - sword.endAt > 250) { sword = null; return; }
      const e = now - sword.start;
      let a = Math.min(1, e / 200);
      if (sword.endAt) a = Math.max(0, 1 - (now - sword.endAt) / 250);
      const r = cards[sword.holder].getBoundingClientRect();
      const rise = Math.max(0, 1 - e / 300) * 160;
      const bob = Math.sin(now / 160) * 4;
      fx.globalAlpha = a;
      fx.drawImage(SWORD_IMG,
        Math.round(r.left + r.width / 2 - SWORD_IMG.width / 2),
        Math.round(r.top + r.height / 2 - SWORD_IMG.height * 0.45 + rise + bob));
      fx.globalAlpha = 1;
    }

    function fxLoop(now) {
      fx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      if (now < flashUntil) {
        fx.fillStyle = flashCol;
        fx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
      } else flashCol = FLASH_DEFAULT;
      if (cine) drawCineBack(now);
      if (slash) drawSlashFx(now);
      if (splat) drawBlood(splat);
      if (block) drawBlock(now);
      if (cine) drawCine(now);
      if (kn) drawKnight(now);
      if (crack) drawCracks(now);
      cuts = cuts.filter(c => drawCut(c, now));
      if (sword) drawSword(now);
      if (now < dustUntil) spawnDust(6);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.age++; p.x += p.vx; p.y += p.vy;
        if (p.age > p.life) { particles.splice(i, 1); continue; }
        fx.globalAlpha = 1 - p.age / p.life;
        fx.fillStyle = p.c;
        fx.fillRect(Math.round(p.x / PX) * PX, Math.round(p.y / PX) * PX, p.s, p.s);
      }
      fx.globalAlpha = 1;
      requestAnimationFrame(fxLoop);
    }
    requestAnimationFrame(fxLoop);

    // Rung màn hình khi chém
    function shake(p = 1, reps = 5) {
      gsap.fromTo('#canvas-container', { x: 0, y: 0 }, {
        x: () => (Math.random() - 0.5) * 16 * p,
        y: () => (Math.random() - 0.5) * 10 * p,
        duration: 0.05, repeat: reps, yoyo: true, ease: 'none', repeatRefresh: true,
        onComplete: () => gsap.set('#canvas-container', { x: 0, y: 0 })
      });
    }
    // Phóng to nhẹ rồi bật về: cảm giác "lực" của nhát chém
    function punch(sc = 1.04) {
      gsap.fromTo('#canvas-container', { scale: sc }, { scale: 1, duration: 0.32, ease: 'power3.out' });
    }
    // Cú va chạm: chớp trắng + rung + phóng nhẹ. power càng lớn càng mạnh.
    function impact(power) {
      flash(60 + 45 * power, 'rgba(255, 255, 255, ' + Math.min(0.85, 0.2 + 0.25 * power).toFixed(2) + ')');
      shake(1 + power * 0.8, 5 + Math.round(power * 3));
      punch(1 + 0.025 * power);
    }

    // ================= SỐ DAMAGE (pixel font 3x5) =================
    const GLYPHS = {
      '0': ['111','101','101','101','111'], '1': ['010','110','010','010','111'],
      '2': ['111','001','111','100','111'], '3': ['111','001','111','001','111'],
      '4': ['101','101','111','001','001'], '5': ['111','100','111','001','111'],
      '6': ['111','100','111','101','111'], '7': ['111','001','010','010','010'],
      '8': ['111','101','111','101','111'], '9': ['111','101','111','001','111']
    };
    // Mỗi số là 1 canvas riêng, để nhiều số có thể hiện cùng lúc (999 ở nhiều thẻ)
    function popDamage(px, py, num) {
      const cell = Math.max(4, Math.round(innerHeight / 160));
      const s = String(num);
      const pad = 2, border = 1, gap = 1;
      const W = s.length * 3 + (s.length - 1) * gap + (pad + border) * 2;
      const H = 5 + (pad + border) * 2;
      const el = document.createElement('canvas');
      el.className = 'dmg';
      el.width = W; el.height = H;
      const g = el.getContext('2d');
      g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#ff3344'; g.fillRect(border, border, W - border * 2, H - border * 2);
      g.fillStyle = '#ffb3b9'; g.fillRect(border, border, W - border * 2, 1);
      g.fillStyle = '#000';
      let x = pad + border;
      for (const ch of s) {
        const rows = GLYPHS[ch];
        for (let y = 0; y < 5; y++) for (let i = 0; i < 3; i++) {
          if (rows[y][i] === '1') g.fillRect(x + i, pad + border + y, 1, 1);
        }
        x += 3 + gap;
      }
      el.style.width = W * cell + 'px';
      el.style.height = H * cell + 'px';
      el.style.left = (px - W * cell / 2) + 'px';
      el.style.top = (py - H * cell / 2) + 'px';
      document.body.appendChild(el);
      gsap.timeline({ onComplete: () => el.remove() })
        .fromTo(el, { scale: 0.2 }, { scale: 1.25, duration: 0.12, ease: 'back.out(3)' })
        .to(el, { scale: 1, duration: 0.08 })
        .to(el, { y: -40, opacity: 0, duration: 0.35, delay: 0.25, ease: 'power2.in' });
    }

    // ================= SLIDE BAY VÀO / PHÓNG TO =================
    // Slide bay vào từ 1 trong 4 hướng ngẫu nhiên
    const ENTRY = [
      { x: 0,  y: -4.5 },   // từ dưới lên
      { x: 0,  y:  4.5 },   // từ trên xuống
      { x: -8, y:  0   },   // từ trái sang phải
      { x:  8, y:  0   }    // từ phải sang trái
    ];

    function enterFrom(obj, onDone) {
      setProgress(obj, 0);
      const e = ENTRY[Math.floor(Math.random() * ENTRY.length)];
      obj.group.position.set(e.x, e.y, 0);
      obj.group.visible = true;
      gsap.to(obj.group.position, { x: 0, y: 0, duration: 0.95, ease: 'power3.out', onComplete: onDone });
    }

    // Thẻ được chọn phóng từ vị trí thẻ lên toàn màn hình
    function flyTo(i, done) {
      const r = cards[i].getBoundingClientRect();
      const el = document.createElement('div');
      el.className = 'fly';
      el.style.backgroundImage = 'url("' + slideImages[i] + '")';
      el.style.left = r.left + 'px';
      el.style.top = r.top + 'px';
      el.style.width = r.width + 'px';
      el.style.height = r.height + 'px';
      document.body.appendChild(el);
      gsap.to(el, {
        left: 0, top: 0, width: innerWidth, height: innerHeight, duration: 0.7, ease: 'power3.inOut',
        onComplete: () => { done(); el.remove(); }
      });
    }

    // ================= MÀN START / DANH SÁCH / CHI TIẾT =================
    // view: 'start' | 'grid' | 'busy' | 'choose' (bị chặn, chọn slide cầm kiếm) | 'detail'
    let view = 'start';
    const dead = new Set();   // các thẻ đã bị giết trong lượt chém hiện tại
    const startEl = document.getElementById('start');
    const startBtn = document.getElementById('startBtn');
    const gridEl = document.getElementById('grid');
    const cardsEl = document.getElementById('cards');
    const chooseEl = document.getElementById('choose');
    const picksEl = document.getElementById('picks');
    const tickerTrack = document.getElementById('ticker-track');
    let anim3 = document.getElementById('anim3');
    // Tải sẵn slide kế và slide trước (2 iframe ẩn, đã vẽ khung đầu, chờ lệnh 'go') để chuyển slide là chạy ngay, không bị khựng
    const POOL = [{ el: document.getElementById('anim3b'), idx: -1, ready: false }, { el: document.getElementById('anim3c'), idx: -1, ready: false }];
    const HOLD_OK = new Set([0, 2, 3, 4, 5, 6, 7, 8]);
    const A3STYLE = 'position:fixed;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:transparent;';
    function prewarm(...list) {
      const want = list.filter((i) => HOLD_OK.has(i) && ANIM_SRC[i]);
      want.forEach((i) => {
        if (POOL.some((q) => q.idx === i)) return;
        const q = POOL.find((x) => x.idx < 0) || POOL.find((x) => !want.includes(x.idx));
        if (!q) return;
        q.idx = i; q.ready = false;
        q.el.style.cssText = A3STYLE + 'opacity:0;z-index:-1;display:block';
        q.el.src = ANIM_SRC[i] + '&hold';
      });
    }
    function takePre(i) {
      const q = POOL.find((x) => x.idx === i && x.ready);
      if (!q) return false;
      const old = anim3; anim3 = q.el; q.el = old;
      old.style.cssText = 'display:none'; old.src = 'about:blank';
      anim3.style.cssText = A3STYLE + 'z-index:20;display:block;opacity:0';
      q.idx = -1; q.ready = false;
      try { anim3.contentWindow.postMessage({ type: 'go' }, '*'); } catch (e) { }
      return true;
    }
    // Slide có bản động (iframe phủ lên): slide 2 (cọ sơn + bút chì vẽ), slide 3 (gió + keo dán), slide 4 (phố xe đạp), slide 5 (bếp), slide 6 (giếng + mất điện), slide 7 (làng quê), slide 10 (cảnh kết: ghế, sân khấu, pháo hoa)
    const ANIM_SRC = { 0: 'slide1-anim.html?embed', 1: 'slide2-anim.html?embed', 2: 'slide3-anim.html?embed', 3: 'slide4-anim.html?embed', 4: 'slide5-anim.html?embed', 5: 'slide6-anim.html?embed', 6: 'slide7-anim.html?embed', 7: 'slide8-anim.html?embed', 8: 'slide9-anim.html?embed', 9: 'slide10-anim.html?embed' };
    const BLANK_SLIDE = 'assets/anim-blank.png';            // nền đen cho slide 2 lúc chưa vẽ
    const slidePath = (i) => (i === 1 || i === 9) ? BLANK_SLIDE : slideImages[i];   // slide 2 và 10 (cảnh kết) bắt đầu từ nền đen
    let animState = null, animBusyAt = 0;                     // slide 2: 'loading' | 'wait' | 'busy' | 'done'
    // Click / Enter trên slide 2 chưa vẽ xong: bắt đầu vẽ (hoặc bỏ qua cho xong ngay), chưa chuyển slide
    function animGate() {
      if ((view === 'soul' ? soul.i : currentIndex) === slideImages.length - 1 && (view === 'soul' || view === 'detail')) {   // slide 10: bắt đầu màn chú chim cuốn slide
        try { anim3.contentWindow.postMessage({ type: 'finale' }, '*'); } catch (e) { }
        return true;
      }
      const idx = view === 'soul' ? soul.i : currentIndex;
      if (idx !== 1 || animState === null || animState === 'done') return false;
      const w = anim3.contentWindow;
      if (animState === 'wait' && w) w.postMessage({ type: 'anim-start' }, '*');
      else if (animState === 'busy' && w && performance.now() - animBusyAt > 900) w.postMessage({ type: 'anim-skip' }, '*');
      return true;
    }
    // Vẽ xong: thay nền đen bằng ảnh slide 2 đầy đủ (giống hệt) để chém / tan được như các slide khác
    function animFinished() {
      let cur, set;
      if (view === 'soul' && soul.i === 1) { cur = soul.cur; set = (n) => { soul.cur = n; }; }
      else if (view === 'detail' && currentIndex === 1) { cur = currentSlideObj; set = (n) => { currentSlideObj = n; }; }
      else return;
      const n = createSlide(slideImages[1], 0);
      n.mesh.renderOrder = cur.mesh.renderOrder;
      scene.add(n.group);
      set(n);
      setTimeout(() => {
        disposeSlide(cur);
        if (animState === 'done') anim3.style.display = 'none';
      }, 350);
    }

    const TICKER_LINE = [
      "IT'S A BEAUTIFUL DAY OUTSIDE.", "SLASH A SLIDE, SEE WHAT'S INSIDE.", "ONE BONE. ONE SOUL.", "TEN SLIDES."
    ].map(t => t + "   *   ").join('');
    tickerTrack.textContent = TICKER_LINE + TICKER_LINE;

    // 10 thẻ slide
    const cards = slideImages.map((src, i) => {
      const c = document.createElement('button');
      c.type = 'button';
      c.className = 'card';
      c.innerHTML = '<img src="' + src + '" alt="">' +
        '<div class="card-meta"><span class="card-num">' + pad2(i + 1) + '</span><span class="card-title"></span></div>';
      c.querySelector('.card-title').textContent = SLIDE_INFO[i].title;
      c.addEventListener('click', () => chemFromCard(i));
      cardsEl.appendChild(c);
      return c;
    });

    // 10 nút chọn slide cầm kiếm
    const picks = slideImages.map((_, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick';
      b.textContent = pad2(i + 1);
      b.addEventListener('click', (e) => { e.stopPropagation(); pickSword(i); });
      picksEl.appendChild(b);
      return b;
    });

    // ----- Hạt trang trí nền: tim đỏ và xương bay lên -----
    const HEART_SPR = [
      ".XX.XX.",
      "XXXXXXX",
      "XXXXXXX",
      ".XXXXX.",
      "..XXX..",
      "...X..."
    ];
    const decoCanvas = document.getElementById('deco');
    const dctx = decoCanvas.getContext('2d');
    function makeDeco(initial) {
      const bone = Math.random() < 0.4;
      return {
        bone,
        x: Math.random() * innerWidth,
        y: initial ? Math.random() * innerHeight : innerHeight + 40,
        vy: -(0.25 + Math.random() * 0.6),
        sway: Math.random() * 6.28,
        s: bone ? 0.3 + Math.random() * 0.2 : 4,
        a: 0.2 + Math.random() * 0.4
      };
    }
    const decos = [];
    for (let i = 0; i < 28; i++) decos.push(makeDeco(true));
    function decoLoop(t) {
      if (gridEl.style.display === 'flex') {
        dctx.clearRect(0, 0, decoCanvas.width, decoCanvas.height);
        for (const d of decos) {
          d.y += d.vy;
          d.x += Math.sin(t / 900 + d.sway) * 0.35;
          if (d.y < -40) Object.assign(d, makeDeco(false));
          dctx.globalAlpha = d.a;
          if (d.bone) {
            dctx.drawImage(BONE_IMG, Math.round(d.x), Math.round(d.y), BONE_IMG.width * d.s, BONE_IMG.height * d.s);
          } else {
            drawHeart(d.x, d.y, d.s);
          }
        }
        dctx.globalAlpha = 1;
      }
      requestAnimationFrame(decoLoop);
    }
    function drawHeart(x, y, cell) {
      for (let r = 0; r < HEART_SPR.length; r++) for (let c = 0; c < HEART_SPR[r].length; c++) {
        if (HEART_SPR[r][c] !== 'X') continue;
        dctx.fillStyle = '#ff3344';
        dctx.fillRect(Math.round(x + c * cell), Math.round(y + r * cell), cell, cell);
      }
    }
    requestAnimationFrame(decoLoop);

    // Hiện danh sách: thẻ bay lên lần lượt, mọi thẻ đều hiện lại
    function showGrid() {
      gsap.killTweensOf(gridEl);
      gsap.killTweensOf(cards);
      dead.clear();
      cards.forEach(c => { c.style.visibility = ''; });
      gridEl.style.display = 'flex';
      decoCanvas.width = innerWidth;
      decoCanvas.height = innerHeight;
      gsap.fromTo(gridEl, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out', onComplete: () => { view = 'grid'; } });
      gsap.fromTo(cards, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.05, ease: 'power2.out', clearProps: 'transform,opacity' });
    }

    function hideGrid(onDone) {
      gsap.killTweensOf(gridEl);
      gsap.to(gridEl, { opacity: 0, duration: 0.3, ease: 'power2.in', onComplete: () => { gridEl.style.display = 'none'; if (onDone) onDone(); } });
    }

    // START: nhấp nháy, tối hẳn, rồi hiện danh sách
    let READY = false;                    // false trong lúc màn LOADING chạy: chưa cho bấm START
    function enterGrid() {
      if (view !== 'start' || !READY) return;
      view = 'busy';
      gsap.timeline()
        .to(startEl, { opacity: 0.15, duration: 0.06, repeat: 7, yoyo: true, ease: 'steps(1)' })
        .to(startEl, { opacity: 0, duration: 0.3, ease: 'power1.in' })
        .call(() => {
          startEl.style.display = 'none';
          startEl.style.opacity = 1;
          showGrid();
        });
    }

    // Danh sách (hoặc bảng chọn) → START
    function backToStart() {
      if (view !== 'grid' && view !== 'choose') return;
      view = 'busy';
      chooseEl.classList.remove('show');
      hideGrid(() => {
        startEl.style.display = 'flex';
        gsap.fromTo(startEl, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out', onComplete: () => { view = 'start'; } });
      });
    }

    // Mở slide đã phóng toàn màn hình: xem thông tin, Backspace để về danh sách
    function openSlide(i) {
      currentIndex = i;
      if (ANIM_SRC[i]) {                   // slide 2, 3: mở bản động
        animState = i === 1 ? 'loading' : null;
        if (!takePre(i)) anim3.src = ANIM_SRC[i];
        anim3.style.opacity = '1';
        anim3.style.display = 'block';
        window.focus();
      }
      currentSlideObj = createSlide(slidePath(i), 0);
      scene.add(currentSlideObj.group);
      view = 'detail';
      setTimeout(() => prewarm(i + 1, i - 1), 900);
    }

    // Giết 1 thẻ: vỡ thành mảnh, (tuỳ chọn) hiện 999
    function killCard(j, withDmg) {
      if (dead.has(j)) return;
      dead.add(j);
      const r = cards[j].getBoundingClientRect();
      shatterRect(r);
      if (withDmg) popDamage(r.left + r.width / 2, r.top + r.height / 2, 999);
      gsap.to(cards[j], {
        opacity: 0, scale: 0.85, duration: 0.25, ease: 'power2.in',
        onComplete: () => { cards[j].style.visibility = 'hidden'; }
      });
    }

    // Chém từ thẻ được click: vệt chém dọc giữa màn hình
    function chemFromCard(i) {
      if (view !== 'grid') return;
      view = 'busy';
      const hitX = Math.round((innerWidth * 0.5 + (Math.random() - 0.5) * innerWidth * 0.1) / PX);
      const cx = hitX * PX, cy = innerHeight * 0.5;
      const blocked = Math.random() < BLOCK_CHANCE;
      const rows = startSlash(hitX, blocked ? Math.floor(cy / PX) : ROWS);

      if (blocked) {
        block = { x: cx, y: cy, side: cx < innerWidth / 2 ? 1 : -1, start: performance.now(), breakAt: 1000, end: 1400, broke: false };
        setTimeout(showChoose, 1500);
        return;
      }

      // Không bị chặn: máu + 1 số damage ngẫu nhiên ở giữa, các thẻ khác tan, thẻ này phóng to
      setTimeout(() => { shake(); flash(80, 'rgba(255,255,255,0.28)'); slashSparks(rows); }, SLASH_SWEEP);
      setTimeout(() => {
        startSplat(rows);
        popDamage(cx, cy, 1 + Math.floor(Math.random() * 100));
      }, SLASH_SWEEP + 100);
      setTimeout(() => {
        dustUntil = performance.now() + DISSOLVE_MS;
        gsap.to(bloodFade, { a: 0, duration: DISSOLVE_MS / 1000, ease: 'none', onComplete: () => { splat = null; } });
        cards.forEach((_, k) => { if (k !== i) killCard(k, false); });
        prewarm(i); flyTo(i, () => openSlide(i));
        hideGrid(() => {});
      }, SLASH_SWEEP + 100 + BLOOD_TO_DISSOLVE_MS);
    }

    // Bị chặn: hiện bảng chọn slide cầm kiếm
    function showChoose() {
      block = null;
      picks.forEach((b) => { b.disabled = false; });
      chooseEl.classList.add('show');
      view = 'choose';
    }

    // Slide được chọn cầm kiếm, rồi chém vòng quanh màn hình cho tới khi không còn slide nào sống
    function pickSword(t) {
      if (view !== 'choose') return;
      view = 'busy';
      chooseEl.classList.remove('show');
      sword = { holder: t, start: performance.now(), endAt: null };
      setTimeout(swordRound, 500);
    }

    // Một vòng chém: mỗi slide còn sống có khả năng bị nhắm tới (ít nhất 1 slide)
    function swordRound() {
      if (!sword || sword.endAt) return;
      const alive = cards.map((_, k) => k).filter(k => k !== sword.holder && !dead.has(k));
      if (alive.length === 0) { finishSword(); return; }
      let targets = alive.filter(() => Math.random() < 0.7);
      if (targets.length === 0) targets = [alive[Math.floor(Math.random() * alive.length)]];
      let t = 0;
      targets.forEach((k) => { setTimeout(() => slashCard(k), t); t += 280; });
      setTimeout(swordRound, t + 150);
    }

    // Một cú chém đi qua tâm thẻ k; thẻ nào bị vệt chém trúng cũng bị giết (999)
    function slashCard(k) {
      if (!sword || sword.endAt || dead.has(k)) return;
      const r = cards[k].getBoundingClientRect();
      const cut = {
        cx: r.left + r.width / 2, cy: r.top + r.height / 2,
        dx: 0, dy: 0,
        L: Math.hypot(innerWidth, innerHeight) * 0.55,
        bend: (Math.random() < 0.5 ? -1 : 1) * (60 + Math.random() * 120),
        width: 46 + Math.random() * 26,
        color: '#ff1f3d',
        start: performance.now(), dur: 200
      };
      const ang = Math.random() * Math.PI;
      cut.dx = Math.cos(ang); cut.dy = Math.sin(ang);
      cuts.push(cut);
      setTimeout(() => {
        for (let j = 0; j < cards.length; j++) {
          if (!sword || j === sword.holder || dead.has(j)) continue;
          if (arcHits(cut, cards[j].getBoundingClientRect())) killCard(j, true);
        }
      }, 200);
    }

    // Cắt đôi slide theo đường thẳng qua (px, py) hướng (dx, dy) (toạ độ màn hình) -> 2 nửa tách ra
    function screenToLocal(px, py, group) {
      const h = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

      return [(px - innerWidth / 2) * k / sc, -(py - innerHeight / 2) * k / sc];
    }
    // ----- các lớp vẽ của cảnh (trên canvas #fx) -----

      const g = fx.createRadialGradient(c.sans.x, c.sans.y, H * 0.08, c.sans.x, c.sans.y, c.D * 0.7);
      g.addColorStop(0, 'rgba(6,3,16,' + (d * 0.3) + ')'); g.addColorStop(1, 'rgba(6,3,16,' + d + ')');

    }
    function waveS(c, t) {                                          // vị trí nhát chém dọc theo hướng d (0 = tâm bone)

    }
    function drawRift(c, t) {                                       // vết xé màn hình: dải tối viền đỏ chạy dọc đường chém
      if (t < CT.wave) return;
      const ce = t - CT.hit, s0 = -0.75 * c.D;
      const sEnd = ce < 0 ? waveS(c, t) : c.sH + 0.6 * c.D * easeOut3(ramp(ce, 0, 350));
      const a = 1 - ramp(t, CT.black - 700, CT.black - 100);
      const hwMax = (4 + 20 * ramp(t, CT.wave, CT.hit + 300)) * (1 + 0.15 * Math.sin(t / 90));
      const N = 46, L = [], Rr = [];
      for (let k = 0; k <= N; k++) {
        const s = s0 + (sEnd - s0) * k / N, e = k / N, tp = Math.min(1, e * 6) * Math.min(1, (1 - e) * 4 + (ce > 0 ? 1 : 0));
        const hw = hwMax * Math.max(0.15, tp), j1 = (hash1(c, k) - 0.5) * hw * 0.9, j2 = (hash1(c, k + 70) - 0.5) * hw * 0.9;
        const px = c.x + c.dx * s, py = c.y + c.dy * s;
        L.push([px + c.nx * (hw + j1), py + c.ny * (hw + j1)]); Rr.push([px - c.nx * (hw + j2), py - c.ny * (hw + j2)]);

    function drawWave(c, t) {
      const ce = t - CT.hit; if (t < CT.wave - 120 || ce > 140) return;
      const born = ramp(t, CT.wave - 120, CT.wave), fade = ce > 0 ? 1 - ce / 140 : 1;
      for (let i = 6; i >= 0; i--) {

    }
    function bloodBurst(c, n, spread) {

      const stage = document.getElementById('knStage'), dim = document.getElementById('knDim'), wrap = document.getElementById('knWrap'), vid = document.getElementById('knVid'), blk = document.getElementById('cineBlack');
      const f = Math.min(0.46 * H / 150, 0.92 * W / KV.w), vw = KV.w * f, vh = KV.h * f, vl = (W - vw) / 2, vtop = H * 0.5 - KV.by * f;
      const R = { x: vl + KV.sx * f, y: vtop + KV.sy * f, w: KV.sw * f, h: KV.sw * f };         // ô xanh lá nơi slide bị ép vào
      Object.assign(wrap.style, { left: vl + 'px', top: vtop + 'px', width: vw + 'px', height: vh + 'px', opacity: '0', transition: 'none', transform: 'none', clipPath: 'none' });
      Object.assign(dim.style, { left: R.x + 'px', top: R.y + 'px', width: R.w + 'px', height: R.h + 'px', opacity: '0', transition: 'opacity .6s linear' });
      stage.style.display = 'block';
      kn = { t0: performance.now(), sl0: 1e12, kx: W / 2, ky: H * 0.52 };
      try { vid.pause(); vid.currentTime = 0; } catch (e) {}
      knDrawing = true; requestAnimationFrame(knPaint);
      const hW = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), k = hW / H;
      const cxs = R.x + R.w / 2, cys = R.y + R.h / 2;
      {                                                                    // ép slide vào ô xanh (tự tween, không phụ thuộc gsap)
        const s0 = { x: cur.group.scale.x, y: cur.group.scale.y, z: cur.group.scale.z }, p0 = { x: cur.group.position.x, y: cur.group.position.y, z: cur.group.position.z }, sx1 = R.w * k / SLIDE_W, sy1 = R.h * k / SLIDE_H, px1 = (cxs - W / 2) * k, py1 = -(cys - H / 2) * k, a0 = performance.now();
        const stepSq = (now) => { const u = Math.min(1, (now - a0) / 700), e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
          cur.group.scale.set(lerp(s0.x, sx1, e), lerp(s0.y, sy1, e), s0.z); cur.group.position.set(lerp(p0.x, px1, e), lerp(p0.y, py1, e), p0.z); if (u < 1) requestAnimationFrame(stepSq); };
        requestAnimationFrame(stepSq);
      }
      dim.style.opacity = '0.35';
      await wait(650);
      wrap.style.transition = 'opacity .25s linear'; wrap.style.opacity = '1';
      const vt0 = performance.now(); vid.play().catch(() => {});
      const vnow = () => (vid.readyState > 1 && !vid.paused ? vid.currentTime : (performance.now() - vt0) / 1000);
      while (vnow() < KV.dissolveAt) await wait(30);
      tweenProgress(cur, 1, 0.8, 'none');                                    // slide bay màu khi đường trắng cắt ngang
      for (let i = 0; i < 110 && particles.length < 500; i++) {
        const an = Math.random() * 6.283, v = 1 + Math.random() * 5, rr = Math.random();
        particles.push({ x: R.x + Math.random() * R.w, y: R.y + Math.random() * R.h, vx: Math.cos(an) * v, vy: Math.sin(an) * v - 1, life: 30 + Math.random() * 40, age: 0, c: rr < 0.25 ? '#ffffff' : (rr < 0.5 ? '#ff3344' : '#e8dcc4'), s: PX * (0.3 + Math.random() * 0.45) });
      }
      while (vnow() < KV.endAt) await wait(30);
      wrap.style.transition = 'opacity .3s linear'; wrap.style.opacity = '0'; dim.style.transition = 'opacity .3s linear'; dim.style.opacity = '0';
      await wait(320);
      disposeSlide(cur); soul.cur = null;
      // hiệp sĩ hiện chính diện giữa màn hình, nhìn vào màn hình rồi vung kiếm chém
      vid.pause(); wrap.style.opacity = '0';
      const fv = document.getElementById('knVid2'), h2 = Math.min(0.72 * H, 0.9 * W * 282 / 266), w2 = h2 * 266 / 282;
      Object.assign(knCv2.style, { display: 'block', width: w2 + 'px', height: h2 + 'px', left: (W - w2) / 2 + 'px', top: (H * 0.5 - h2 * 0.5) + 'px', opacity: '0', transition: 'none' });
      try { fv.pause(); fv.currentTime = 0; } catch (e) {}
      knDrawing2 = true; requestAnimationFrame(knPaint2);
      void knCv2.offsetWidth; knCv2.style.transition = 'opacity .4s linear'; knCv2.style.opacity = '1';
      await wait(400);
      const f0 = performance.now(); fv.play().catch(() => {});
      const fnow = () => (fv.readyState > 1 && !fv.paused ? fv.currentTime : (performance.now() - f0) / 1000);
      while (fnow() < 0.55 && performance.now() - f0 < 1500) await wait(20);       // tới khoảnh khắc vung kiếm
      kn.sl0 = performance.now(); kn.kx = W / 2; kn.ky = H * 0.5;
      await wait(260);
      impact(1); shake(1.4, 8);
      makeCracks(W * 0.5, H * 0.5, 1, 0.12); const l1 = crack.lines;
      makeCracks(W * 0.3, H * 0.38, 1, -0.3); const l2 = crack.lines;
      makeCracks(W * 0.72, H * 0.64, -1, 0.4); crack.lines = crack.lines.concat(l1, l2); crack.t0 = performance.now();
      knCv2.style.transition = 'opacity .15s linear'; knCv2.style.opacity = '0';
      await wait(1500);                                                      // nứt ~1.5s
      blk.style.transition = 'opacity .12s linear'; blk.style.opacity = '1';
      await wait(140);
      fv.pause(); knDrawing2 = false; knCv2.style.display = 'none'; vid.pause(); knDrawing = false; stage.style.display = 'none';
      crack = null; kn = null; particles.length = 0;
      const next = createSlide(slidePath(ni), 0); next.mesh.renderOrder = 1; scene.add(next.group);
      soul.cur = next; soul.i = ni;
      await wait(1000);                                                      // đen 1s
      if (ANIM_SRC[ni]) showAnim3(ni);
      blk.style.transition = 'opacity .45s linear'; blk.style.opacity = '0';
      await wait(450);
    }

    // Thoát chế độ tim xanh: slide hiện tại tan, quay về danh sách
    function soulExit() {
      if (view !== 'soul') return;
      view = 'busy';
      hideAnim3Now();
      soulBack.style.display = 'none'; soulGear.style.display = 'none';
      const cur = soul.cur;
      dustUntil = performance.now() + DISSOLVE_MS;
      tweenProgress(cur, 1.0, DISSOLVE_MS / 1000, 'none', () => {
        disposeSlide(cur);
        soul.cur = null; soul.on = false;
        showGrid();
      });
    }

    soulBack.addEventListener('click', (e) => { e.stopPropagation(); soulExit(); });
    soulGear.addEventListener('click', (e) => { e.stopPropagation(); openSettings('soul'); });
    // Nhảy thẳng tới slide n từ danh sách (chế độ tim xanh): slide hiện tại tan, slide n lộ ra
    async function soulJump(n) {
      if (view !== 'settings' || settingsFrom !== 'soul') return;
      closeSettings();
      if (n === soul.i) return;
      view = 'busy';
      if (ANIM_SRC[soul.i]) hideAnim3Now();
      const cur = soul.cur, next = createSlide(slidePath(n), 0);
      next.mesh.renderOrder = 0; cur.mesh.renderOrder = 1; scene.add(next.group);
      await soulDissolve(cur);
      next.mesh.renderOrder = 1; soul.cur = next; soul.i = n;
      if (ANIM_SRC[n]) showAnim3(n);
      view = 'soul';
    }
    window.addEventListener('click', (e) => {
      if (view === 'detail' && (currentIndex === 1 || currentIndex === slideImages.length - 1)) { animGate(); return; }
      if (view !== 'soul' || e.target.closest('#soulBack') || e.target.closest('#soulGear')) return;
      if (animGate()) return;
      soulStep(1, e.clientX);
    });

    startBtn.addEventListener('click', (e) => { e.stopPropagation(); enterGrid(); });

    // ================= LOADING: tải sẵn mọi thứ rồi mới hiện nút START =================
    (function preloadAll() {
      const fill = document.getElementById('ldFill'), pctEl = document.getElementById('ldPct'), taskEl = document.getElementById('ldTask');
      const dots = document.getElementById('ldDots'), warn = document.getElementById('ldWarn'), bar = document.getElementById('loader');
      const img = (url) => () => new Promise((res, rej) => { const im = new Image(); im.onload = () => (im.decode ? im.decode().catch(() => {}) : Promise.resolve()).then(res); im.onerror = () => rej(new Error(url)); im.src = url; });
      const get = (url) => () => fetch(url, { cache: 'force-cache' }).then((r) => { if (!r.ok) throw new Error(url); return r.arrayBuffer(); });
      const font = (spec, name) => () => document.fonts.load(spec, 'Aa Ăâ').then((f) => { if (!f.length && !document.fonts.check(spec)) throw new Error(name); });
      const tasks = [];
      tasks.push(['Fonts', font("16px 'Press Start 2P'", 'font1')], ['Fonts', font("700 20px Tinos", 'font2')], ['Fonts', font("400 20px 'Public Sans'", 'font3')]);
      slideImages.forEach((p, i) => tasks.push(['Slide ' + (i + 1), img(p)]));
      ['anim-blank.png', 'sans-smug.png', 'sans-cut.png', 'sans-hurt.png', 'stage.jpg', 's3-tram.jpg', 's4-tram.jpg', 's5-kitchen.jpg', 's6-water.jpg', 's7-games.jpg', 's7-tv.jpg', 's8-past.jpg', 's8-present.jpg',
        'anim-brush.png', 'anim-pencil.png', 'icon-designer.png', 'icon-image.png', 'icon-presenter.png', 'icon-researcher.png'].forEach((f) => tasks.push(['Images', img('assets/' + f)]));
      tasks.push(['Style', get('slides.css')], ['Effects', get('fx-post.js')]);
      tasks.push(['Audio', get('assets/dry-bones-death.mp3')]);
      tasks.push(['Video 2', get('assets/knight-front.' + (document.createElement('video').canPlayType('video/webm; codecs="vp9"') ? 'webm' : 'mp4'))]);
      tasks.push(['Video', get('assets/knight-attack.' + (document.createElement('video').canPlayType('video/webm; codecs="vp9"') ? 'webm' : 'mp4'))]);
      Object.keys(ANIM_SRC).forEach((k) => tasks.push(['Animation ' + (+k + 1), get(ANIM_SRC[k].split('?')[0])]));
      const total = tasks.length;
      let done = 0, shown = 0, failed = 0, finished = false;
      const t0 = performance.now(), MIN_MS = 1200, CAP_MS = 30000;
      function paint() {
        const target = done / total, ms = performance.now() - t0;
        shown += (target - shown) * 0.18; if (target - shown < 0.002) shown = target;
        const p = Math.min(100, Math.round(shown * 100));
        fill.style.width = p + '%'; pctEl.textContent = p + '%'; bar.setAttribute('aria-valuenow', p);
        dots.textContent = '.'.repeat(1 + (Math.floor(ms / 350) % 3));
        if (shown >= 1 && ms >= MIN_MS && finished) return finish();
        requestAnimationFrame(paint);
      }
      function finish() {
        if (failed) warn.style.display = 'block';
        setTimeout(() => {
          READY = true; startEl.classList.remove('loading');
          if (typeof gsap !== 'undefined') gsap.fromTo(startBtn, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.out', clearProps: 'opacity' });
        }, failed ? 1800 : 250);
      }
      let idx = 0;
      async function worker() {
        while (idx < tasks.length) {
          const [label, fn] = tasks[idx++];
          taskEl.textContent = label.toUpperCase();
          try { await Promise.race([fn(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000))]); } catch (e) { failed++; }
          done++;
        }
      }
      Promise.all([worker(), worker(), worker(), worker()]).then(() => { finished = true; taskEl.textContent = 'READY'; });
      setTimeout(() => { if (!finished) { done = total; finished = true; failed++; } }, CAP_MS);
      requestAnimationFrame(paint);
    })();


    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (view === 'start') {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterGrid(); }
        return;
      }
      if (e.key === 'Escape' && view === 'settings') { closeSettings(); return; }
      if (view === 'soul') {                  // chế độ tim xanh: click / phím phải = tiếp, Backspace / phím trái = lùi
        if (e.key === 'Backspace' || e.key === 'ArrowLeft') { e.preventDefault(); soulStep(-1); }
        else if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          if (animGate()) return;
          soulStep(1, innerWidth * (0.45 + Math.random() * 0.1));
        }
        return;
      }
      if (e.key === 'Backspace') {
        e.preventDefault();
        if (view === 'settings') closeSettings();
        else if (view === 'grid' || view === 'choose') backToStart();
        else if (view === 'detail') closeDetail();
      } else if ((e.key === 'Enter' || e.key === ' ') && view === 'detail' && (currentIndex === 1 || currentIndex === slideImages.length - 1)) {
        e.preventDefault();
        animGate();
      }
    });

    // Phím bấm trong slide 3 (iframe) được chuyển lên đây: Backspace quay lại danh sách
    window.addEventListener('message', (ev) => {
      const d = ev.data;
      if (d && d.type === 'hold-ready') { const q = POOL.find((x) => x.el.contentWindow === ev.source); if (q) q.ready = true; return; }
      if (ev.source !== anim3.contentWindow || !d) return;
      if (d.type === 'anim-state') {
        animState = d.state;
        if (d.state === 'busy') animBusyAt = performance.now();
        if (d.state === 'done') animFinished();
        return;
      }
      if (d.type !== 'slide-key') return;
      if (d.key === 'Backspace') {
        if (view === 'detail') closeDetail();
        else if (view === 'soul') soulStep(-1);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      const k = coverScale();
      scene.children.forEach((g) => { if (g.isGroup) g.scale.setScalar(k); });
      resizeFx();
      if (glitch.on) { glitchCv.width = innerWidth; glitchCv.height = innerHeight; }
    });

    (function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
      if (glitch.on) drawGlitch(performance.now());      // phải vẽ ngay sau render để còn lấy được ảnh WebGL
    })();
  </script>
