<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Critical Slash Slide Presentation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background-color: #030303; font-family: 'Courier New', Courier, monospace; }
    #canvas-container { width: 100vw; height: 100vh; position: relative; }
    
    /* Sân khấu 200x198 giống hệt khung gif mẫu, phóng to theo màn hình (JS đặt scale) */
    #fx {
      position: absolute; top: 50%; left: 50%;
      width: 200px; height: 198px;
      transform-origin: 0 0;
      pointer-events: none; z-index: 10;
    }
    #fx img { position: absolute; display: none; image-rendering: pixelated; pointer-events: none; }
    .slash-effect { z-index: 10; }
    .damage-text { z-index: 20; }

    .ui-layer {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.4); font-size: 14px; pointer-events: none; z-index: 30;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div class="ui-layer">Click chuột hoặc bấm Space để tung chiêu Chém Slide!</div>
  <div id="canvas-container">
    <div id="fx">
      <img id="slash" class="slash-effect" alt="">
      <img id="damage" class="damage-text" alt="">
    </div>
  </div>

  <script>
    // Danh sách đủ 10 slide của bạn
    const slideImages = [
      'slide1.png', 'slide2.png', 'slide3.png', 'slide4.png', 'slide5.png',
      'slide6.png', 'slide7.png', 'slide8.png', 'slide9.png', 'slide10.png'
    ];
    let currentIndex = 0;
    let isAnimating = false;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5.2; // Đặt cự ly để slide lấp đầy màn hình nhất có thể

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
    scene.add(ambientLight);

    const textureLoader = new THREE.TextureLoader();

    // Mẹo: Để ảnh không bị dư, hãy đảm bảo ảnh của bạn có tỷ lệ rộng:cao gần với 16:9
    function createSlicedSlide(texturePath, zIndex) {
      const group = new THREE.Group();
      group.position.z = zIndex;

      // Tăng kích thước slide đáng kể
      const width = 7.5; 
      const height = 4.2; 
      const texture = textureLoader.load(texturePath);

      // Nửa Trái
      const leftGeo = new THREE.PlaneGeometry(width / 2, height);
      leftGeo.translate(-width / 4, 0, 0);
      const leftUv = leftGeo.attributes.uv;
      for (let i = 0; i < leftUv.count; i++) leftUv.setX(i, leftUv.getX(i) * 0.5);
      const leftMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true });
      const leftPiece = new THREE.Mesh(leftGeo, leftMat);
      leftPiece.position.x = width / 4;

      // Nửa Phải
      const rightGeo = new THREE.PlaneGeometry(width / 2, height);
      rightGeo.translate(width / 4, 0, 0);
      const rightUv = rightGeo.attributes.uv;
      for (let i = 0; i < rightUv.count; i++) rightUv.setX(i, 0.5 + rightUv.getX(i) * 0.5);
      const rightMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true });
      const rightPiece = new THREE.Mesh(rightGeo, rightMat);
      rightPiece.position.x = -width / 4;

      group.add(leftPiece);
      group.add(rightPiece);
      return { group, leftPiece, rightPiece };
    }

    let currentSlideObj = createSlicedSlide(slideImages[currentIndex], 0);
    scene.add(currentSlideObj.group);

    let nextSlideObj = (currentIndex + 1 < slideImages.length) 
      ? createSlicedSlide(slideImages[currentIndex + 1], -1.5) 
      : null;
    if (nextSlideObj) scene.add(nextSlideObj.group);

    const DMG_SRC = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKEAAAAhBAMAAABDz9ZdAAAAMFBMVEX8Pj4CAAD/REQuDg7HMTGXPj53Hh5rKyupKyvVWFhOExM0FRWIIiIAAAAAAAAAAADFUnuSAAAAEHRSTlP/////////////////AAAAzZ+UhgAAAodJREFUeNq1lr1rFEEYh5/bW+/Ok6BCQIIiy4uIHwT/hFyRVkxhaYgBtRHkGgutAlY2IdiIjdgJHoT8CYJgIR5YWQ6DIElhwMqPfEwsZudj95LVYt3umX1n9vf+5n1ntiU0+1gaf1qNa2wByaLWlFlzyHuVlwIqiORNKhShBf3LceT6ygQrOZmY9BFkeSNw9z28GwZsf9Nkufmty9+psDVTEdqAtjFArQ1lPWLnhOjM0KvJQgmoKRM4q27kEP09ZU2Wm9qd05DNRt7T9T5qyAzQv+VSeu6V3UlY5XBxAMCVYbH1xxfd+i9R5w10bgOw8wopNO6O3ELBrcBKrDGznHUDS16HdZyBNQIzDre6QaOrM1WpOyVgNSp3yU/WqboAoOc89wka0aUypRW40Jh+DCkv7j4gwFb0sRpwIMnOqHzSfV8sOB/jfK9xf97Z8roYj1xovDkNQA7i8nUB++vOx80bAOxuBI2F0dHFUUXjfUcj0CDwM5mg59gZJRpVfVsrya05MutD61EZftVWuFG1PVBRJJDlpivpUQUpK7HGXEsUCNBPAqwRlaDz8cc9v8WPUII1CVsNe5/XioFLC2jg4Qu/xGNAb/rXb0yx1/LUZ+BKOWUANeMHlorUPPcBCK9DzwSns6mS8z6bcHhJZWtcz8T5oWdCeaptlFgj9eYn9dwpY+iZLwPffNtYTYmVgA1TBmuZkAR0vpLi8mqh8WBc6cFx5Xw87ctnwZ2PT1ZL8Yv+khj7euw1eMm7euRvt8JRNv5zz/RKPaO1MTVd+CznVHKxOY3H5uPQ23jyeFbn7n4KfHUF5EwMaD+A6QQ/iG6Vq8OaenY/DeXLV/if/xTQ8HLFv5k1jWr8A9oHAHGFf/CnAAAAAElFTkSuQmCC";
    const damageFrames = [{"x": 29, "y": 76, "w": 161, "h": 33, "ms": 200, "src": DMG_SRC}, {"x": 40, "y": 68, "w": 161, "h": 33, "ms": 200, "src": DMG_SRC}, {"x": 37, "y": 57, "w": 161, "h": 33, "ms": 200, "src": DMG_SRC}, {"x": 15, "y": 60, "w": 161, "h": 33, "ms": 200, "src": DMG_SRC}, {"x": 6, "y": 73, "w": 161, "h": 33, "ms": 200, "src": DMG_SRC}, {"x": 21, "y": 84, "w": 161, "h": 33, "ms": 200, "src": DMG_SRC}, {"x": 24, "y": 68, "w": 161, "h": 33, "ms": 200, "src": DMG_SRC}];

    const fxEl = document.getElementById('fx');
    function layoutFx() {
      const s = Math.max(1, Math.floor(Math.min(window.innerHeight * 0.9 / 198, window.innerWidth * 0.95 / 200)));
      fxEl.style.transform = 'scale(' + s + ') translate(-100px, -99px)';
    }
    layoutFx();

    let fxToken = 0;
    function showFrame(el, f) {
      el.src = f.src;
      el.style.left = f.x + 'px'; el.style.top = f.y + 'px';
      el.style.width = f.w + 'px'; el.style.height = f.h + 'px';
      el.style.display = 'block';
    }

    // Phát đúng chuỗi gif: vệt máu rơi + bắn tung (5 frame x 100ms), sau đó số 99999 rung (7 frame x 200ms)
    function playPixelSlashAnimation(callback) {
      const slashEl = document.getElementById('slash');
      const damageEl = document.getElementById('damage');
      const token = ++fxToken;
      slashEl.style.display = 'none';
      damageEl.style.display = 'none';
      let t = 0;
      slashFrames.forEach((f) => {
        setTimeout(() => { if (token === fxToken) showFrame(slashEl, f); }, t);
        t += f.ms;
      });
      setTimeout(() => { if (token === fxToken) slashEl.style.display = 'none'; }, t);
      damageFrames.forEach((f) => {
        setTimeout(() => { if (token === fxToken) showFrame(damageEl, f); }, t);
        t += f.ms;
      });
      setTimeout(() => {
        if (token === fxToken) { damageEl.style.display = 'none'; if (callback) callback(); }
      }, t);
    }

    function nextSlide() {
      if (isAnimating || currentIndex >= slideImages.length - 1) return;
      isAnimating = true;

      // 1. Chạy hiệu ứng chém frame-by-frame pixel (lúc này bạn sẽ thấy vệt chém giật cục)
      playPixelSlashAnimation(() => {});

      // 2. Số damage 99999 đã được phát cùng chuỗi frame ở bước 1

      // 3. Tách đôi slide và rơi xuống
      const { leftPiece, rightPiece, group } = currentSlideObj;
      const duration = 1.0; // Tăng tốc độ rơi

      gsap.to(leftPiece.position, {
        y: -7, x: leftPiece.position.x - 1.5,
        duration: duration, delay: 0.05, ease: "power2.in"
      });
      gsap.to(leftPiece.rotation, {
        z: 0.3, x: 0.2,
        duration: duration, delay: 0.05, ease: "power2.in"
      });

      gsap.to(rightPiece.position, {
        y: -7, x: rightPiece.position.x + 1.5,
        duration: duration, delay: 0.05, ease: "power2.in"
      });
      gsap.to(rightPiece.rotation, {
        z: -0.3, x: -0.2,
        duration: duration, delay: 0.05, ease: "power2.in"
      });

      // 4. Slide sau tiến lên
      if (nextSlideObj) {
        gsap.to(nextSlideObj.group.position, {
          z: 0, duration: 0.8, delay: 0.15, ease: "power2.out",
          onComplete: () => {
            scene.remove(group);
            currentIndex++;
            currentSlideObj = nextSlideObj;
            nextSlideObj = (currentIndex + 1 < slideImages.length)
              ? createSlicedSlide(slideImages[currentIndex + 1], -1.5)
              : null;
            if (nextSlideObj) scene.add(nextSlideObj.group);
            isAnimating = false;
          }
        });
      }
    }

    window.addEventListener('click', nextSlide);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      layoutFx();
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
