<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Critical Slash Slide Presentation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background-color: #030303; font-family: 'Courier New', Courier, monospace; }
    #canvas-container { width: 100vw; height: 100vh; position: relative; }
    
    /* Vệt chém Pixel đổi shape theo từng frame giật cục chính xác chuẩn game retro */
    .slash-effect {
      position: absolute;
      top: 50%; left: 50%;
      width: 32px; height: 130vh;
      background: #ff3344;
      border: 4px solid #000000;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      opacity: 0;
    }

    /* Khung số 99999 chuẩn kiểu Game RPG Pixel */
    .damage-text {
      position: absolute;
      top: 38%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background-color: #ff3344;
      color: #000000;
      border: 4px solid #000000;
      padding: 8px 20px;
      font-size: 60px;
      font-weight: 900;
      letter-spacing: 4px;
      box-shadow: 5px 5px 0px #000000;
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
    }

    .ui-layer {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.5); font-size: 13px; pointer-events: none; z-index: 30;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div class="ui-layer">Click chuột hoặc bấm Space để tung chiêu Chém Slide!</div>
  <div id="canvas-container">
    <div id="slash" class="slash-effect"></div>
    <div id="damage" class="damage-text">99999</div>
  </div>

  <script>
    // Danh sách đủ 10 slide của bạn
    const slideImages = [
      'slide1.png', 'slide2.png', 'slide3.png', 'slide4.png', 'slide5.png',
      'slide6.png', 'slide7.png', 'slide8.png', 'slide9.png', 'slide10.png'
    ];
    let currentIndex = 0;
    let isAnimating = false;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5.2; // Đặt cự ly để slide to rõ, lấp đầy màn hình

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
    scene.add(ambientLight);

    const textureLoader = new THREE.TextureLoader();

    function createSlicedSlide(texturePath, zIndex) {
      const group = new THREE.Group();
      group.position.z = zIndex;

      // Phóng to kích thước slide để hiển thị lớn hơn, không bị lọt thỏm
      const width = 7.2;
      const height = 4.05; 
      const texture = textureLoader.load(texturePath);

      // Nửa Trái
      const leftGeo = new THREE.PlaneGeometry(width / 2, height);
      leftGeo.translate(-width / 4, 0, 0);
      const leftUv = leftGeo.attributes.uv;
      for (let i = 0; i < leftUv.count; i++) leftUv.setX(i, leftUv.getX(i) * 0.5);
      const leftMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true });
      const leftPiece = new THREE.Mesh(leftGeo, leftMat);
      leftPiece.position.x = width / 4;

      // Nửa Phải
      const rightGeo = new THREE.PlaneGeometry(width / 2, height);
      rightGeo.translate(width / 4, 0, 0);
      const rightUv = rightGeo.attributes.uv;
      for (let i = 0; i < rightUv.count; i++) rightUv.setX(i, 0.5 + rightUv.getX(i) * 0.5);
      const rightMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true });
      const rightPiece = new THREE.Mesh(rightGeo, rightMat);
      rightPiece.position.x = -width / 4;

      group.add(leftPiece);
      group.add(rightPiece);
      return { group, leftPiece, rightPiece };
    }

    let currentSlideObj = createSlicedSlide(slideImages[currentIndex], 0);
    scene.add(currentSlideObj.group);

    let nextSlideObj = (currentIndex + 1 < slideImages.length) 
      ? createSlicedSlide(slideImages[currentIndex + 1], -1.5) 
      : null;
    if (nextSlideObj) scene.add(nextSlideObj.group);

    // Chuỗi các Frame clip-path tạo hiệu ứng pixel xuất hiện giật cục đúng chuẩn video mẫu
    const pixelSlashFrames = [
      'polygon(40% 0%, 60% 0%, 60% 15%, 40% 15%)', // Frame 1: Chấm điểm pixel đầu
      'polygon(30% 0%, 70% 0%, 70% 35%, 30% 35%, 30% 15%, 50% 15%)', // Frame 2: Lớn dần xuống trên
      'polygon(20% 0%, 80% 0%, 80% 65%, 40% 65%, 40% 35%, 60% 35%)', // Frame 3: Cán sâu xuống giữa
      'polygon(10% 0%, 90% 0%, 90% 90%, 20% 90%, 20% 50%, 60% 50%)', // Frame 4: Gần chạm đáy
      'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)' // Frame 5: Khung chém răng cưa hoàn chỉnh
    ];

    function playPixelSlashAnimation(callback) {
      const slashEl = document.getElementById('slash');
      slashEl.style.opacity = '1';
      let frameIndex = 0;

      // Tốc độ chuyển frame cực nhanh (30ms/frame) tạo độ giật cục đặc trưng game thùng
      const interval = setInterval(() => {
        if (frameIndex < pixelSlashFrames.length) {
          slashEl.style.clipPath = pixelSlashFrames[frameIndex];
          frameIndex++;
        } else {
          clearInterval(interval);
          slashEl.style.opacity = '0';
          if (callback) callback();
        }
      }, 30);
    }

    function nextSlide() {
      if (isAnimating || currentIndex >= slideImages.length - 1) return;
      isAnimating = true;

      const damageEl = document.getElementById('damage');

      // 1. Chạy hiệu ứng chém frame-by-frame pixel
      playPixelSlashAnimation(() => {});

      // 2. Hiệu ứng nảy số damage 99999 đồng bộ
      gsap.timeline()
        .set(damageEl, { scale: 0.2, opacity: 1, y: 0 })
        .to(damageEl, { scale: 1.35, duration: 0.12, ease: "back.out(3)" })
        .to(damageEl, { scale: 1, duration: 0.08 })
        .to(damageEl, { y: -60, opacity: 0, duration: 0.35, delay: 0.15, ease: "power2.in" });

      // 3. Tách đôi slide và rơi xuống dưới
      const { leftPiece, rightPiece, group } = currentSlideObj;
      const duration = 1.0;

      gsap.to(leftPiece.position, {
        y: -7, x: leftPiece.position.x - 1.5,
        duration: duration, delay: 0.05, ease: "power2.in"
      });
      gsap.to(leftPiece.rotation, {
        z: 0.3, x: 0.2,
        duration: duration, delay: 0.05, ease: "power2.in"
      });

      gsap.to(rightPiece.position, {
        y: -7, x: rightPiece.position.x + 1.5,
        duration: duration, delay: 0.05, ease: "power2.in"
      });
      gsap.to(rightPiece.rotation, {
        z: -0.3, x: -0.2,
        duration: duration, delay: 0.05, ease: "power2.in"
      });

      // 4. Slide tiếp theo tiến lên trung tâm
      if (nextSlideObj) {
        gsap.to(nextSlideObj.group.position, {
          z: 0, duration: 0.8, delay: 0.15, ease: "power2.out",
          onComplete: () => {
            scene.remove(group);
            currentIndex++;
            currentSlideObj = nextSlideObj;
            nextSlideObj = (currentIndex + 1 < slideImages.length)
              ? createSlicedSlide(slideImages[currentIndex + 1], -1.5)
              : null;
            if (nextSlideObj) scene.add(nextSlideObj.group);
            isAnimating = false;
          }
        });
      }
    }

    window.addEventListener('click', nextSlide);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
