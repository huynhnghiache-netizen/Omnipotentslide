<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Critical Slash Slide Presentation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background-color: #030303; font-family: 'Courier New', Courier, monospace; }
    #canvas-container { width: 100vw; height: 100vh; position: relative; }
    #fx {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 10; image-rendering: pixelated;
    }
    #dmg {
      position: fixed; display: none; pointer-events: none; z-index: 20;
      image-rendering: pixelated; transform-origin: 50% 50%;
      filter: drop-shadow(4px 4px 0 #000);
    }
    /* Lớp đồ họa phủ: vignette tối 4 góc + scanline mờ kiểu màn hình retro */
    #overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 25;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 100%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 3px);
    }

    /* ===== Frame 1: START ===== */
    #start {
      position: fixed; inset: 0; z-index: 40;
      display: flex; align-items: center; justify-content: center;
      background: #050205;
    }
    .start-btn {
      position: relative; z-index: 1;
      font-family: 'Press Start 2P', monospace; font-size: clamp(22px, 5vw, 48px);
      letter-spacing: 4px; color: #fff; background: none; border: none; cursor: pointer;
      text-shadow: 4px 4px 0 #8a0016, 8px 8px 0 #000;
      animation: pulse 1.6s ease-in-out infinite;
      transition: color 0.15s, transform 0.15s;
    }
    .start-btn:hover { color: #ff3344; transform: scale(1.05); }
    .start-btn:focus-visible { outline: 3px dashed #ffb3b9; outline-offset: 14px; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ===== Frame 2: DANH SÁCH 10 SLIDE ===== */
    #grid {
      position: fixed; inset: 0; z-index: 5; display: none;
      overflow-y: auto; padding: 56px 40px 40px;
      background: radial-gradient(ellipse at 50% 0%, #2a0810 0%, #0b0304 60%, #000 100%);
    }
    .grid-head {
      max-width: 1200px; margin: 0 auto 28px;
      display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }
    .grid-head h2 {
      font-family: 'Press Start 2P', monospace; font-weight: 400; font-size: clamp(16px, 2.6vw, 26px);
      color: #fff; text-shadow: 4px 4px 0 #8a0016, 8px 8px 0 #000;
    }
    .grid-head span { font-size: 12px; letter-spacing: 1px; color: rgba(255, 255, 255, 0.5); text-shadow: 2px 2px 0 #000; }
    .cards {
      max-width: 1200px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px;
    }
    .card {
      position: relative; padding: 0; text-align: left; cursor: pointer;
      font: inherit; color: #fff; background: #111;
      border: 3px solid #000; box-shadow: 0 6px 0 #000;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    }
    .card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
    .card-meta {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 10px 12px; background: #0a0a0a; border-top: 3px solid #000;
    }
    .card-num { font-family: 'Press Start 2P', monospace; font-size: 10px; color: #ff3344; }
    .card-title { font-size: 13px; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card:hover { transform: translateY(-4px); border-color: #ff3344; box-shadow: 0 10px 0 #000, 0 0 18px rgba(255, 51, 68, 0.45); }
    .card:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
    .card:focus-visible { outline: 3px dashed #ffb3b9; outline-offset: 4px; }

    /* ===== Chi tiết slide: thông tin nằm dưới màn hình ===== */
    .detail {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; pointer-events: none;
      padding: 90px 48px 40px; color: #fff;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.6) 55%, transparent 100%);
      opacity: 0; transform: translateY(30px); transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .detail.show { opacity: 1; transform: none; }
    .info { max-width: 720px; text-shadow: 3px 3px 0 #000; }
    .info-num { font-family: 'Press Start 2P', monospace; font-size: 11px; letter-spacing: 2px; color: #ff3344; }
    .info h2 {
      font-family: 'Press Start 2P', monospace; font-weight: 400; font-size: clamp(18px, 3vw, 32px);
      line-height: 1.3; margin: 14px 0 12px;
    }
    .info p { font-size: 15px; line-height: 1.6; color: rgba(255, 255, 255, 0.75); }
    .info-hint {
      margin-top: 18px; font-family: 'Press Start 2P', monospace; font-size: 9px;
      letter-spacing: 1px; color: rgba(255, 255, 255, 0.4);
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <canvas id="fx"></canvas>
  <canvas id="dmg"></canvas>
  <div id="overlay"></div>

  <!-- Frame 1: chỉ có chữ START -->
  <div id="start">
    <button id="startBtn" class="start-btn" type="button">START</button>
  </div>

  <!-- Frame 2: 10 slide, click để xem -->
  <div id="grid">
    <header class="grid-head">
      <h2>CHỌN SLIDE</h2>
      <span>CLICK để xem · BACKSPACE để thoát</span>
    </header>
    <div id="cards" class="cards"></div>
  </div>

  <!-- Thông tin của slide đang xem -->
  <div id="detail" class="detail">
    <div class="info">
      <div id="info-num" class="info-num"></div>
      <h2 id="info-title"></h2>
      <p id="info-desc"></p>
      <div class="info-hint">BACKSPACE · VỀ DANH SÁCH</div>
    </div>
  </div>

  <script>
    // ================= CẤU HÌNH =================
    const slideImages = [
      'slide1.png', 'slide2.png', 'slide3.png', 'slide4.png', 'slide5.png',
      'slide6.png', 'slide7.png', 'slide8.png', 'slide9.png', 'slide10.png'
    ];
    // Thông tin hiển thị khi click từng slide: sửa title / desc ở đây
    const SLIDE_INFO = slideImages.map((_, i) => ({
      title: 'Slide ' + (i + 1),
      desc: 'Thông tin chi tiết của slide ' + (i + 1) + '. Sửa nội dung này trong SLIDE_INFO ở đầu file.'
    }));
    const PX = 8;                     // kích thước 1 "pixel" của vệt chém và bụi
    const BLOOD_PX = PX * 2.5;        // kích thước 1 "pixel" của vết máu
    const SLIDE_W = 7.5, SLIDE_H = 4.2;
    const TILES = [80, 45];           // số ô vỡ của slide (ngang x dọc)
    const DISSOLVE_MS = 1500;         // thời gian slide tan xong
    const BLOOD_TO_DISSOLVE_MS = 1000; // vết máu hiện xong, 1 giây sau mới chuyển

    // ================= THREE.JS =================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
    camera.position.z = 5.2;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 1.3));

    // Cache texture: mỗi ảnh chỉ load 1 lần
    const texCache = {};
    function getTex(path) {
      if (!texCache[path]) {
        const t = new THREE.TextureLoader().load(path);
        t.minFilter = THREE.LinearFilter;
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        texCache[path] = t;
      }
      return texCache[path];
    }

    // Geometry dùng chung cho mọi slide: mỗi ô là 1 quad riêng, có thuộc tính aCell = tâm ô
    // => mỗi ô bay/thu nhỏ độc lập, không làm méo cả tấm slide
    const SLIDE_GEO = (() => {
      const base = new THREE.PlaneGeometry(SLIDE_W, SLIDE_H, TILES[0], TILES[1]).toNonIndexed();
      const pos = base.attributes.position, uv = base.attributes.uv;
      const cell = new Float32Array(pos.count * 2);
      for (let t = 0; t < pos.count; t += 3) {
        const cu = (uv.getX(t) + uv.getX(t + 1) + uv.getX(t + 2)) / 3;
        const cv = (uv.getY(t) + uv.getY(t + 1) + uv.getY(t + 2)) / 3;
        const ci = Math.min(TILES[0] - 1, Math.floor(cu * TILES[0]));
        const cj = Math.min(TILES[1] - 1, Math.floor(cv * TILES[1]));
        const ccu = (ci + 0.5) / TILES[0], ccv = (cj + 0.5) / TILES[1];
        for (let k = 0; k < 3; k++) {
          cell[(t + k) * 2] = ccu;
          cell[(t + k) * 2 + 1] = ccv;
        }
      }
      base.setAttribute('aCell', new THREE.BufferAttribute(cell, 2));
      return base;
    })();

    // Shader tan: mỗi ô có thời điểm bắt đầu ngẫu nhiên trên toàn slide.
    // local 0 → 1: ô nhấp nháy đen/trắng kiểu mosaic, thu nhỏ, bay nhẹ theo hướng ngẫu nhiên rồi mờ dần.
    const DISSOLVE_VERT = `
      uniform float uProgress;
      attribute vec2 aCell;
      varying vec2 vUv;
      varying float vLocal;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void main() {
        vUv = uv;
        vec2 idx = floor(aCell * vec2(${TILES[0]}.0, ${TILES[1]}.0));
        float t0 = hash(idx) * 0.7;
        float local = clamp((uProgress - t0) / 0.3, 0.0, 1.0);
        vLocal = local;
        vec3 p = position;
        vec2 center = vec2((aCell.x - 0.5) * ${SLIDE_W.toFixed(2)}, (aCell.y - 0.5) * ${SLIDE_H.toFixed(2)});
        float s = 1.0 - 0.7 * smoothstep(0.45, 1.0, local);
        float a = hash(idx + 7.7) * 6.2831853;
        vec2 dir = vec2(cos(a), sin(a));
        float disp = (0.15 + hash(idx + 3.1) * 0.45) * local;
        p.xy = center + (p.xy - center) * s + dir * disp;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`;

    const DISSOLVE_FRAG = `
      uniform sampler2D map;
      varying vec2 vUv;
      varying float vLocal;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void main() {
        if (vLocal >= 1.0) discard;
        vec4 c = texture2D(map, vUv);
        if (vLocal > 0.2 && vLocal < 0.45) {                    // nhấp nháy đen/trắng
          float bw = step(0.5, hash(floor(vUv * vec2(${TILES[0]}.0, ${TILES[1]}.0)) + 3.3));
          gl_FragColor = vec4(vec3(bw), 1.0);
          return;
        }
        float a = vLocal <= 0.45 ? 1.0 : 1.0 - (vLocal - 0.45) / 0.55;
        if (c.a < 0.01 || a < 0.01) discard;
        gl_FragColor = vec4(c.rgb, c.a * a);
      }`;

    function makeDissolveMat(tex) {
      return new THREE.ShaderMaterial({
        uniforms: { map: { value: tex }, uProgress: { value: 0 } },
        vertexShader: DISSOLVE_VERT,
        fragmentShader: DISSOLVE_FRAG,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      });
    }

    function createSlide(texturePath, zIndex) {
      const group = new THREE.Group();
      group.position.z = zIndex;
      const mesh = new THREE.Mesh(SLIDE_GEO, makeDissolveMat(getTex(texturePath)));
      group.add(mesh);
      return { group, mesh };
    }

    function setProgress(obj, v) { obj.mesh.material.uniforms.uProgress.value = v; }
    function tweenProgress(obj, to, dur, ease, onComplete) {
      return gsap.to(obj.mesh.material.uniforms.uProgress, { value: to, duration: dur, ease: ease, onComplete: onComplete });
    }

    function disposeSlide(obj) {
      obj.mesh.material.dispose();           // geometry dùng chung, không dispose
      scene.remove(obj.group);
    }

    let currentSlideObj = null;   // slide đang xem ở frame chi tiết

    // ================= LỚP PIXEL (canvas 2D) =================
    const fxCanvas = document.getElementById('fx');
    const fx = fxCanvas.getContext('2d');
    let COLS = 0, ROWS = 0;
    function resizeFx() {
      fxCanvas.width = innerWidth;
      fxCanvas.height = innerHeight;
      COLS = Math.ceil(innerWidth / PX);
      ROWS = Math.ceil(innerHeight / PX);
    }
    resizeFx();

    function drawMask(m, color) {
      fx.fillStyle = color;
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        if (m[y * COLS + x]) fx.fillRect(x * PX, y * PX, PX, PX);
      }
    }

    // Vệt chém: build sẵn hình dạng từng hàng, mở dần từ trên xuống theo bước 40ms (giật cục)
    let slash = null;
    let flashUntil = 0;
    function startSlash(hitX) {
      const rows = new Array(ROWS);
      let x = hitX, half = 2, left = 0;
      for (let y = 0; y < ROWS; y++) {
        if (left <= 0) {
          left = 4 + ((Math.random() * 12) | 0);
          x = hitX + ((Math.random() * 7) | 0) - 3;
          half = 1 + ((Math.random() * 3) | 0);
        }
        left--;
        rows[y] = [x - half, x + half];
      }
      slash = { start: performance.now(), rows };
      return rows;
    }

    function slashMask(now) {
      const e = now - slash.start;
      if (e > 450) { slash = null; return null; }
      const step = Math.floor(e / 40) * 40;
      const grow = Math.min(ROWS, Math.ceil(ROWS * Math.min(1, step / 280)));
      const m = new Uint8Array(COLS * ROWS);
      for (let y = 0; y < grow; y++) {
        const [a, b] = slash.rows[y];
        for (let x = Math.max(0, a); x <= Math.min(COLS - 1, b); x++) m[y * COLS + x] = 1;
      }
      return m;
    }

    // Vết máu: vệt đỏ chạy từ mép trên tới mép dưới màn hình, hơi nghiêng như ảnh mẫu, có lõi sáng và giọt chảy
    let splat = null;
    const bloodFade = { a: 1 };
    function startSplat(hitXpx, hitYpx) {
      const bc = Math.ceil(innerWidth / BLOOD_PX), br = Math.ceil(innerHeight / BLOOD_PX);
      const body = new Uint8Array(bc * br), core = new Uint8Array(bc * br);
      const set = (m, x, y) => { if (x >= 0 && y >= 0 && x < bc && y < br) m[y * bc + x] = 1; };

      const hx = hitXpx / BLOOD_PX, hy = hitYpx / BLOOD_PX;
      const top = -1, len = br + 2;                      // bắt đầu ngoài mép trên, kết thúc ngoài mép dưới
      const lean = -(0.25 + Math.random() * 0.2);        // nghiêng: trên lệch phải, dưới lệch trái
      let xf = hx + lean * (top - hy), w = 2;            // đi qua điểm chém

      for (let i = 0; i < len; i++) {
        const y = top + i;
        xf += lean;
        if (Math.random() < 0.2) w = Math.max(1, Math.min(3, w + (Math.random() < 0.5 ? -1 : 1)));
        const x = Math.round(xf + (Math.random() < 0.15 ? (Math.random() < 0.5 ? -1 : 1) : 0));
        const taper = i > len * 0.92 ? 0 : 1;            // chỉ nhọn đuôi ở rất cuối
        for (let dx = -w * taper; dx <= w * taper; dx++) {
          set(body, x + dx, y);
          if (dx === 0) set(core, x + dx, y);
        }
        if (Math.random() < 0.05) for (let k = 1; k <= 4; k++) set(body, x, y + k);   // giọt chảy
      }
      splat = { body, core, bc, br };
      bloodFade.a = 1;
    }

    function drawBlood(s) {
      fx.globalAlpha = bloodFade.a;
      for (let y = 0; y < s.br; y++) for (let x = 0; x < s.bc; x++) {
        const i = y * s.bc + x;
        if (!s.body[i]) continue;
        fx.fillStyle = '#8a0016';
        fx.fillRect(x * BLOOD_PX, y * BLOOD_PX, BLOOD_PX, BLOOD_PX);
        if (s.core[i]) {
          fx.fillStyle = '#ff3344';
          fx.fillRect(x * BLOOD_PX + 4, y * BLOOD_PX, BLOOD_PX - 8, BLOOD_PX);
        }
      }
      fx.globalAlpha = 1;
    }

    // Bụi bay lên
    const particles = [];
    let dustUntil = 0;
    function spawnDust(n) {
      for (let i = 0; i < n && particles.length < 500; i++) {
        const r = Math.random();
        particles.push({
          x: innerWidth * (0.1 + Math.random() * 0.8),
          y: innerHeight * (0.1 + Math.random() * 0.8),
          vx: (Math.random() - 0.5) * 1.6,
          vy: (Math.random() - 0.5) * 1.6,
          life: 50 + Math.random() * 50, age: 0,
          c: r < 0.12 ? '#ff3344' : (r < 0.56 ? '#e8dcc4' : '#7a6a52'),
          s: Math.random() < 0.5 ? PX * 0.5 : PX * 0.35
        });
      }
    }

    function fxLoop(now) {
      fx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      if (now < flashUntil) {
        fx.fillStyle = 'rgba(255, 40, 60, 0.12)';
        fx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
      }
      if (slash) {
        const m = slashMask(now);
        if (m) drawMask(m, '#ff3344');
      }
      if (splat) drawBlood(splat);
      if (now < dustUntil) spawnDust(6);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.age++; p.x += p.vx; p.y += p.vy;
        if (p.age > p.life) { particles.splice(i, 1); continue; }
        fx.globalAlpha = 1 - p.age / p.life;
        fx.fillStyle = p.c;
        fx.fillRect(Math.round(p.x / PX) * PX, Math.round(p.y / PX) * PX, p.s, p.s);
      }
      fx.globalAlpha = 1;
      requestAnimationFrame(fxLoop);
    }
    requestAnimationFrame(fxLoop);

    // Rung màn hình khi chém
    function shake() {
      gsap.fromTo('#canvas-container', { x: 0, y: 0 }, {
        x: () => (Math.random() - 0.5) * 16,
        y: () => (Math.random() - 0.5) * 10,
        duration: 0.05, repeat: 5, yoyo: true, ease: 'none',
        onComplete: () => gsap.set('#canvas-container', { x: 0, y: 0 })
      });
    }

    // ================= SỐ DAMAGE (pixel font 3x5) =================
    const GLYPHS = {
      '0': ['111','101','101','101','111'], '1': ['010','110','010','010','111'],
      '2': ['111','001','111','100','111'], '3': ['111','001','111','001','111'],
      '4': ['101','101','111','001','001'], '5': ['111','100','111','001','111'],
      '6': ['111','100','111','101','111'], '7': ['111','001','010','010','010'],
      '8': ['111','101','111','101','111'], '9': ['111','101','111','001','111']
    };
    const dmgEl = document.getElementById('dmg');
    function showDamage(px, py, num) {
      const cell = Math.max(4, Math.round(innerHeight / 160)); // kích thước 1 pixel font
      const s = String(num);
      const pad = 2, border = 1, gap = 1;
      const W = s.length * 3 + (s.length - 1) * gap + (pad + border) * 2;
      const H = 5 + (pad + border) * 2;
      dmgEl.width = W; dmgEl.height = H;
      const g = dmgEl.getContext('2d');
      g.clearRect(0, 0, W, H);
      g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#ff3344'; g.fillRect(border, border, W - border * 2, H - border * 2);
      g.fillStyle = '#ffb3b9'; g.fillRect(border, border, W - border * 2, 1);   // viền sáng trên
      g.fillStyle = '#000';
      let x = pad + border;
      for (const ch of s) {
        const rows = GLYPHS[ch];
        for (let y = 0; y < 5; y++) for (let i = 0; i < 3; i++) {
          if (rows[y][i] === '1') g.fillRect(x + i, pad + border + y, 1, 1);
        }
        x += 3 + gap;
      }
      dmgEl.style.width = W * cell + 'px';
      dmgEl.style.height = H * cell + 'px';
      dmgEl.style.left = (px - W * cell / 2) + 'px';
      dmgEl.style.top = (py - H * cell / 2) + 'px';

      gsap.killTweensOf(dmgEl);
      gsap.timeline()
        .set(dmgEl, { display: 'block', opacity: 1, scale: 0.2, y: 0 })
        .to(dmgEl, { scale: 1.25, duration: 0.12, ease: 'back.out(3)' })
        .to(dmgEl, { scale: 1, duration: 0.08 })
        .to(dmgEl, { y: -40, opacity: 0, duration: 0.35, delay: 0.25, ease: 'power2.in' })
        .set(dmgEl, { display: 'none' });
    }

    // ================= SLIDE BAY VÀO =================
    // Slide bay vào từ 1 trong 4 hướng ngẫu nhiên:
    // từ dưới lên, từ trên xuống, từ trái sang phải, từ phải sang trái
    const ENTRY = [
      { x: 0,  y: -4.5 },   // từ dưới lên
      { x: 0,  y:  4.5 },   // từ trên xuống
      { x: -8, y:  0   },   // từ trái sang phải
      { x:  8, y:  0   }    // từ phải sang trái
    ];

    function enterFrom(obj, onDone) {
      setProgress(obj, 0);
      const e = ENTRY[Math.floor(Math.random() * ENTRY.length)];
      obj.group.position.set(e.x, e.y, 0);
      obj.group.visible = true;
      gsap.to(obj.group.position, { x: 0, y: 0, duration: 0.95, ease: 'power3.out', onComplete: onDone });
    }

    // ================= ĐIỀU HƯỚNG: START → DANH SÁCH → CHI TIẾT =================
    // view: 'start' | 'grid' | 'detail' | 'busy' (đang chuyển, bỏ qua phím và click)
    let view = 'start';
    const startEl = document.getElementById('start');
    const startBtn = document.getElementById('startBtn');
    const gridEl = document.getElementById('grid');
    const cardsEl = document.getElementById('cards');
    const detailEl = document.getElementById('detail');
    const infoNum = document.getElementById('info-num');
    const infoTitle = document.getElementById('info-title');
    const infoDesc = document.getElementById('info-desc');

    // Tạo 10 thẻ slide
    const cards = slideImages.map((src, i) => {
      const c = document.createElement('button');
      c.type = 'button';
      c.className = 'card';
      c.innerHTML = '<img src="' + src + '" alt="">' +
        '<div class="card-meta"><span class="card-num">' + String(i + 1).padStart(2, '0') + '</span><span class="card-title"></span></div>';
      c.querySelector('.card-title').textContent = SLIDE_INFO[i].title;
      c.addEventListener('click', () => openWithSlash(i));
      cardsEl.appendChild(c);
      return c;
    });

    // Hiện danh sách: nền mờ dần, các thẻ bay lên lần lượt
    function showGrid() {
      gsap.killTweensOf(gridEl);
      gridEl.style.display = 'block';
      gsap.fromTo(gridEl, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out', onComplete: () => { view = 'grid'; } });
      gsap.fromTo(cards, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.05, ease: 'power2.out', clearProps: 'transform,opacity' });
    }

    function hideGrid(onDone) {
      gsap.killTweensOf(gridEl);
      gsap.to(gridEl, { opacity: 0, duration: 0.3, ease: 'power2.in', onComplete: () => { gridEl.style.display = 'none'; if (onDone) onDone(); } });
    }

    // START → danh sách
    function enterGrid() {
      if (view !== 'start') return;
      view = 'busy';
      gsap.to(startEl, { opacity: 0, duration: 0.35, ease: 'power2.in', onComplete: () => { startEl.style.display = 'none'; } });
      showGrid();
    }

    // Danh sách → START (Backspace)
    function backToStart() {
      if (view !== 'grid') return;
      view = 'busy';
      hideGrid(() => {
        startEl.style.display = 'flex';
        gsap.fromTo(startEl, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out', onComplete: () => { view = 'start'; } });
      });
    }

    // Click 1 slide: chém ngay trên thẻ → vết máu + số damage → 1 giây sau mở slide đó
    function openWithSlash(i) {
      if (view !== 'grid') return;
      view = 'busy';
      const r = cards[i].getBoundingClientRect();
      const hitX = Math.round((r.left + r.width / 2) / PX);
      const hitYpx = r.top + r.height / 2;

      startSlash(hitX);
      setTimeout(() => { shake(); flashUntil = performance.now() + 90; }, 260);
      setTimeout(() => {
        startSplat(hitX * PX, hitYpx);
        showDamage(hitX * PX, hitYpx, 1 + Math.floor(Math.random() * 100));
      }, 320);
      setTimeout(() => {
        dustUntil = performance.now() + DISSOLVE_MS;
        gsap.to(bloodFade, { a: 0, duration: DISSOLVE_MS / 1000, ease: 'none', onComplete: () => { splat = null; } });
        hideGrid(() => openDetail(i));
      }, 320 + BLOOD_TO_DISSOLVE_MS);
    }

    // Mở frame chi tiết: slide bay vào, thông tin trượt lên
    function openDetail(i) {
      currentSlideObj = createSlide(slideImages[i], 0);
      scene.add(currentSlideObj.group);
      infoNum.textContent = 'SLIDE ' + String(i + 1).padStart(2, '0') + ' / ' + String(slideImages.length).padStart(2, '0');
      infoTitle.textContent = SLIDE_INFO[i].title;
      infoDesc.textContent = SLIDE_INFO[i].desc;
      enterFrom(currentSlideObj, () => {
        view = 'detail';
        detailEl.classList.add('show');
      });
    }

    // Backspace trong chi tiết: slide tan đi (mosaic), rồi quay về danh sách
    function closeDetail() {
      if (view !== 'detail') return;
      view = 'busy';
      detailEl.classList.remove('show');
      const cur = currentSlideObj;
      tweenProgress(cur, 1.0, DISSOLVE_MS / 1000, 'none', () => {
        disposeSlide(cur);
        currentSlideObj = null;
        showGrid();
      });
    }

    startBtn.addEventListener('click', (e) => { e.stopPropagation(); enterGrid(); });

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (view === 'start') {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterGrid(); }
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        if (view === 'grid') backToStart();
        else if (view === 'detail') closeDetail();
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      resizeFx();
    });

    (function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
