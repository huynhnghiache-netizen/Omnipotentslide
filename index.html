<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Critical Slash Slide Presentation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background-color: #030303; font-family: 'Courier New', Courier, monospace; }
    #canvas-container { width: 100vw; height: 100vh; position: relative; }
    #fx {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 10; image-rendering: pixelated;
    }
    #dmg {
      position: fixed; display: none; pointer-events: none; z-index: 20;
      image-rendering: pixelated; transform-origin: 50% 50%;
      filter: drop-shadow(4px 4px 0 #000);
    }
    /* Lớp đồ họa phủ: vignette tối 4 góc + scanline mờ kiểu màn hình retro */
    #overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 25;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 100%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 3px);
    }
    .ui-layer {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.45); font-size: 14px; pointer-events: none; z-index: 30;
      white-space: nowrap; letter-spacing: 1px; text-shadow: 2px 2px 0 #000;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div class="ui-layer">Click / Space: chém slide tiếp &nbsp;·&nbsp; ← : quay lại slide trước</div>
  <div id="canvas-container"></div>
  <canvas id="fx"></canvas>
  <canvas id="dmg"></canvas>
  <div id="overlay"></div>

  <script>
    // ================= CẤU HÌNH =================
    const slideImages = [
      'slide1.png', 'slide2.png', 'slide3.png', 'slide4.png', 'slide5.png',
      'slide6.png', 'slide7.png', 'slide8.png', 'slide9.png', 'slide10.png'
    ];
    const PX = 8;                     // kích thước 1 "pixel" của vệt chém và bụi
    const BLOOD_PX = PX * 2.5;        // kích thước 1 "pixel" của vết máu
    const MOSAIC = [80, 45];          // số ô mosaic khi slide vỡ (ngang x dọc)
    const BREAK_END = 1.3;            // mốc uProgress để slide vỡ hết
    const RISE_FROM = -4.5;           // slide sau bắt đầu từ dưới màn hình
    let currentIndex = 0;
    let isAnimating = false;

    // ================= THREE.JS =================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
    camera.position.z = 5.2;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 1.3));

    // Cache texture: mỗi ảnh chỉ load 1 lần
    const texCache = {};
    function getTex(path) {
      if (!texCache[path]) {
        const t = new THREE.TextureLoader().load(path);
        t.minFilter = THREE.LinearFilter;
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        texCache[path] = t;
      }
      return texCache[path];
    }

    // Đổi toạ độ pixel màn hình sang toạ độ thế giới trên mặt phẳng slide (z = 0)
    function pxToWorld(px, py) {
      const halfH = Math.tan(camera.fov * Math.PI / 360) * camera.position.z;
      const halfW = halfH * camera.aspect;
      return { x: (px / innerWidth * 2 - 1) * halfW, y: (1 - py / innerHeight * 2) * halfH };
    }

    // Shader vỡ: mỗi ô có số ngẫu nhiên, khi uProgress tăng thì ô bay ra từ điểm chém theo nhiều hướng rồi biến mất.
    // Khi uProgress = 0 (slide còn nguyên) shader trả về ảnh gốc, không làm gì cả.
    const BREAK_VERT = `
      uniform float uProgress;
      uniform vec2 uOrigin;
      varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void main() {
        vUv = uv;
        vec3 p = position;
        if (uProgress > 0.001) {
          vec2 cell = floor(uv * vec2(${MOSAIC[0]}.0, ${MOSAIC[1]}.0));
          float k = uProgress * uProgress;
          vec2 radial = p.xy - uOrigin;
          vec2 dirR = radial / max(length(radial), 0.001);          // hướng tỏa từ điểm chém
          float a = hash(cell + 5.1) * 6.2831853;
          vec2 dirA = vec2(cos(a), sin(a));                          // hướng ngẫu nhiên
          vec2 dir = normalize(dirR * 0.6 + dirA * 0.4 + vec2(0.0001));
          float speed = 0.6 + hash(cell + 9.1) * 1.6;
          p.xy += dir * speed * k * 2.2;
          p.y += 0.25 * k;                                           // bụi bốc lên nhẹ
          p.z += hash(cell + 2.7) * 0.6 * k;
        }
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`;

    const BREAK_FRAG = `
      uniform sampler2D map;
      uniform float uProgress;
      varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void main() {
        vec4 c = texture2D(map, vUv);
        if (uProgress < 0.001) { gl_FragColor = c; return; }   // slide nguyên vẹn: không đụng tới
        vec2 cell = floor(vUv * vec2(${MOSAIC[0]}.0, ${MOSAIC[1]}.0));
        float d = hash(cell) - uProgress;
        if (d < -0.25) discard;
        if (d < 0.0) {                                           // ô đen/trắng kiểu mosaic
          float bw = step(0.5, hash(cell + 3.3));
          gl_FragColor = vec4(vec3(bw), 1.0 + d / 0.25);
          return;
        }
        if (c.a < 0.01) discard;
        gl_FragColor = vec4(c.rgb, c.a * clamp(d / 0.08, 0.0, 1.0));
      }`;

    function makeBreakMat(tex) {
      return new THREE.ShaderMaterial({
        uniforms: {
          map: { value: tex },
          uProgress: { value: 0 },
          uOrigin: { value: new THREE.Vector2(0, 0) }
        },
        vertexShader: BREAK_VERT,
        fragmentShader: BREAK_FRAG,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      });
    }

    function createSlicedSlide(texturePath, zIndex) {
      const group = new THREE.Group();
      group.position.z = zIndex;
      const width = 7.5, height = 4.2;
      const texture = getTex(texturePath);

      // Nửa trái: UV 0 → 0.5
      const leftGeo = new THREE.PlaneGeometry(width / 2, height);
      leftGeo.translate(-width / 4, 0, 0);
      const lu = leftGeo.attributes.uv;
      for (let i = 0; i < lu.count; i++) lu.setX(i, lu.getX(i) * 0.5);
      const leftPiece = new THREE.Mesh(leftGeo, makeBreakMat(texture));

      // Nửa phải: UV 0.5 → 1
      const rightGeo = new THREE.PlaneGeometry(width / 2, height);
      rightGeo.translate(width / 4, 0, 0);
      const ru = rightGeo.attributes.uv;
      for (let i = 0; i < ru.count; i++) ru.setX(i, 0.5 + ru.getX(i) * 0.5);
      const rightPiece = new THREE.Mesh(rightGeo, makeBreakMat(texture));

      group.add(leftPiece, rightPiece);
      return { group, leftPiece, rightPiece };
    }

    // Slide chưa tới lượt: tạo sẵn nhưng ẩn, để không lộ qua slide đang vỡ
    function makeNext(index) {
      if (index >= slideImages.length) return null;
      const o = createSlicedSlide(slideImages[index], -1.5);
      o.group.visible = false;
      scene.add(o.group);
      return o;
    }

    function setProgress(obj, v) {
      obj.leftPiece.material.uniforms.uProgress.value = v;
      obj.rightPiece.material.uniforms.uProgress.value = v;
    }
    function setOrigin(obj, x, y) {
      obj.leftPiece.material.uniforms.uOrigin.value.set(x, y);
      obj.rightPiece.material.uniforms.uOrigin.value.set(x, y);
    }
    function tweenProgress(obj, to, dur, ease, onComplete) {
      return gsap.to(
        [obj.leftPiece.material.uniforms.uProgress, obj.rightPiece.material.uniforms.uProgress],
        { value: to, duration: dur, ease: ease, onComplete: onComplete }
      );
    }

    function disposeSlide(obj) {
      obj.group.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) o.material.dispose();
      });
      scene.remove(obj.group);
    }

    let currentSlideObj = createSlicedSlide(slideImages[currentIndex], 0);
    scene.add(currentSlideObj.group);
    let nextSlideObj = makeNext(currentIndex + 1);

    // ================= LỚP PIXEL (canvas 2D) =================
    const fxCanvas = document.getElementById('fx');
    const fx = fxCanvas.getContext('2d');
    let COLS = 0, ROWS = 0;
    function resizeFx() {
      fxCanvas.width = innerWidth;
      fxCanvas.height = innerHeight;
      COLS = Math.ceil(innerWidth / PX);
      ROWS = Math.ceil(innerHeight / PX);
    }
    resizeFx();

    function drawMask(m, color) {
      fx.fillStyle = color;
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        if (m[y * COLS + x]) fx.fillRect(x * PX, y * PX, PX, PX);
      }
    }

    // Vệt chém: build sẵn hình dạng từng hàng, mở dần từ trên xuống theo bước 40ms (giật cục)
    let slash = null;
    let flashUntil = 0;
    function startSlash(hitX) {
      const rows = new Array(ROWS);
      let x = hitX, half = 2, left = 0;
      for (let y = 0; y < ROWS; y++) {
        if (left <= 0) {
          left = 4 + ((Math.random() * 12) | 0);
          x = hitX + ((Math.random() * 7) | 0) - 3;
          half = 1 + ((Math.random() * 3) | 0);
        }
        left--;
        rows[y] = [x - half, x + half];
      }
      slash = { start: performance.now(), rows };
      return rows;
    }

    function slashMask(now) {
      const e = now - slash.start;
      if (e > 450) { slash = null; return null; }
      const step = Math.floor(e / 40) * 40;
      const grow = Math.min(ROWS, Math.ceil(ROWS * Math.min(1, step / 280)));
      const m = new Uint8Array(COLS * ROWS);
      for (let y = 0; y < grow; y++) {
        const [a, b] = slash.rows[y];
        for (let x = Math.max(0, a); x <= Math.min(COLS - 1, b); x++) m[y * COLS + x] = 1;
      }
      return m;
    }

    // Vết máu: vệt đỏ dài gần hết màn hình, hơi nghiêng như ảnh mẫu, có lõi sáng và giọt chảy xuống
    let splat = null;
    function startSplat(hitXpx, hitYpx) {
      const bc = Math.ceil(innerWidth / BLOOD_PX), br = Math.ceil(innerHeight / BLOOD_PX);
      const body = new Uint8Array(bc * br), core = new Uint8Array(bc * br);
      const set = (m, x, y) => { if (x >= 0 && y >= 0 && x < bc && y < br) m[y * bc + x] = 1; };

      const len = Math.round(br * (0.82 + Math.random() * 0.1));
      const top = Math.round(hitYpx / BLOOD_PX - len * 0.5);
      const lean = -(0.3 + Math.random() * 0.2);        // nghiêng: trên lệch phải, dưới lệch trái
      let xf = hitXpx / BLOOD_PX, w = 2;

      for (let i = 0; i < len; i++) {
        const y = top + i;
        xf += lean;
        if (Math.random() < 0.2) w = Math.max(1, Math.min(3, w + (Math.random() < 0.5 ? -1 : 1)));
        const x = Math.round(xf + (Math.random() < 0.15 ? (Math.random() < 0.5 ? -1 : 1) : 0));
        const taper = i > len * 0.85 ? 0 : 1;           // đuôi nhọn dần
        for (let dx = -w * taper; dx <= w * taper; dx++) {
          set(body, x + dx, y);
          if (dx === 0) set(core, x + dx, y);
        }
        if (Math.random() < 0.05) for (let k = 1; k <= 4; k++) set(body, x, y + k);   // giọt chảy
      }
      splat = { body, core, bc, br };
    }

    function drawBlood(s) {
      for (let y = 0; y < s.br; y++) for (let x = 0; x < s.bc; x++) {
        const i = y * s.bc + x;
        if (!s.body[i]) continue;
        fx.fillStyle = '#8a0016';
        fx.fillRect(x * BLOOD_PX, y * BLOOD_PX, BLOOD_PX, BLOOD_PX);
        if (s.core[i]) {
          fx.fillStyle = '#ff3344';
          fx.fillRect(x * BLOOD_PX + 4, y * BLOOD_PX, BLOOD_PX - 8, BLOOD_PX);
        }
      }
    }

    // Bụi bay lên
    const particles = [];
    let dustUntil = 0;
    function spawnDust(n) {
      for (let i = 0; i < n && particles.length < 500; i++) {
        const r = Math.random();
        particles.push({
          x: innerWidth * (0.15 + Math.random() * 0.7),
          y: innerHeight * (0.2 + Math.random() * 0.6),
          vx: (Math.random() - 0.5) * 1.2,
          vy: -(0.8 + Math.random() * 2.2),
          life: 50 + Math.random() * 50, age: 0,
          c: r < 0.12 ? '#ff3344' : (r < 0.56 ? '#e8dcc4' : '#7a6a52'),
          s: Math.random() < 0.5 ? PX * 0.5 : PX * 0.35
        });
      }
    }

    function fxLoop(now) {
      fx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      if (now < flashUntil) {
        fx.fillStyle = 'rgba(255, 40, 60, 0.12)';
        fx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
      }
      if (slash) {
        const m = slashMask(now);
        if (m) drawMask(m, '#ff3344');
      }
      if (splat) drawBlood(splat);
      if (now < dustUntil) spawnDust(6);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.age++; p.x += p.vx; p.y += p.vy; p.vy *= 0.99;
        if (p.age > p.life) { particles.splice(i, 1); continue; }
        fx.globalAlpha = 1 - p.age / p.life;
        fx.fillStyle = p.c;
        fx.fillRect(Math.round(p.x / PX) * PX, Math.round(p.y / PX) * PX, p.s, p.s);
      }
      fx.globalAlpha = 1;
      requestAnimationFrame(fxLoop);
    }
    requestAnimationFrame(fxLoop);

    // Rung màn hình khi chém
    function shake() {
      gsap.fromTo('#canvas-container', { x: 0, y: 0 }, {
        x: () => (Math.random() - 0.5) * 16,
        y: () => (Math.random() - 0.5) * 10,
        duration: 0.05, repeat: 5, yoyo: true, ease: 'none',
        onComplete: () => gsap.set('#canvas-container', { x: 0, y: 0 })
      });
    }

    // ================= SỐ DAMAGE (pixel font 3x5) =================
    const GLYPHS = {
      '0': ['111','101','101','101','111'], '1': ['010','110','010','010','111'],
      '2': ['111','001','111','100','111'], '3': ['111','001','111','001','111'],
      '4': ['101','101','111','001','001'], '5': ['111','100','111','001','111'],
      '6': ['111','100','111','101','111'], '7': ['111','001','010','010','010'],
      '8': ['111','101','111','101','111'], '9': ['111','101','111','001','111']
    };
    const dmgEl = document.getElementById('dmg');
    function showDamage(px, py, num) {
      const cell = Math.max(4, Math.round(innerHeight / 160)); // kích thước 1 pixel font
      const s = String(num);
      const pad = 2, border = 1, gap = 1;
      const W = s.length * 3 + (s.length - 1) * gap + (pad + border) * 2;
      const H = 5 + (pad + border) * 2;
      dmgEl.width = W; dmgEl.height = H;
      const g = dmgEl.getContext('2d');
      g.clearRect(0, 0, W, H);
      g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#ff3344'; g.fillRect(border, border, W - border * 2, H - border * 2);
      g.fillStyle = '#ffb3b9'; g.fillRect(border, border, W - border * 2, 1);   // viền sáng trên
      g.fillStyle = '#000';
      let x = pad + border;
      for (const ch of s) {
        const rows = GLYPHS[ch];
        for (let y = 0; y < 5; y++) for (let i = 0; i < 3; i++) {
          if (rows[y][i] === '1') g.fillRect(x + i, pad + border + y, 1, 1);
        }
        x += 3 + gap;
      }
      dmgEl.style.width = W * cell + 'px';
      dmgEl.style.height = H * cell + 'px';
      dmgEl.style.left = (px - W * cell / 2) + 'px';
      dmgEl.style.top = (py - H * cell / 2) + 'px';

      gsap.killTweensOf(dmgEl);
      gsap.timeline()
        .set(dmgEl, { display: 'block', opacity: 1, scale: 0.2, y: 0 })
        .to(dmgEl, { scale: 1.25, duration: 0.12, ease: 'back.out(3)' })
        .to(dmgEl, { scale: 1, duration: 0.08 })
        .to(dmgEl, { y: -40, opacity: 0, duration: 0.35, delay: 0.25, ease: 'power2.in' })
        .set(dmgEl, { display: 'none' });
    }

    // ================= CHUYỂN SLIDE =================
    // Slide mới trồi lên từ dưới màn hình, luôn bắt đầu ở trạng thái nguyên vẹn
    function riseIn(obj, onDone) {
      setProgress(obj, 0);
      obj.group.position.z = 0;
      obj.group.position.y = RISE_FROM;
      obj.group.visible = true;
      gsap.to(obj.group.position, { y: 0, duration: 0.9, ease: 'power3.out', onComplete: onDone });
    }

    function finishSlide(nxt) {
      currentSlideObj = nxt;
      currentIndex++;
      nextSlideObj = makeNext(currentIndex + 1);
      isAnimating = false;
    }

    // Tiến: chém -> vết máu -> slide vỡ tỏa ra nhiều phía -> slide sau trồi lên từ dưới
    function nextSlide() {
      if (isAnimating || currentIndex >= slideImages.length - 1) return;
      isAnimating = true;

      const cur = currentSlideObj;
      const nxt = nextSlideObj;
      const hitX = Math.round((innerWidth * 0.5 + (Math.random() - 0.5) * innerWidth * 0.15) / PX);
      const hitY = Math.round(innerHeight * 0.42 / PX);
      const origin = pxToWorld(hitX * PX, hitY * PX);

      // 0ms: vệt chém từ trên xuống
      const rows = startSlash(hitX);

      // 260ms: chạm đích: rung + nháy đỏ
      setTimeout(() => { shake(); flashUntil = performance.now() + 90; }, 260);

      // 320ms: vết máu dính vào slide + số damage ngẫu nhiên 1-100
      setTimeout(() => {
        startSplat(hitX * PX, hitY * PX);
        showDamage(hitX * PX, hitY * PX, 1 + Math.floor(Math.random() * 100));
      }, 320);

      // 500ms: slide hiện tại vỡ, các mảnh tỏa ra từ điểm chém
      setTimeout(() => {
        dustUntil = performance.now() + 1500;
        setOrigin(cur, origin.x, origin.y);
        tweenProgress(cur, BREAK_END, 1.5, 'none', () => {
          splat = null;
          disposeSlide(cur);
          riseIn(nxt, () => finishSlide(nxt));
        });
      }, 500);
    }

    // Lùi: slide hiện tại vỡ đi, slide trước trồi lên từ dưới
    function prevSlide() {
      if (isAnimating || currentIndex <= 0) return;
      isAnimating = true;
      splat = null;

      const cur = currentSlideObj;
      const ahead = nextSlideObj;
      const back = createSlicedSlide(slideImages[currentIndex - 1], 0);
      back.group.visible = false;
      scene.add(back.group);

      tweenProgress(cur, BREAK_END, 1.0, 'power1.in', () => {
        disposeSlide(cur);
        if (ahead) disposeSlide(ahead);
        currentSlideObj = back;
        currentIndex--;
        nextSlideObj = makeNext(currentIndex + 1);
        riseIn(back, () => { isAnimating = false; });
      });
    }

    window.addEventListener('click', nextSlide);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); prevSlide(); }
    });

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      resizeFx();
    });

    (function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
