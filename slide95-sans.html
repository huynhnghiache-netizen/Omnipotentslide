<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 9.5 - Sans Quiz</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg1: #1a1a2b; --bg2: #05050a; --line: #fff; --acc: #ffe000; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { font-family: 'Courier New', Courier, monospace; color: #fff; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 50% 50%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, var(--bg1) 0%, var(--bg2) 85%); transition: background 1s; }
  #stage.dark { --bg1: #1c0508; --bg2: #000; --line: #ff5566; --acc: #ff3344; }
  #stage.dark::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 160px 40px rgba(120, 0, 10, .55); animation: flick 3s steps(1) infinite; }
  @keyframes flick { 0%, 100% { opacity: 1 } 47% { opacity: .75 } 50% { opacity: 1 } 83% { opacity: .85 } }
  #stage.gas { --bg1: #0b0518; --bg2: #000; --line: #8d63ff; --acc: #b794ff; }
  #stage.gas::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 180px 50px rgba(70, 20, 140, .5); animation: gpulse 5s ease-in-out infinite; z-index: 2; }
  @keyframes gpulse { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
  #stage.gas #deco i.h { background: #8d63ff; } #stage.gas #deco i.b { background: #4b3a82; }
  #stage.gas #gasBig { filter: drop-shadow(0 0 16px rgba(141, 99, 255, .55)); }
  #gasCv { position: absolute; pointer-events: none; z-index: 6; image-rendering: pixelated; }
  .px { font-family: 'Press Start 2P', 'Courier New', monospace; }
  img, canvas { image-rendering: pixelated; }

  /* nút góc trên */
  .ib { position: absolute; top: 18px; width: 48px; height: 48px; background: #000; border: 4px solid #fff; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 #000; z-index: 20; }
  .ib svg { width: 26px; height: 26px; shape-rendering: crispEdges; }
  .ib:hover { border-color: var(--acc); transform: translateY(-2px); }
  .ib:active { transform: translateY(2px); }
  #bPrev { left: 18px; } #bNext { left: 78px; } #bReset { left: 154px; }
  #bX { right: 18px; top: 84px; border-color: #ff3344; display: none; }
  #bX svg path { stroke: #ff3344; }
  .tip { position: absolute; top: 72px; font: 8px 'Press Start 2P', monospace; color: rgba(255,255,255,.45); letter-spacing: 1px; pointer-events: none; }

  /* Sans */
  #sans { position: absolute; image-rendering: pixelated; transition: left .4s, top .4s, height .4s; filter: drop-shadow(0 0 10px rgba(255,255,255,.12)); }
  #sansSp { position: absolute; display: none; image-rendering: pixelated; background-repeat: no-repeat; cursor: pointer; filter: drop-shadow(0 0 10px rgba(255,255,255,.12)); }
  #sans { display: none; }
  @keyframes shake { 0% { transform: translate(0, 0) rotate(0) } 20% { transform: translate(-2px, 1px) rotate(-.7deg) } 40% { transform: translate(2px, -1px) rotate(.7deg) } 60% { transform: translate(-1px, -1px) rotate(-.4deg) } 80% { transform: translate(1px, 1px) rotate(.4deg) } 100% { transform: translate(0, 0) rotate(0) } }
  #yawn { position: absolute; font: 12px 'Press Start 2P', monospace; color: rgba(255,255,255,.7); display: none; animation: zz 2.4s steps(4) infinite; }
  @keyframes zz { 0% { opacity: 0; transform: translateY(8px) } 40% { opacity: 1 } 100% { opacity: 0; transform: translateY(-14px) } }

  /* khung thoại */
  #dlg { position: absolute; left: 70px; right: 70px; bottom: 26px; height: 132px; background: #000; border: 6px solid var(--line); padding: 20px 26px;
    font: 17px/1.9 'Press Start 2P', 'Courier New', monospace; letter-spacing: 1px; display: none; z-index: 10; cursor: pointer; }
  #dhead { position: absolute; left: 22px; top: 50%; width: 88px; margin-top: -42px; image-rendering: pixelated; animation: hd .5s steps(1) infinite; }
  @keyframes hd { 0%,100% { transform: translate(0,0) } 33% { transform: translate(-1px,1px) } 66% { transform: translate(1px,0) } }
  #dlg { padding-left: 132px !important; }
  #dlg .who { left: 132px !important; }
  #dlg .who { position: absolute; top: -17px; left: 22px; background: #000; padding: 0 10px; font-size: 12px; color: var(--acc); }
  #dlg .nxt { position: absolute; right: 14px; bottom: 8px; font-size: 12px; animation: blink 1s steps(1) infinite; color: var(--acc); }
  @keyframes blink { 50% { opacity: 0 } }
  #dtrans { position: absolute; left: 132px; right: 60px; bottom: 12px; font: italic 14px/1.3 'Courier New', monospace; color: #b8a0ff; opacity: 0; transition: opacity .5s; letter-spacing: 0; }

  /* màn chọn nhân vật */
  #sel { position: absolute; inset: 0; display: none; }
  #sel .ttl { position: absolute; top: 28px; width: 100%; text-align: center; font: min(22px, calc(92vw / 27)) 'Press Start 2P', monospace; text-shadow: 4px 4px 0 #8a0016; }
  #selRow { position: absolute; left: 0; right: 0; top: 130px; display: flex; justify-content: center; gap: 60px; pointer-events: none; }
  .chc { position: relative; width: 270px; height: 380px; border: 6px solid var(--line); background: rgba(0,0,0,.55); box-shadow: 0 0 0 4px #000, 0 0 28px rgba(255,255,255,.12); pointer-events: auto; }
  #selCard { cursor: pointer; }
  #selCard:hover { border-color: var(--acc); }
  .chc.dis { opacity: .9; cursor: default; }
  .chc .nm { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font: 22px 'Press Start 2P', monospace; }
  .chc .spr { position: absolute; left: 50%; image-rendering: pixelated; }
  #papSpr { width: 185px; height: 275px; margin-left: -92px; top: 22px; background: url(assets/papyrus.png) 0 0 / 400% 100% no-repeat; animation: pap .667s steps(4) infinite; }
  @keyframes pap { from { background-position: 0 0 } to { background-position: 133.3333% 0 } }
  #gasSpr { height: 280px; margin-left: -57px; top: 26px; }
  #status { position: absolute; left: 50%; top: 540px; visibility: hidden !important; transform: translateX(-50%); font: 18px 'Press Start 2P', monospace; padding: 12px 22px; border: 5px solid; display: none; z-index: 3; background: #000; white-space: nowrap; }
  #status.ok { color: #5dff7a; border-color: #5dff7a; text-shadow: 3px 3px 0 #0b4a17; }
  #status.lost { color: #ff4455; border-color: #ff4455; text-shadow: 3px 3px 0 #5a0010; }
  .chc .st { position: absolute; left: 50%; bottom: -62px; transform: translateX(-50%); font: 16px 'Press Start 2P', monospace; padding: 10px 18px; border: 5px solid; display: none; background: #000; white-space: nowrap; }
  .chc .st.ok { color: #5dff7a; border-color: #5dff7a; text-shadow: 3px 3px 0 #0b4a17; }
  .chc .st.lost { color: #ff4455; border-color: #ff4455; text-shadow: 3px 3px 0 #5a0010; }
  #cGas:not(.dis) { cursor: pointer; } #cGas:not(.dis):hover { border-color: var(--acc); }
  /* Gaster trong lúc chơi */
  #gasBig { position: absolute; left: 100px; top: 110px; height: 350px; image-rendering: pixelated; display: none; filter: drop-shadow(0 0 14px rgba(255,255,255,.18)); }
  @keyframes gvan { 0% { opacity: 1; transform: translateX(0) } 15% { opacity: .2; transform: translateX(-14px) skewX(8deg) } 30% { opacity: 1; transform: translateX(10px) } 45% { opacity: .1; transform: translateX(-20px) skewX(-10deg) } 60% { opacity: .8; transform: translateX(6px) } 100% { opacity: 0; transform: translateX(0) scaleY(.02) } }
  #gasBig.van { animation: gvan .9s steps(1, end) forwards; }
  #dhead.gas { object-fit: cover; object-position: top; height: 106px; margin-top: -53px; }
  @keyframes ggl { 0% { transform: translate(0) } 10% { transform: translate(-9px, 2px) skewX(10deg); filter: hue-rotate(90deg) drop-shadow(0 0 10px #f0f) } 20% { opacity: .3; transform: translate(4px, 0) } 30% { transform: translate(11px, -3px) skewX(-12deg); opacity: 1 } 40% { clip-path: inset(30% 0 40% 0); transform: translate(-14px, 0) } 55% { clip-path: none; opacity: .45; transform: translate(6px, 2px) } 70% { opacity: 1; transform: translate(-4px, -2px) skewX(6deg); filter: hue-rotate(-70deg) } 100% { transform: none; clip-path: none; opacity: 1 } }
  #gasBig.gl { animation: ggl .55s steps(1) forwards; }
  #gasBig.flick { animation: gflick .35s steps(1) forwards; } @keyframes gflick { 0% { opacity: 0 } 25% { opacity: 1 } 50% { opacity: .2 } 75% { opacity: 1 } 100% { opacity: .6 } }
  /* màn tổng kết */
  #summary { position: absolute; left: 420px; right: 40px; top: 120px; display: none; text-align: center; font: 16px/2 'Press Start 2P', monospace; }
  #summary.center { left: 0; right: 0; }
  #summary .sn { font-size: 20px; color: var(--acc); margin-bottom: 18px; letter-spacing: 1px; }
  #summary .sn.lost { color: #ff4455; } #summary .sn.ok { color: #5dff7a; }
  #summary .sc { margin: 10px 0 6px; } #summary .sc canvas { transform: scale(1.6); }
  #summary .sl { font-size: 14px; margin-top: 24px; opacity: .85; }
  #summary .num { font-size: 72px; color: var(--acc); text-shadow: 5px 5px 0 #000; line-height: 1.3; animation: snum .5s steps(4); }
  @keyframes snum { 0% { transform: scale(.3); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
  #sX { position: absolute; right: 18px; top: 18px; width: 56px; height: 56px; background: #000; border: 5px solid #ff3344; display: none; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-shadow: 0 5px 0 #000; z-index: 25; }
  #sX svg { width: 30px; height: 30px; } #sX:hover { transform: translateY(-2px); background: #2a060b; }
  /* rương */
  #boxRow .bx { width: 150px; height: 112px; border: 0; background: none; box-shadow: none; padding: 0; overflow: visible; display: block; font: 12px 'Press Start 2P', monospace; transition: transform .15s; }
  #boxRow .bx::before { display: none; }
  #boxRow .bx .chs { width: 150px; height: 105px; display: block; overflow: visible; filter: drop-shadow(0 6px 0 rgba(0,0,0,.6)); }
  #boxRow .bx .lid { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .45s cubic-bezier(.3, 1.6, .5, 1); }
  #boxRow .bx .inner { opacity: 0; transition: opacity .3s; }
  #boxRow .bx.open .lid { transform: translateY(-30px) scaleY(.5); }
  #boxRow .bx.open .inner { opacity: 1; }
  #boxRow .bx:not(.open):hover { transform: translateY(-6px) rotate(-1.5deg); border: 0; }
  #boxRow .bx.open { cursor: default; animation: none; background: none; }
  #boxRow .bx.pick .chs { filter: drop-shadow(0 0 16px #c9a8ff) drop-shadow(0 6px 0 rgba(0,0,0,.6)); }
  #boxRow .bx.other { opacity: .62; }
  #boxRow .bx .lbl { position: absolute; left: 0; right: 0; bottom: -24px; text-align: center; color: var(--acc); opacity: 0; transition: opacity .4s; font-size: 14px; }
  #boxRow .bx.open .lbl { opacity: 1; }
  #boxRow .bx .glow { position: absolute; left: 50%; top: 18px; width: 340px; height: 340px; margin: -170px 0 0 -170px; pointer-events: none; opacity: 0; mix-blend-mode: screen; z-index: 0;
    background: radial-gradient(circle, rgba(255,245,255,.95) 0, rgba(190,150,255,.55) 22%, rgba(141,99,255,0) 62%), repeating-conic-gradient(rgba(255,255,255,.32) 0 5deg, transparent 5deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 25%, transparent 68%); mask-image: radial-gradient(circle, #000 25%, transparent 68%);
    animation: glowOn 2.2s ease-out forwards, glowSpin 7s linear infinite; }
  @keyframes glowOn { 0% { transform: scale(.2); opacity: 0 } 25% { opacity: 1 } 100% { transform: scale(1); opacity: .75 } }
  @keyframes glowSpin { to { rotate: 360deg } }
  #boxRow .bx.other .glow { width: 200px; height: 200px; margin: -100px 0 0 -100px; animation-duration: 1.4s, 7s; }
  #boxRow .bx .cdy { position: absolute; left: 50%; top: 20px; margin-left: -17px; z-index: 3; pointer-events: none; image-rendering: pixelated; filter: drop-shadow(0 0 6px #fff); }
  @keyframes cbob { 0%, 100% { translate: 0 0 } 50% { translate: 0 -8px } }
  #boxes { top: 170px; }
  #boxRow { margin-top: 130px; gap: 18px; }
  /* 5 hộp phần thưởng */
  #boxes { position: absolute; left: 380px; right: 30px; top: 150px; display: none; text-align: center; }
  #boxes .info { font: 14px/2 'Press Start 2P', monospace; margin-bottom: 26px; }
  #boxRow { display: flex; gap: 16px; justify-content: center; }
  .bx { width: 112px; height: 150px; border: 6px solid var(--line); background: #000; position: relative; cursor: pointer; box-shadow: 0 6px 0 #000; font: 40px 'Press Start 2P', monospace; display: flex; align-items: center; justify-content: center; flex-direction: column; color: var(--acc); overflow: hidden; }
  .bx::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 3px, transparent 3px 7px); animation: bxn .4s steps(2) infinite; pointer-events: none; }
  @keyframes bxn { to { transform: translateY(7px) } }
  .bx:not(.open):hover { border-color: var(--acc); transform: translateY(-4px); }
  .bx.open { cursor: default; font-size: 16px; color: #fff; background: #0d0d14; animation: bxo .35s steps(3); }
  .bx.open::before { display: none; }
  .bx.open .n { font-size: 34px; color: var(--acc); margin-top: 8px; }
  .bx.pick { border-color: #5dff7a; box-shadow: 0 0 0 4px #000, 0 0 26px rgba(93,255,122,.55); }
  .bx.other { opacity: .55; }
  @keyframes bxo { 0% { transform: scaleX(.1) } 100% { transform: scaleX(1) } }
  #hint { position: absolute; left: 0; right: 0; top: 628px; text-align: center; font: 10px 'Press Start 2P', monospace; color: rgba(255,255,255,.55); }

  /* câu hỏi */
  #qa { position: absolute; left: 420px; right: 40px; top: 90px; bottom: 170px; display: none; flex-direction: column; justify-content: center; }
  #qa .tag { font: 11px 'Press Start 2P', monospace; color: var(--acc); margin-bottom: 12px; letter-spacing: 1px; }
  #qa .q { font: 15px/1.7 'Press Start 2P', 'Courier New', monospace; margin-bottom: 16px; min-height: 52px; }
  #opts { display: grid; gap: 10px; }
  #opts.c1 { grid-template-columns: 1fr; }
  #opts.c2 { grid-template-columns: 1fr 1fr; }
  .opt { text-align: left; background: #000; color: #fff; border: 4px solid var(--line); padding: 10px 12px 10px 46px; font: bold 15px/1.35 'Courier New', Courier, monospace; cursor: pointer; position: relative; min-height: 58px; display: flex; align-items: center; }
  #opts.c1 .opt { font-size: 18px; min-height: 56px; }
  .opt b { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font: 13px 'Press Start 2P', monospace; color: var(--acc); }
  .opt:hover:not(.lock) { border-color: var(--acc); background: #15150a; }
  .opt.good { border-color: #5dff7a; background: #07260d; }
  .opt.bad { border-color: #ff4455; background: #2a060b; }
  .opt.lock { cursor: default; }
  #why { margin-top: 12px; border: 4px dashed #ff4455; background: rgba(40,0,6,.85); padding: 10px 14px; font: 14px/1.5 'Courier New', monospace; font-weight: bold; display: none; }
  #why .h { font: 10px 'Press Start 2P', monospace; color: #ff4455; display: block; margin-bottom: 6px; }
  #why .g { color: #5dff7a; display: block; margin-top: 6px; }

  /* vòng quay */
  #wheelBox { position: absolute; inset: 0; display: none; background: rgba(0, 0, 0, .8); z-index: 15; cursor: pointer; }
  #wheelBox canvas { position: absolute; left: 50%; top: 50%; width: 600px; height: 600px; margin: -306px 0 0 -300px; filter: drop-shadow(0 0 30px rgba(255, 220, 120, .25)); }
  #wheelBox .cap { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font: 22px 'Press Start 2P', monospace; color: var(--acc); text-shadow: 3px 3px 0 #000; animation: blink 1s steps(1) infinite; }
  #wX { position: absolute; right: 18px; top: 18px; width: 56px; height: 56px; background: #000; border: 5px solid #ff3344; display: none; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-shadow: 0 5px 0 #000; z-index: 25; }
  #wX svg { width: 30px; height: 30px; }
  #wX:hover { transform: translateY(-2px); background: #2a060b; }

  /* kèo cược + kết quả */
  #gamble { position: absolute; left: 420px; right: 40px; top: 190px; display: none; text-align: center; }
  #gamble .row { display: flex; gap: 30px; justify-content: center; margin-top: 28px; }
  .big { font: 22px 'Press Start 2P', monospace; background: #000; color: #fff; border: 6px solid var(--line); padding: 20px 38px; cursor: pointer; box-shadow: 0 7px 0 #000; }
  .big:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-3px); }
  #gamble .info { font: 14px/2 'Press Start 2P', monospace; }
  #result { position: absolute; left: 420px; right: 40px; top: 150px; display: none; text-align: center; font: 16px/2.1 'Press Start 2P', monospace; }
  #result .num { font-size: 44px; color: var(--acc); text-shadow: 4px 4px 0 #000; }

  #hud { position: absolute; top: 24px; left: 0; right: 0; text-align: center; font: 14px 'Press Start 2P', monospace; display: none; pointer-events: none; }
  #hud canvas { vertical-align: middle; margin-right: 8px; }
  #hud b { color: var(--acc); }
  #blk { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 40; transition: opacity .45s; }
  #deco { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  #deco i { position: absolute; bottom: -40px; width: 12px; height: 12px; background: var(--line); opacity: 0; animation: rise linear infinite; }
  #deco i.h { background: #ff2a3c; width: 18px; height: 16px; clip-path: polygon(0 25%,25% 0,50% 25%,75% 0,100% 25%,100% 50%,50% 100%,0 50%); }
  #deco i.b { width: 34px; height: 8px; background: #bdbdbd; }
  @keyframes rise { 0% { transform: translateY(0) rotate(0); opacity: 0 } 10% { opacity: .3 } 90% { opacity: .3 } 100% { transform: translateY(-800px) rotate(200deg); opacity: 0 } }
  #gust { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 5; transition: opacity .15s; }
  #gust i { position: absolute; height: 3px; background: rgba(255,255,255,.6); border-radius: 2px; animation: gw .5s linear infinite; }
  @keyframes gw { from { transform: translateX(-260px) } to { transform: translateX(1500px) } }
</style>
</head>
<body>
<div id="stage">
  <button class="ib" id="bPrev" title="Back to slide 9" aria-label="Back to slide 9"><svg viewBox="0 0 8 8"><path d="M1 1h2v6H1zM7 1v6L3 4z" fill="#fff"/></svg></button>
  <button class="ib" id="bNext" title="Skip to the last slide" aria-label="Skip to the last slide"><svg viewBox="0 0 8 8"><path d="M5 1h2v6H5zM1 1v6l4-3z" fill="#fff"/></svg></button>
  <button class="ib" id="bReset" title="Reset questions" aria-label="Reset questions"><svg viewBox="0 0 8 8"><path d="M2 2h3V1h1v1h1v3H6v1H5v1H3V6H2V5H1V3h1zM3 3v2h2V3z" fill="#fff"/></svg></button>
  <div class="tip" style="left:10px">BACK</div><div class="tip" style="left:72px">LAST</div><div class="tip" style="left:150px">RESET</div>
  <button class="ib" id="bX" title="Exit" aria-label="Exit"><svg viewBox="0 0 8 8"><path d="M1 1l6 6M7 1L1 7" stroke="#f34" stroke-width="1.6" fill="none"/></svg></button>

  <div id="deco"></div>
  <div id="hud"></div>

  <div id="sel">
    <div class="ttl">CHOOSE ONE TO PLAY MINIGAME</div>
    <div id="selRow">
      <div class="chc dis" id="cPap"><div class="spr" id="papSpr"></div><div class="nm">PAPYRUS</div></div>
      <div class="chc" id="selCard"><div class="nm" id="selName">SANS</div><div class="st" id="stS"></div></div>
      <div class="chc" id="cGas"><img class="spr" id="gasSpr" src="assets/gaster.png" alt="Gaster" draggable="false"><div class="nm">GASTER</div><div class="st" id="stG"></div></div>
    </div>
    <div id="status"></div>
    <div id="hint">CLICK SANS</div>
  </div>

  <img id="sans" src="assets/sans-shrug.png" alt="Sans" draggable="false">
  <div id="sansSp"></div>

  <img id="gasBig" src="assets/gaster.png" alt="" draggable="false">
  <canvas id="gasCv" style="display:none"></canvas>
  <div id="boxes"><div class="info" id="bxInfo"></div><div id="boxRow"></div></div>
  <div id="qa"><div class="tag" id="qTag"></div><div class="q" id="qText"></div><div id="opts"></div><div id="why"></div></div>
  <div id="wheelBox"><canvas id="wheel" width="600" height="600"></canvas><div class="cap" id="wCap">CLICK TO SPIN</div><button id="wX" aria-label="Close"><svg viewBox="0 0 8 8"><path d="M1 1l6 6M7 1L1 7" stroke="#f34" stroke-width="1.6" fill="none"/></svg></button></div>
  <div id="gamble"><div class="info" id="gInfo"></div><div class="row"><button class="big" id="gYes">YES</button><button class="big" id="gNo">NO</button></div></div>
  <div id="result"></div>
  <div id="summary"></div>
  <button id="sX" aria-label="Back"><svg viewBox="0 0 8 8"><path d="M1 1l6 6M7 1L1 7" stroke="#f34" stroke-width="1.6" fill="none"/></svg></button>

  <div id="dlg"><img id="dhead" src="assets/sans-head.png" alt="" draggable="false"><span class="who">SANS</span><span id="dtxt"></span><div id="dtrans"></div><span class="nxt">▼</span></div>
  <div id="gust"></div>
  <div id="blk"></div>
</div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), sans = $('sans');
  const embed = /[?&]embed/.test(location.search);
  function fit() { const k = Math.min(innerWidth / 1280, innerHeight / 720); stage.style.transform = 'translate(-50%,-50%) scale(' + k + ')'; }

          const s = B * (1 - k * 0.5); g.fillRect(Math.round(x), Math.round(y), s, s);
        }
        g.globalAlpha = 1;
        if (u < 1 + 0.1) requestAnimationFrame(f); else { cv.style.display = 'none'; res(); }
      })();
    });
  }
  async function finishG(st, t) {
    gstatus = st; save(); chk(t);
    await showSummary(t, st === 'ok' ? 'CANDIES RECEIVED' : 'BETTER LUCK NEXT TIME', st === 'ok' ? 'ok' : 'lost', gcandy, true);

  }

  $('bX').addEventListener('click', async () => { token++; cancelAnimationFrame(wheelRaf); await fadeOut(300); await gotoSelect({ instant: true }); await fadeIn(400); });

  // Phím Backspace / Enter không có tác dụng ở slide này (tránh xung đột khi bấm nhầm)
  addEventListener('keydown', (e) => { if (e.key === 'Backspace' || e.key === 'Enter' || e.key === ' ') e.preventDefault(); });

  // trang trí nền: tim, xương, ô vuông trôi lên chậm
  (function () { const d = $('deco'); for (let i = 0; i < 18; i++) { const e = document.createElement('i'); e.className = ['', 'h', 'b', ''][i % 4]; e.style.left = (Math.random() * 96) + '%'; e.style.animationDuration = (9 + Math.random() * 10) + 's'; e.style.animationDelay = (-Math.random() * 18) + 's'; d.appendChild(e); } })();
  // khởi động
  blk.style.opacity = '0';
  initAudio(); try { if (ctx && ctx.state === 'suspended') ctx.resume(); } catch (e) {}
  gotoSelect({ instant: true });
  post('quiz-ready');
  window.__sans95 = { dbg: () => ({ ctx: ctx && ctx.state, gasMus: !!gasMusBuf, gasTalk: !!gasTalkBuf, gasVan: !!gasVanBuf, gasPlaying: !!gasSrc, talk: !!talkBuf, sel: !!selBuf, src: !!selSrc, music: musicWant, mega: !!(megaEl && !megaEl.paused), voices: window.__voices || 0 }), get status() { return status; }, get candies() { return candies; } };
})();
